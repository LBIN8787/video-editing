<title>ytflow 매뉴얼 그래프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 편집 프로그램처럼: 위에 상태 줄, 가운데 작업 화면(흐름·구조·타임라인·편집), 오른쪽 속성 패널 */
:root{
  --bg:#f4f5f8; --panel:#ffffff; --sunk:#eceef3; --fg:#161a23; --muted:#5d6577; --line:#d8dce5;
  --accent:#3358d4; --accent-soft:#e3e9fb;
  --reject:#c8372d; --reject-soft:#fbe5e2; --pass:#1f8a4c; --pass-soft:#ddf3e6; --pend:#b26b00; --pend-soft:#fdf0d9;
  --t1:#d0453a; --t2:#2f7fd1; --t3:#8a5bd6; --t4:#c78a00; --t5:#1f9c8a; --t6:#d4558f; --t7:#5f7a12; --t8:#c4612a; --t9:#64748b;
  --font:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --panel:#1a1e27; --sunk:#151820; --fg:#e7eaf1; --muted:#9aa3b5; --line:#2d3342;
  --accent:#7c9bff; --accent-soft:#232c48;
  --reject:#ff7a6e; --reject-soft:#3a201e; --pass:#5fd394; --pass-soft:#16301f; --pend:#f0b04f; --pend-soft:#35280f;
  --t1:#ff7a6e; --t2:#6aaeff; --t3:#b593ff; --t4:#f0c04f; --t5:#4fd4c0; --t6:#ff8cc0; --t7:#a8c64a; --t8:#ff9a5f; --t9:#a0aec0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --panel:#1a1e27; --sunk:#151820; --fg:#e7eaf1; --muted:#9aa3b5; --line:#2d3342;
  --accent:#7c9bff; --accent-soft:#232c48;
  --reject:#ff7a6e; --reject-soft:#3a201e; --pass:#5fd394; --pass-soft:#16301f; --pend:#f0b04f; --pend-soft:#35280f;
  --t1:#ff7a6e; --t2:#6aaeff; --t3:#b593ff; --t4:#f0c04f; --t5:#4fd4c0; --t6:#ff8cc0; --t7:#a8c64a; --t8:#ff9a5f; --t9:#a0aec0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1440px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:14px}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
.mode{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.live{border-color:var(--pass);color:var(--pass)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.tile b{display:block;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.warn b{color:var(--pend)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,.hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.stage-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.stage-head h2{font-size:14px;margin:0;font-weight:700}
.stage-head .hint{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
aside.inspector{background:var(--panel);border:1px solid var(--line);border-radius:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 24px);overflow:auto}
aside.inspector .in-head{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
aside.inspector .in-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
aside.inspector h3{margin:0;font-size:16px;line-height:1.35;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.chip.reject{background:var(--reject-soft);color:var(--reject);border-color:transparent}
.chip.pass{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.chip.pend{background:var(--pend-soft);color:var(--pend);border-color:transparent}
.chip.must{color:var(--reject);border-color:var(--reject)} .chip.should{color:var(--accent);border-color:var(--accent)} .chip.eye{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rel li button{all:unset;cursor:pointer;display:block;padding:3px 6px;border-radius:4px;font-size:12.5px;width:100%;box-sizing:border-box}
.rel li button:hover,.rel li button:focus-visible{background:var(--sunk)}
.rel small{color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-right:6px}
pre.body{white-space:pre-wrap;font-family:var(--font);font-size:12.5px;background:var(--sunk);padding:10px;border-radius:4px;margin:0;max-height:340px;overflow:auto}
pre.diff{white-space:pre;font-family:var(--mono);font-size:11px;background:var(--sunk);padding:10px;border-radius:4px;margin:0;max-height:420px;overflow:auto}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:5px 11px;font-size:13px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.label{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}
/* 흐름 */
svg text{fill:var(--fg);font-family:var(--font)}
svg .muted{fill:var(--muted)}
.edge{fill:none;stroke-width:1.4;opacity:.38;transition:opacity .15s}
.edge.dim{opacity:.06} .edge.hot{opacity:.95;stroke-width:2.2}
.hit{cursor:pointer}
.node-dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* 구조 */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:14px}
@media (max-width:700px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel);text-align:left;cursor:pointer;min-width:0}
.step:hover{border-color:var(--accent)}
.step .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step strong{font-size:14px}
.step .out{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:0 14px 14px}
.doc{border:1px solid var(--line);border-radius:6px;min-width:0}
.doc h4{margin:0;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.doc h4 small{font-family:var(--mono);color:var(--muted);font-weight:400}
.doc ul{list-style:none;margin:0;padding:4px}
.doc li button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;padding:3px 6px;border-radius:4px;font-size:12.5px}
.doc li button:hover,.doc li button:focus-visible{background:var(--sunk)}
.doc li.sub button{padding-left:18px}
.doc li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat{font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:3px;color:var(--muted)}
.heat.h1{background:var(--accent-soft);color:var(--accent)}
.heat.h2{background:var(--accent);color:#fff}
/* 타임라인 */
.tl-wrap{padding:10px 14px 14px}
/* 편집 */
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:14px}
.card{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:14px}
.card p{margin:0;font-size:12.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:6px 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.editor{padding:0 14px 14px}
.editor textarea{width:100%;min-height:460px;font-family:var(--mono);font-size:12.5px;line-height:1.55;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:10px;resize:vertical}
.cmd{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:4px;padding:8px;overflow-x:auto;white-space:pre}
.pend-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pend-list li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:var(--pend-soft);padding:6px 8px;border-radius:4px}
.pend-list li span{flex:1;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;max-width:min(480px,calc(100vw - 32px))}
.empty{color:var(--muted);font-size:12.5px}
/* 의도 정렬 */
.al{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:600px}
@media (max-width:820px){.al{grid-template-columns:minmax(0,1fr)}}
.al-list{border-right:1px solid var(--line);max-height:860px;overflow:auto;min-width:0}
@media (max-width:820px){.al-list{border-right:0;border-bottom:1px solid var(--line);max-height:320px}}
.al-filter{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.al-filter button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:11.5px;padding:1px 8px}
.al-filter button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.al-item{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;width:100%;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.al-item:hover,.al-item:focus-visible{background:var(--sunk)}
.al-item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.al-item q{font-size:12.5px;quotes:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.al-item small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.st.aligned{background:var(--pass)} .st.misaligned{background:var(--reject)} .st.unreviewed{background:var(--line);outline:1px solid var(--muted)}
.chain{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.link{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.link .num{font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.link .box{display:flex;flex-direction:column;gap:8px;min-width:0}
.link h3{margin:0;font-size:13px}
.quote{font-size:16px;line-height:1.55;margin:0;padding:10px 12px;border-left:3px solid var(--fg);background:var(--sunk);border-radius:0 4px 4px 0}
.reading{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.reading.over,.reading.drift,.reading.under{border-color:var(--reject);background:var(--reject-soft)}
.reading.conflict{border-color:var(--pend);background:var(--pend-soft)}
.reading.aligned{border-color:var(--pass);background:var(--pass-soft)}
.reading .rhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.reading .ex{font-size:12px;white-space:pre-wrap;color:var(--fg);max-height:150px;overflow:auto;margin:0;font-family:var(--font)}
.reading .ex.code{font-family:var(--mono);font-size:11px}
.reading .by{font-size:11px;color:var(--muted)}
.reading select,.reading input{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 6px;font-size:12px}
.reading input{width:100%}
.drift-row{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:12px;padding:6px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.drift-row{grid-template-columns:minmax(0,1fr)}}
.drift-row .u{border-left:3px solid var(--fg);padding-left:8px}
.drift-row .m{border-left:3px solid var(--accent);padding-left:8px;color:var(--muted)}
.pol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.pol{grid-template-columns:minmax(0,1fr)}}
.pol div{font-size:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pol p{margin:0;padding:6px 8px;border-radius:4px;background:var(--sunk)}
/* 작업 절차 */
.proc-wrap{padding:10px 8px 16px;display:flex;justify-content:center}
.proc-wrap svg{width:100%;max-width:560px;height:auto;display:block}
.pnode{cursor:pointer}
.pnode:focus-visible rect,.pnode:focus-visible polygon{stroke:var(--accent);stroke-width:2.5}
.pnode:hover rect,.pnode:hover polygon{stroke:var(--accent)}
.pbox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.pbox.start{fill:var(--sunk)} .pbox.gate{fill:var(--panel)} .pbox.dec{fill:var(--accent-soft);stroke:var(--accent)}
.pbox.pass{fill:var(--pass-soft);stroke:var(--pass)} .pbox.rej{fill:var(--reject-soft);stroke:var(--reject)} .pbox.loop{fill:var(--pend-soft);stroke:var(--pend)}
.parr{stroke:var(--muted);fill:none;stroke-width:1.3}
.parr.back{stroke:var(--reject);stroke-dasharray:4 3}
.parr.loop{stroke:var(--pend)}
.ptxt{font-size:12px;font-weight:700;fill:var(--fg)} .psub{font-size:9.5px;fill:var(--muted)} .plab{font-size:10px;fill:var(--muted)}
.pbadge{fill:var(--reject)} .pbadge-t{fill:#fff;font-size:9px;font-weight:700}
.pgate{fill:var(--sunk);stroke:var(--line)} .pgate-t{font-size:9px;fill:var(--muted);font-family:var(--mono)}
/* 피드백 이야기 */
.story{display:flex;flex-direction:column;gap:12px;padding:14px}
.st-card{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.st-step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:12.5px;align-items:start}
.st-step > span:first-child{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding-top:2px}
.st-step .q{font-size:14px;border-left:3px solid var(--fg);padding-left:8px}
.st-arrow{color:var(--muted);font-size:11px;padding-left:30px}
/* 규칙의 층 */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.tierbtn{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 10px;border-radius:5px;border:1px solid var(--line);border-top:4px solid var(--line);font-size:12px;display:flex;flex-direction:column;gap:2px}
.tierbtn b{font-size:13px} .tierbtn span{color:var(--muted)}
.tierbtn[aria-pressed="true"]{outline:2px solid var(--accent)}
.t-principle{border-top-color:var(--reject)} .t-standard{border-top-color:var(--accent)} .t-style{border-top-color:var(--pass)} .t-trial{border-top-color:var(--pend)}
.tchip-tier{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.tchip-tier.principle{color:var(--reject);border-color:var(--reject)} .tchip-tier.standard{color:var(--accent);border-color:var(--accent)}
.tchip-tier.style{color:var(--pass);border-color:var(--pass)} .tchip-tier.trial{color:var(--pend);border-color:var(--pend)}
.item.principle{border-color:var(--reject)} .item.standard{border-color:var(--accent)} .item.style{border-color:var(--pass)} .item.trial{border-color:var(--pend)}
.item.of{background:var(--pend-soft)}
.item select{font-size:11.5px;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 4px;margin-top:4px}
/* 한눈에 */
.now{padding:14px;display:flex;flex-direction:column;gap:18px}
.now section{display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
.now h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now .lead{margin:0;font-size:12.5px;color:var(--muted)}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.key div{font-size:12px;padding:6px 8px;border-radius:4px;border-left:4px solid var(--line);background:var(--sunk)}
.key .k-pass{border-color:var(--pass)} .key .k-ban{border-color:var(--reject)} .key .k-conf{border-color:var(--pend)} .key .k-mis{border-color:var(--reject);border-left-style:dashed} .key .k-rej{border-color:var(--muted)}
.item{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:5px;border-left:4px solid var(--line);background:var(--sunk);cursor:pointer;font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.item:hover,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.item{display:block} .item > small,.item > b,.item > span{display:block;margin-top:2px} .item .term{display:inline}
.item.pass{border-color:var(--pass)} .item.ban{border-color:var(--reject)} .item.ban.abs{background:var(--reject-soft)} .item.conf-p{border-color:var(--reject)} .item.conf-m{border-color:var(--accent)} .item.mis{border-color:var(--reject);border-left-style:dashed} .item.rej{border-color:var(--muted)}
.item small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:6px}
.conf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:700px){.conf{grid-template-columns:minmax(0,1fr)}}
.conf > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.side{font-size:12px;font-weight:700}
button.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
button.tile:hover,button.tile:focus-visible{border-color:var(--accent)}
/* 용어 */
.term{all:unset;cursor:pointer;border-bottom:1.5px dotted var(--accent);color:inherit}
.term:hover,.term:focus-visible{background:var(--accent-soft)}
.tchip{cursor:pointer;font:inherit;font-size:11.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);white-space:nowrap}
.tchip i{font-style:normal;color:var(--muted);font-size:10.5px;margin-right:4px}

  </div>

<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
let G = window.__MANUAL_GRAPH__ || null;
const STATIC = window.__STATIC__ !== false && !!G;
let LIVE = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cut = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const THEME_VAR = {motion:"--t1",sound:"--t2",background:"--t3",emphasis:"--t4",variety:"--t5",script:"--t6",depth:"--t7",intent:"--t8",length:"--t9"};
const tc = k => `var(${THEME_VAR[k] || "--t9"})`;
let N = {}, OUT = {}, IN = {}, selected = null;
let editorState = {path:null, line:null};

function index(){
  N = {}; OUT = {}; IN = {};
  G.nodes.forEach(n => N[n.id] = n);
  G.edges.forEach(e => { (OUT[e.s] ||= []).push(e); (IN[e.t] ||= []).push(e); });
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.statusText); return j;
}
async function reload(){ G = await api("/api/graph"); TERMPAT = null; index(); renderTiles(); route(); if (selected && N[selected]) inspect(selected); }

function nodeName(n){
  if (!n) return "";
  switch(n.kind){
    case "version": return `v${n.v}`;
    case "review": return `${n.date.slice(5)} ${n.project.replace(/^\d{8}-/,"")}`;
    case "section": { const d = N[n.doc]; return `${d ? d.key : ""} §${n.num.startsWith("h") ? "" : n.num} ${n.label}`.replace("§ ", ""); }
    case "doc": return `${n.key} ${n.label}`;
    case "gate": return `${n.key} ${n.label}`;
    case "step": return `${n.n}. ${n.label}`;
    case "code": return `${n.file.replace("ytflow/stages/","")}:${n.line}`;
    case "intent": return `“${n.quote}”`;
    case "term": return n.name;
    default: return n.label || n.id;
  }
}

/* ---------- 요약 ---------- */
function renderTiles(){
  const s = G.stats;
  const T = [
    [s.rejects + s.passes + (s.feedback || 0), "내 피드백 (검토 + 말)", "", "now:fb"],
    [s.conflicts, "충돌 후보 — 반대 방향 규칙", s.conflicts ? "warn" : "", "now:conf"],
    [`${s.misaligned} / ${s.intents}`, "어긋난 의도 / 사용자 원문", s.misaligned ? "warn" : "", "now:mis"],
    [s.principle_bans, "영구 금지 (원칙만)", "", "now:ban"],
    [s.overfit, "과적합 후보 — 스타일인데 금지·MUST", s.overfit ? "warn" : "", "now:of"],
    [s.passes, "통과한 영상", "", "now:pass"],
    [s.rejects, "기각한 영상", "", "now:rej"],
    [s.pending, "반영 대기", s.pending ? "warn" : "", "edit"],
    [`v${s.manual_version}`, "지금 매뉴얼 버전", "", "timeline"],
    [s.terms, "용어 (스타일·장면·움직임)", "", "terms"],
  ];
  $("#tiles").innerHTML = T.map(([b, l, c, go]) => `<button class="tile ${c||""}" data-goto="${go}"><b>${esc(b)}</b><span>${esc(l)}</span></button>`).join("");
  $("#tiles").querySelectorAll("[data-goto]").forEach(t => t.onclick = () => { const [h, a] = t.dataset.goto.split(":"); nowFocus = a || null;
    if (location.hash === "#" + h) route(); else location.hash = h; });
}

/* ---------- 흐름: 검토 → 버전 → 절·게이트 ---------- */
function renderFlow(){
  if (flowMode === "story") {
    $("#view").innerHTML = `<div class="stage-head"><h2>내 피드백이 매뉴얼이 된 과정</h2>
      <span class="hint">기각 하나마다: 내 말 → 모델이 옮긴 버전 → 바뀐 절·게이트 → 코드 → 그 뒤 같은 영상의 결과. 밑줄 친 말을 누르면 뜻과 구현이 나옵니다.</span>
      <button class="btn" id="fm">연결 그림으로 보기</button></div><div class="story">${feedbackStories()}</div>`;
    const V = $("#view");
    $("#fm").onclick = () => { flowMode = "graph"; renderFlow(); };
    V.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { if (ev.target.closest(".term")) return; inspect(b.dataset.go); });
    V.querySelectorAll("[data-al]").forEach(b => b.onclick = () => { alSel = b.dataset.al; location.hash = "align"; });
    wireTerms(V);
    return;
  }
  const reviews = G.nodes.filter(n => n.kind === "review");
  const versions = G.nodes.filter(n => n.kind === "version");
  const tset = new Set(G.edges.filter(e => e.kind === "touched").map(e => e.t));
  const order = id => { const n = N[id]; if (n.kind === "gate") return [9, 0, n.key];
    const dk = n.kind === "doc" ? n.key : (N[n.doc]?.key || ""); return [0, dk === "README" ? "00" : dk, n.line || 0]; };
  const targets = [...tset].map(id => N[id]).filter(Boolean).sort((a, b) => { const x = order(a.id), y = order(b.id);
    return x[0] - y[0] || String(x[1]).localeCompare(String(y[1])) || (x[2] > y[2] ? 1 : x[2] < y[2] ? -1 : 0); });
  const RH = 24, top = 34;
  const H = top + Math.max(reviews.length, versions.length, targets.length) * RH + 10;
  const W = 1100, xR = 10, wR = 250, xV = 420, wV = 250, xT = 840, wT = 250;
  const pos = {};
  const place = (arr, x, w) => { const off = top + (Math.max(reviews.length, versions.length, targets.length) - arr.length) * RH / 2;
    arr.forEach((n, i) => pos[n.id] = {x, w, y: off + i * RH}); };
  place(reviews, xR, wR); place(versions, xV, wV); place(targets, xT, wT);
  let edges = "", nodes = "";
  G.edges.forEach((e, i) => {
    if (!["applied_in", "approved_in", "touched"].includes(e.kind)) return;
    const a = pos[e.s], b = pos[e.t]; if (!a || !b) return;
    const x1 = a.x + a.w, y1 = a.y + 9, x2 = b.x, y2 = b.y + 9, mx = (x1 + x2) / 2;
    const col = e.kind === "approved_in" ? "var(--pass)" : e.kind === "applied_in" ? (e.how === "inferred" ? "var(--pend)" : "var(--reject)") : "var(--accent)";
    edges += `<path class="edge" data-s="${esc(e.s)}" data-t="${esc(e.t)}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${col}"${e.how === "inferred" ? ' stroke-dasharray="4 3"' : ""}/>`;
  });
  const box = (n, label, fill, stroke, extra = "") => { const p = pos[n.id];
    return `<g class="hit" tabindex="0" role="button" data-id="${esc(n.id)}" aria-label="${esc(label)}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="18" rx="3" fill="${fill}" stroke="${stroke}"/>
      ${extra}<text x="${p.x + 8}" y="${p.y + 13}" font-size="11.5">${esc(label)}</text></g>`; };
  reviews.forEach(n => {
    const lab = cut(`${n.date.slice(5)} ${n.project.replace(/^\d{8}-/, "")} · v${n.manual_version}`, 38);
    const dots = (n.themes || []).slice(0, 3).map((t, i) => `<circle cx="${pos[n.id].x + wR - 8 - i * 9}" cy="${pos[n.id].y + 9}" r="3.2" fill="${tc(t)}"/>`).join("");
    nodes += box(n, lab, n.result === "pass" ? "var(--pass-soft)" : "var(--reject-soft)", "none", dots);
  });
  versions.forEach(n => nodes += box(n, cut(`v${n.v}  ${n.summary.replace(/^v\d+:\s*/, "")}`, 40), "var(--accent-soft)", "none"));
  targets.forEach(n => nodes += box(n, cut(nodeName(n), 38), "var(--sunk)", "var(--line)"));
  const head = (x, t) => `<text x="${x}" y="18" font-size="11" class="muted" letter-spacing=".06em">${t}</text>`;
  $("#view").innerHTML = `
    <div class="stage-head"><h2>사용자 피드백이 매뉴얼을 바꾼 흐름</h2>
      <span class="hint">검토 → 반영된 버전 → 그 버전이 고친 절·게이트. 줄에 올리거나 누르면 연결만 남습니다.</span><button class="btn" id="fm">카드로 보기</button></div>
    <div class="stage-head legend">
      <span><i style="background:var(--reject)"></i>기각 → 반영</span><span><i style="background:var(--pass)"></i>통과 (그 버전 유지)</span>
      <span><i style="background:var(--accent)"></i>버전이 고친 곳</span>
      ${Object.keys(THEME_VAR).map(k => `<span><i style="background:${tc(k)};border-radius:50%"></i>${esc((N["theme:" + k] || {}).label || k)}</span>`).join("")}
    </div>
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:820px;display:block" role="img" aria-label="검토에서 버전, 버전에서 매뉴얼 절로 가는 연결 그림">
      ${head(xR, "검토 (날짜 · 프로젝트 · 당시 버전)")}${head(xV, "매뉴얼 버전")}${head(xT, "고친 절 · 게이트")}
      <g id="edges">${edges}</g><g id="nodes">${nodes}</g></svg></div>`;
  wireGraph();
  $("#fm").onclick = () => { flowMode = "story"; renderFlow(); };
}
function connected(id){
  const set = new Set([id]);
  const walk = (id, dir, depth) => { if (depth > 2) return; ((dir === "out" ? OUT[id] : IN[id]) || []).forEach(e => {
    if (!["applied_in","approved_in","touched"].includes(e.kind)) return;
    const o = dir === "out" ? e.t : e.s; if (!set.has(o)) { set.add(o); walk(o, dir, depth + 1); } }); };
  walk(id, "out", 1); walk(id, "in", 1); return set;
}
function highlight(id){
  const svg = $("#view svg"); if (!svg || !svg.querySelector(".edge")) return;
  const set = id ? connected(id) : null;
  svg.querySelectorAll(".edge").forEach(p => { const on = set && set.has(p.dataset.s) && set.has(p.dataset.t);
    p.classList.toggle("hot", !!on); p.classList.toggle("dim", !!set && !on); });
  svg.querySelectorAll(".hit").forEach(g => g.classList.toggle("node-dim", !!set && !set.has(g.dataset.id)));
}
function wireGraph(){
  document.querySelectorAll("#view .hit").forEach(g => {
    g.addEventListener("mouseenter", () => highlight(g.dataset.id));
    g.addEventListener("mouseleave", () => highlight(selected));
    g.addEventListener("click", () => inspect(g.dataset.id));
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); inspect(g.dataset.id); } });
  });
  if (selected) highlight(selected);
}

/* ---------- 구조: 8단계·게이트·문서·절 ---------- */
function renderMap(){
  const steps = G.nodes.filter(n => n.kind === "step").sort((a, b) => a.n - b.n);
  const rulesBy = g => G.nodes.filter(n => n.kind === "rule" && n.gate === g);
  const checksBy = g => G.nodes.filter(n => n.kind === "check" && n.gate === g).length;
  const cur = G.stats.manual_version;
  const stepHtml = steps.map(s => { const rs = rulesBy(s.gate), m = rs.filter(r => r.level === "MUST").length,
      sh = rs.filter(r => r.level === "SHOULD").length, ey = rs.filter(r => r.level === "EYE").length, t = rs.length || 1, gate = N[s.gate];
    return `<button class="step" data-id="${esc(s.gate)}"><span class="n">${s.n}단계 · ${esc(gate.key)} ${esc(gate.label)}</span>
      <strong>${esc(s.label)}</strong><span class="out">${esc(s.outputs)}</span>
      <div class="bar" title="MUST ${m} · SHOULD ${sh} · EYE ${ey}"><span style="width:${m/t*100}%;background:var(--reject)"></span><span style="width:${sh/t*100}%;background:var(--accent)"></span><span style="width:${ey/t*100}%;background:var(--muted)"></span></div>
      <span class="out">규칙 ${rs.length} (MUST ${m}) · 검사 코드 ${checksBy(s.gate)}</span></button>`; }).join("");
  const docs = G.nodes.filter(n => n.kind === "doc").sort((a, b) => (a.key === "README" ? "00" : a.key).localeCompare(b.key === "README" ? "00" : b.key));
  const docHtml = docs.map(d => {
    const secs = G.nodes.filter(n => n.kind === "section" && n.doc === d.id).sort((a, b) => a.line - b.line);
    const items = secs.map(s => { const lv = s.last_version || s.tag_version; const age = lv ? cur - lv : 99;
      const cls = lv == null ? "" : age <= 3 ? "h2" : age <= 10 ? "h1" : "";
      return `<li class="${s.level === 3 ? "sub" : ""}"><button data-id="${esc(s.id)}"><span class="t">${esc(s.num.startsWith("h") ? "" : s.num + " ")}${esc(s.label)}</span><span class="heat ${cls}">${lv ? "v" + lv : ""}</span></button></li>`; }).join("");
    return `<div class="doc"><h4><button class="btn" style="all:unset;cursor:pointer" data-id="${esc(d.id)}">${esc(d.key)} · ${esc(cut(d.label.replace(/^\d+\.\s*/, ""), 34))}</button><small>${d.lines}줄</small></h4><ul>${items}</ul></div>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="stage-head"><h2>한 편을 만드는 8단계와 게이트</h2><span class="hint">막대: MUST · SHOULD · 사람 눈(EYE) 비율. 누르면 그 게이트의 규칙과 검사 코드.</span></div>
    <div class="pipe">${stepHtml}</div>
    <div class="stage-head"><h2>매뉴얼 문서와 절</h2><span class="hint">오른쪽 표시는 그 절을 마지막으로 바꾼 버전 (진할수록 최근).</span></div>
    <div class="docs">${docHtml}</div>`;
  document.querySelectorAll("#view [data-id]").forEach(b => b.addEventListener("click", () => inspect(b.dataset.id)));
}

/* ---------- 타임라인: 버전 × 피드백 주제 ---------- */
function renderTimeline(){
  const versions = G.nodes.filter(n => n.kind === "version");
  const reviews = G.nodes.filter(n => n.kind === "review");
  const themes = G.nodes.filter(n => n.kind === "theme");
  const L = 150, CW = 28, W = L + versions.length * CW + 20, rowH = 22;
  const rows = [["검토 기각", "rev-r"], ["검토 통과", "rev-p"], ...themes.map(t => [t.label, t.id])];
  const H = 46 + rows.length * rowH + 10;
  const x = v => L + (v - 1) * CW + CW / 2;
  let g = "";
  rows.forEach((r, i) => { const y = 46 + i * rowH;
    g += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="${i % 2 ? "var(--sunk)" : "transparent"}"/>
      <text x="8" y="${y + 15}" font-size="11.5" class="${i < 2 ? "" : "muted"}">${esc(r[0])}</text>`; });
  versions.forEach(v => { const xx = x(v.v);
    g += `<text x="${xx}" y="22" font-size="10" text-anchor="middle" font-family="var(--mono)" class="muted">v${v.v}</text>`;
    if (v.v === 1 || versions[v.v - 2]?.date !== v.date) g += `<text x="${xx - CW/2 + 2}" y="38" font-size="9.5" class="muted">${esc(v.date.slice(5))}</text><line x1="${xx - CW/2}" x2="${xx - CW/2}" y1="28" y2="${H}" stroke="var(--line)"/>`;
    v.themes.forEach(t => { const ri = rows.findIndex(r => r[1] === "theme:" + t), y = 46 + ri * rowH;
      g += `<rect class="hit" data-id="${esc(v.id)}" x="${xx - 10}" y="${y + 4}" width="20" height="${rowH - 8}" rx="3" fill="${tc(t)}" opacity=".85"><title>v${v.v} · ${esc(N["theme:" + t].label)}</title></rect>`; });
  });
  const stack = {};
  reviews.forEach(r => { const target = r.result === "pass" ? r.manual_version : ((OUT[r.id] || []).find(e => e.kind === "applied_in")?.t || "").replace("ver:", "") || r.manual_version;
    const ri = r.result === "pass" ? 1 : 0, key = ri + ":" + target, k = stack[key] = (stack[key] || 0) + 1, y = 46 + ri * rowH + rowH / 2;
    g += `<circle class="hit" data-id="${esc(r.id)}" cx="${x(+target) - 8 + (k - 1) * 6}" cy="${y}" r="4.5" fill="${r.result === "pass" ? "var(--pass)" : "var(--reject)"}" stroke="var(--panel)"><title>${esc(r.date + " " + r.project + " " + (r.result === "pass" ? "통과" : "기각 → 반영 버전"))}</title></circle>`; });
  const cur = x(G.stats.manual_version);
  g += `<line x1="${cur}" x2="${cur}" y1="26" y2="${H}" stroke="var(--accent)" stroke-width="2"/><polygon points="${cur - 5},26 ${cur + 5},26 ${cur},33" fill="var(--accent)"/>`;
  const counts = themes.map(t => ({t, n: reviews.filter(r => r.result === "reject" && r.themes.includes(t.key)).length})).sort((a, b) => b.n - a.n);
  const max = Math.max(1, ...counts.map(c => c.n));
  $("#view").innerHTML = `
    <div class="stage-head"><h2>버전 타임라인</h2><span class="hint">편집 프로그램의 트랙처럼: 가로는 버전, 세로는 피드백 주제. 기각 점은 그 기각이 반영된 버전에, 통과 점은 통과한 버전에 찍힙니다. 파란 막대는 지금 버전.</span></div>
    <div class="scroll tl-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W, 900)}px;display:block" role="img" aria-label="버전별 피드백 주제 타임라인">${g}</svg></div>
    <div class="stage-head"><h2>기각 사유가 가장 많이 겨눈 곳</h2><span class="hint">한 기각이 여러 주제에 걸칠 수 있습니다.</span></div>
    <div class="tl-wrap" style="display:grid;gap:6px">${counts.map(c => `<div style="display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;font-size:12.5px">
      <span>${esc(c.t.label)}</span><div class="bar" style="height:12px"><span style="width:${c.n / max * 100}%;background:${tc(c.t.key)}"></span></div><b style="font-family:var(--mono);text-align:right">${c.n}</b></div>`).join("")}</div>`;
  document.querySelectorAll("#view .hit").forEach(b => b.addEventListener("click", () => inspect(b.dataset.id)));
}

/* ---------- 의도 정렬: 사용자 원문 → 모델 해석 → 매뉴얼·코드 → 결과 ---------- */
let alSel = null, alTheme = "all", alStatus = "all", alDraft = {};
const ST_ORDER = ["unreviewed", "aligned", "over", "under", "drift", "conflict"];
function excerpt(n, themes){
  if (!n) return "";
  if (n.kind === "code") return n.src;
  if (n.kind === "version") return n.summary;
  if (n.kind === "check") return n.label;
  const body = n.body || "";
  const words = Object.entries({motion:["움직","카메라","정적","멈","확대","동적","전환"],sound:["소리","음"],background:["배경","바탕"],emphasis:["강조","자막"],variety:["스타일","반복"],script:["대본","말투","인트로"],depth:["분석","사건"],intent:["의도","시청자"],length:["분"]})
    .filter(([k]) => themes.includes(k)).flatMap(([, w]) => w);
  const lines = body.split("\n").filter(l => l.trim());
  const hit = words.length ? lines.filter(l => words.some(w => l.includes(w))) : [];
  return (hit.length ? hit : lines).slice(0, 6).join("\n");
}

      ${touched.length ? `<div class="st-step"><span>바뀐 곳</span><div class="chips">${touched.map(t => `<button class="chip" style="cursor:pointer" data-go="${esc(t)}">${esc(cut(nodeName(N[t]) || t, 32))}</button>`).join("")}</div></div>` : `<div class="st-step"><span>바뀐 곳</span><span class="empty">버전 요약에 고친 절이 적혀 있지 않아 이을 수 없음</span></div>`}

}

/* ---------- 경로 ---------- */
function route(){
  if (window.matchMedia("(max-width:980px)").matches) { document.querySelector("aside.inspector").setAttribute("data-empty", ""); HIST = []; }
  const h = (location.hash || "#now").slice(1);
  document.querySelectorAll("nav.tabs a").forEach(a => a.getAttribute("href") === "#" + h ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  ({now: renderNow, proc: renderProc, terms: renderTerms, align: renderAlign, flow: renderFlow, map: renderMap, timeline: renderTimeline, edit: renderEdit}[h] || renderNow)();
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", ev => { const t = ev.target; if ((ev.key === "Enter" || ev.key === " ") && t.matches && t.matches('div[role="button"]')) { ev.preventDefault(); t.click(); } });
document.getElementById("in-close").onclick = () => { document.querySelector("aside.inspector").setAttribute("data-empty", ""); HIST = []; selected = null; highlight(null); };
document.getElementById("in-back").onclick = () => { HIST.pop(); const prev = HIST[HIST.length - 1]; if (prev) inspect(prev, true); };

async function boot(){
  if (!G || !STATIC) { try { G = await api("/api/graph"); LIVE = true; } catch (e) { if (!G) { $("#view").innerHTML = `<p style="padding:14px">그래프 데이터를 읽지 못했습니다: ${esc(e.message)}</p>`; return; } } }
  if (LIVE) { const m = $("#mode"); m.textContent = "로컬 도구 연결됨 · 편집 가능"; m.classList.add("live"); }
  else { $("#mode").textContent = `읽기 전용 · ${G.generated.replace("T", " ")} 기준`; }
  index(); renderTiles(); route();
  if (["#flow", "#map", "#timeline"].includes(location.hash)) { const first = G.nodes.find(n => n.kind === "version" && n.v === G.stats.manual_version); if (first) inspect(first.id); }
}
boot();
})();
</script>
