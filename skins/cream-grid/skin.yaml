# 미색 모눈 바탕 + 남색 글씨 + 주황 데이터 + 청록 보조 — AI 해설 롱폼 (2026-11-27, docs/74 레퍼런스 측정값)
# 숫자는 고정폭 글꼴로 '측정값' 느낌을 준다. 옛 시대 장면은 base_era 로 바탕만 따뜻하게.
id: cream-grid
title: 미색 모눈
palette:
  base: '#FAF9F2'
  base_era: '#F4EBD9'      # 과거 장면(1951 등) 바탕
  grid: '#EEF0E6'          # 아주 옅은 모눈선
  ink: '#1F4A5A'           # 남색: 글자·틀·눈
  accent: '#E0703F'        # 주황: 데이터 선·값·경고
  accent2: '#4FB3A5'       # 청록: 사람·좋은 쪽·두 번째 계열
  marker: '#E6C36A'        # 겨자: 형광 밑줄·질문 알약
  card: '#FFFFFF'
  card2: '#F3F4EC'
  muted_text: '#7A8A8F'
  line: '#C9D2CC'
  line2: '#DCE2DC'
  line3: '#E9ECE4'
  dim: '#B4BDB8'
  map_stroke: '#8E9A96'
  tape: '#E9ECE4'
  hatch: '#D9DDD6'         # 미래 구간 빗금 띠
background:
  type: grid
  grid_step: 48
strokes:
  roughness_scale: 0.0
  bowing: 0
  fill_style: solid
  radius: 14               # 카드 모서리
  border: 3                # 카드 남색 테두리 두께
photo:
  tone: none               # 실사 그림은 그대로, 위에 흰 카드
fonts:
  title: NotoSansKR-Bold.ttf
  value: JetBrainsMono-Bold.ttf   # 숫자·값은 고정폭
  box: NotoSansKR-Bold.ttf
  note: NotoSansKR-Medium.ttf
  label: NotoSansKR-Medium.ttf
subtitle:
  font: Noto Sans KR
  size: 50
  color: '&H00FFFFFF'
  outline: '&H00222A2E'
  outline_width: 4
  box: none
  position: bottom-center
  max_lines: 2
badge:
  logo: top-left           # 채널 원형 배지 상시
  chapter: top-right       # '② 예측은 곧 압축' 알약, 장 시작 3초
components:
  compare: bars
  proportion: waffle
  flow: pill
  chapter: pill
  lower: none
