# 누아르 사건 보드 — 거의 검은 바탕, 회백색 글씨, 강조는 빨강 하나뿐, 자료 화면은 강한 흑백 (docs/57 §2-1, 오신트형 구조만)
# 쓰는 곳: 시사(issues) 큰 사건 · 시장 심층의 '누가 누구와 엮였나' 주간. 밝고 가벼운 생활 정보에는 맞지 않음.
# 원칙: 빨강은 '지금 말하는 것' 한 곳에만 — 앞 박자의 빨강은 회색으로 물러남 (hubweb·ledger 장면이 그렇게 움직임)
