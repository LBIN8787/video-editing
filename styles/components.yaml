# 영상의 구성요소 — 카테고리별로 나눈 스타일 (2026-11-20 사용자: "영상의 구성요소를 카테고리별로 나눠서 그 카테고리 안에서 이제 화풍? 스타일? 별로
#   또 나눠달라는거지 그래서 그 각 카테고리에서 각 화풍? 스타일? 들을 조합하여서 영상이 나타난다 이런 원리 느낌으로" ·
#   "영상에 지금까지 쓰인 요소들이 더 많은거같은데 너무 적게 나온거같아서")
#
# 영상 = 카테고리마다 고른 스타일의 조합. 화풍(어떻게 보이나)·구성(무엇으로 보여 주나)·연출(어떻게 움직이나)·소리는 다른 축이라 서로 섞음.
# 보기: python -m ytflow looks --gallery <폴더>/index.html  ('화풍목록 보여줘', skills/looks-gallery)
#   예시 화면은 진짜 렌더러로 만든 것: python scripts/looks_catalog.py [--variants|--features] → ~/.cache/ytflow/looks/scenes/
# 고르기: python -m ytflow look <프로젝트> --set 카테고리=스타일 … → edit.yaml look.<key>
#   motion·illust·footage 는 렌더에 바로 쓰임. 나머지는 이 영상의 기본값 — 장면마다 바꿀 수 있음(장면표·edit-plan).
# 실제로 쓰인 조합(스페인독감·시장·호기심 편): styles/presets.yaml
# media: 예시 파일 (scenes/<키>.mp4 = looks_catalog 렌더, bg/<키>.jpg = 바탕 그림, sfx/<키>.mp3)

categories:
  # ───────────── 화풍 — 어떻게 보이나
  - key: motion
    axis: 화풍
    name: 화면 화풍 (그래픽 팩)
    what: 바탕색·글꼴·선·자막 상자를 한 벌로 — 도형·글자·막대가 '어떻게 보이나'
    source: {looks: motion}
  - key: background
    axis: 화풍
    name: 바탕
    what: 장면 목적에 맞춰 바뀌는 뒷배경 (manual/05 §0-2·§0-6) — 정지한 한 장
    source:
      list:
        film: {name: 필름 알갱이, look: 팩 기본 바탕에 옅은 필름 입자, fits: 대부분의 장면 (기본), media: bg/film.jpg, impl: backdrop.py}
        grid: {name: 모눈, look: 옅은 모눈 — 숫자·차트용, fits: 막대·차트·맞대기·연표·사람 수, media: bg/grid.jpg, impl: backdrop.py}
        spot: {name: 가운데 조명, look: 가운데가 밝고 가장자리가 어두움, fits: 인용·발언·큰 숫자, media: bg/spot.jpg, impl: backdrop.py}
        tint: {name: 장마다 색 기운, look: 장(chapter)마다 다른 옅은 색, fits: 비유·체크리스트·인과 지도, media: bg/tint.jpg, impl: backdrop.py}
        photo: {name: 흐린 자료 사진, look: 그 편의 자료 사진을 흐리게 깔기, fits: 마무리·키네틱 (사진이 있을 때), media: bg/photo.jpg, impl: backdrop.py}
        duotone: {name: 듀오톤 사진, look: 카테고리 두 색으로 칠한 사진, fits: 장 표지 (v15), media: bg/duotone.jpg, impl: backdrop.make_identity}
        cork: {name: 코르크 증거판, look: 갈색 코르크 판, fits: 시사 — 누가 누구와 연결돼 있나, media: bg/cork.jpg, impl: backdrop.make_identity}
        chalk: {name: 칠판, look: 녹회색 칠판과 분필 자국, fits: 호기심 — 원리를 배운다, media: bg/chalk.jpg, impl: backdrop.make_identity}
        dash: {name: 대시보드 모눈, look: 남색 모눈과 연결점, fits: 시장 — 숫자로 시작하는 장, media: bg/dash.jpg, impl: backdrop.make_identity}
        glow: {name: 은은한 빛, look: 움직이지 않는 부드러운 빛, fits: AI 앱 창·사진이 없을 때 듀오톤 대신, media: bg/glow.jpg, impl: backdrop.make_identity}
  - key: chapter
    axis: 화풍
    name: 장 표지
    what: 장(chapter)이 바뀔 때의 표지 — 카테고리마다 모양이 다름 (v15)
    source:
      list:
        board: {name: 증거판 표지, look: 코르크 위 핀 꽂은 장 제목 카드, fits: 시사·시장 (관계 이야기), media: scenes/chapter-board.mp4, impl: identity.chapter_board}
        dash: {name: 대시보드 표지, look: 남색 모눈 + CHAPTER 숫자, fits: 시장 — 다음 장이 숫자로 시작할 때, media: scenes/chapter-dash.mp4, impl: identity.chapter_dash}
        photo: {name: 듀오톤 사진 표지, look: 주제 사진을 두 색으로, fits: 자료 사진이 있는 장 (기본), media: scenes/chapter-photo.mp4, impl: edit10.chapter_photo}
        chalk: {name: 칠판 표지, look: 칠판에 분필 제목, fits: 호기심 — 원리를 배운다, media: scenes/chapter-chalk.mp4, impl: identity.chapter_chalk}
        window: {name: 앱 창 표지, look: 은은한 빛 위에 뜬 창 + 탭 이름, fits: AI — 제품·도구 이야기, media: scenes/chapter-window.mp4, impl: identity.chapter_window}
        paper: {name: 종이 한 장 표지, look: 종이가 밀려 들어오며 제목, fits: 손그림 종이 팩, media: scenes/chapter-paper.mp4, impl: hybrid.s_chapter}
        type: {name: 큰 글씨 표지, look: 화면 가득 큰 글씨, fits: 평면 팩, media: scenes/chapter-type.mp4, impl: graphics.chapter_type}
        two-line: {name: 두 줄 표지, look: 작은 흰 줄 다음 큰 강조색 줄, fits: 앞 장 결론 → 다음 질문, impl: uiflow}
  - key: structure
    axis: 화풍
    name: 관계 그림의 모양
    what: 인과·관계 지도를 카테고리에 맞는 모양으로 (v15 identity.structure)
    source:
      list:
        board: {name: 증거판 (시사·시장), look: 코르크에 핀 꽂은 카드와 붉은 실, fits: 누가 누구와 연결돼 있나, media: scenes/board-evidence.mp4, impl: identity.py board}
        chalk: {name: 칠판 (호기심), look: 칠판 위 분필 화살표와 칸, fits: 원리·과정, media: scenes/chalk-causal.mp4, impl: identity.py chalk}
        paper: {name: 종이 손그림 인과 지도, look: 종이 위 손그림 칸과 화살표, fits: 스페인독감 편처럼 종이 팩, media: scenes/map_causal-paper.mp4, impl: hybrid.s_map_causal}
  - key: slots
    axis: 화풍
    name: 그림 모양 (비교·비율·흐름)
    what: 같은 숫자를 팩마다 다른 그림으로 — 비교는 막대/그림 기호, 비율은 사람/네모 칸/도넛, 흐름은 상자/알약/포스트잇
    source:
      list:
        compare-bars: {name: 비교 — 막대, look: 가로 막대, fits: 평면·슬레이트 팩, media: scenes/compare-bars.mp4, impl: graphics.py compare}
        compare-pictogram: {name: 비교 — 그림 기호, look: 사물 아이콘 줄, fits: 어두운 다큐·포레스트·청사진 팩, media: scenes/compare-pictogram.mp4, impl: graphics.py compare}
        proportion-people: {name: 비율 — 사람 100명, look: 100명 중 N명 색칠, fits: 사람 수로 느끼게, media: scenes/proportion-people.mp4, impl: graphics.py proportion}
        proportion-waffle: {name: 비율 — 네모 칸, look: 100칸 중 N칸, fits: 평면·신문지 팩, media: scenes/proportion-waffle.mp4, impl: graphics.py proportion}
        proportion-donut: {name: 비율 — 도넛, look: 고리 그래프, fits: 미드나이트·어두운 팩, media: scenes/proportion-donut.mp4, impl: graphics.py proportion}
        flow-sticky: {name: 흐름 — 포스트잇, look: 포스트잇 칸과 선, fits: 어두운 다큐·포레스트, media: scenes/flow-sticky.mp4, impl: graphics.py flow}
        flow-pill: {name: 흐름 — 둥근 알약, look: 알약 모양 칸, fits: 평면·슬레이트·미드나이트, media: scenes/flow-pill.mp4, impl: graphics.py flow}
  - key: illust
    axis: 화풍
    name: 삽화 화풍
    what: 실사도 모션그래픽도 어려운 박자에 부분적으로 쓰는 그림의 그림체
    source: {looks: illust}
  - key: footage
    axis: 화풍
    name: 실사 색보정
    what: 인물 실사 소스영상을 한 편 안에서 같은 색으로 묶는 보정
    source: {looks: footage}
  - key: font
    axis: 화풍
    name: 글꼴
    what: 제목·숫자·상자·메모·라벨 칸마다 팩이 고르는 글꼴 (ytflow/assets/fonts)
    source:
      list:
        gothic: {name: 나눔고딕, look: 또렷한 고딕 — 자막·상자·라벨, fits: 거의 모든 팩의 상자·자막, family: "'Nanum Gothic'", weight: 700}
        gothic-x: {name: 나눔고딕 ExtraBold, look: 굵은 고딕 — 제목·큰 숫자, fits: 평면·하얀 평면·미드나이트·키네틱 포스터 제목, family: "'Nanum Gothic'", weight: 800}
        myeongjo: {name: 나눔명조 ExtraBold, look: 무게 있는 명조 — 제목·숫자, fits: 어두운 다큐·증거판·포레스트·슬레이트·신문지·종이 손그림 제목, family: "'Nanum Myeongjo'", weight: 800}
        pen: {name: 나눔손글씨 펜, look: 손글씨 — 메모·주석·칠판 글씨, fits: 칠판 팩 전체, 청사진 메모, 잼 편 손글씨 주석, family: "'Nanum Pen Script'", weight: 400}
        blackhan: {name: 검은고딕 (Black Han Sans), look: 아주 굵은 제목체, fits: 설명 무대(explain) 제목·숫자, family: "'Black Han Sans'", weight: 400}
  - key: subtitle
    axis: 화풍
    name: 자막 모양
    what: 아래 자막의 상자·색·위치 (팩의 subtitle, media.py)
    source:
      list:
        box-navy: {name: 남색 반투명 상자, look: 흰 글씨 + 남색 상자, fits: 종이·평면 팩 (기본), sub: {bg: "rgba(30,42,68,.6)", color: "#fff", pos: bottom}}
        box-black: {name: 검은 반투명 상자, look: 흰 글씨 + 검은 상자, fits: 어두운 팩, sub: {bg: "rgba(0,0,0,.6)", color: "#fff", pos: bottom}}
        amber: {name: 호박색 글씨, look: 호박색 글씨 + 어두운 상자, fits: 어두운 다큐 팩, sub: {bg: "rgba(30,30,30,.55)", color: "#FFE684", pos: bottom}}
        top-dark: {name: 위쪽 진한 글씨, look: 화면 위쪽 진한 글씨 (머니크루식), fits: 무늬 없는 미색 인포그래픽, sub: {bg: "transparent", color: "#1E2A44", pos: top}}
        two-line: {name: 원문·번역 2단, look: 위에 작은 원문, 아래 번역, fits: 인용·원본 발언(bite), sub: {bg: "rgba(0,0,0,.6)", color: "#fff", pos: bottom, orig: true}}
        shorts-big: {name: 쇼츠 큰 자막, look: 큰 흰 글씨 + 검은 테두리, 핵심 낱말 노랑, fits: 훅 쇼츠·말하는 사람 쇼츠, sub: {bg: "transparent", color: "#fff", pos: mid, outline: true}}
        hidden: {name: 자막 숨김, look: 화면 글자가 곧 자막, fits: 키네틱 포스터 팩, sub: {hidden: true}}
  # ───────────── 구성 — 무엇으로 보여 주나
  - key: scene
    axis: 구성
    name: 장면 종류
    what: 한 장면의 뼈대 — 지금까지 영상에 쓴 장면을 진짜 렌더러로 그린 예시 (manual/usage.yaml)
    source: {scenes: true}
  - key: layer
    axis: 구성
    name: 장면 위 겹치기
    what: 장면 하나 위에 층을 하나 더 얹기 (directions.apply_layers)
    source:
      list:
        photo: {name: 액자 사진, look: 장면 한쪽에 자료 사진 액자, fits: 글씨·도형뿐인 장면이 길 때 (시장 §6), media: scenes/layer-photo.mp4, impl: directions.py}
        locator: {name: 위치 미니 지도, look: 구석의 작은 지도에 위치 점, fits: 나라·도시가 나올 때, media: scenes/layer-locator.mp4, impl: directions.py}
        stamp: {name: 타자기 날짜 도장, look: 날짜·장소가 타자기로 찍힘, fits: 자료 화면의 시점·장소, media: scenes/layer-stamp.mp4, impl: directions.py}
        mark: {name: 표시 (동그라미·밑줄·화살표), look: 손그림 표시가 그려짐, fits: 화면의 한 곳을 가리킬 때, media: scenes/layer-mark.mp4, impl: directions.py}
        number: {name: 큰 숫자 카드, look: 장면 위에 큰 숫자 카드, fits: 숫자 하나를 각인, media: scenes/layer-number.mp4, impl: directions.py, avoid: 이 층이 쓰는 저음 효과음(impact-bass)은 사용자 판정으로 쓰지 않음}
        words: {name: 핵심 단어, look: 장면 위에 낱말이 박힘, fits: 핵심어 하나, impl: directions.py}
        line: {name: 하단 타자 한 줄, look: 아래쪽에 한 줄이 타자로, fits: 자료 화면의 설명 한 줄, impl: directions.py}
  - key: fx
    axis: 구성
    name: 장면 안 효과
    what: 장면 전체에 얹는 움직임·질감 (directions.FX) — 시장 채널은 확대·스캔 끔
    source:
      list:
        tilt: {name: 기울여 다가가기, look: 화면이 살짝 기울며 다가옴, fits: 호기심·시사 (시장은 끔 v31), status: hold, media: scenes/fx-tilt.mp4}
        dolly: {name: 앞으로 미끄러지기, look: 카메라가 천천히 앞으로, fits: 호기심·시사 (시장은 끔 v31), status: hold, media: scenes/fx-dolly.mp4}
        scan: {name: 빛 훑기 (스캔), look: 빛줄기가 훑고 지나감, fits: — , avoid: 사용자 판정으로 뺌 (v32 "상황에 안 맞고 과해요"), status: hold, media: scenes/fx-scan.mp4}
        dust: {name: 먼지 입자, look: 떠다니는 먼지, fits: 옛 자료·역사 (한 편 2장면까지), media: scenes/fx-dust.mp4}
        leak: {name: 빛 번짐, look: 필름 빛 번짐이 지나감, fits: 회상·전환 (한 편 2장면까지), media: scenes/fx-leak.mp4}
        photofill: {name: 사진 채우기, look: 사진이 장면 뒤를 채움, fits: 큰 숫자 뒤 맥락, media: scenes/fx-photofill.mp4}
  - key: beat
    axis: 구성
    name: 말에 맞춰 생기는 사물 (박자 motion)
    what: 내레이션이 그 낱말을 말하는 순간 화면에 생기는 것 (motion2.py, 시장 §6 v27)
    source:
      list:
        count: {name: 숫자 세기, look: 말한 숫자가 굴러 올라감, fits: 화면에 없는 숫자를 말할 때, media: scenes/motion-count.mp4}
        icon: {name: 사물 아이콘, look: 말한 사물(은행·공장 …) 아이콘이 생김, fits: 주체·사물, media: scenes/motion-icon.mp4}
        arrow: {name: 화살표, look: 둘 사이에 화살표가 그려짐, fits: 이동·영향, media: scenes/motion-arrow.mp4}
        out: {name: 빠져나감, look: 요소가 밖으로 빠져나감, fits: 유출·감소, media: scenes/motion-out.mp4}
        check: {name: 체크, look: 체크 표시가 찍힘, fits: 확인한 것, media: scenes/motion-check.mp4}
        anchor: {name: 기준선, look: 기준선이 생기고 값이 거기에 붙음, fits: 기준 대비, media: scenes/motion-anchor.mp4}
        pulse: {name: 맥박, look: 지금 말하는 칸이 한 번 뜀, fits: 지금 여기, media: scenes/motion-pulse.mp4}
        folder: {name: 폴더·파일, look: 폴더·파일이 생김, fits: 문서·자료 이야기}
        gear: {name: 톱니, look: 톱니가 돎, fits: 작동 원리}
        type: {name: 타자, look: 낱말이 타자로 찍힘, fits: 이름·용어}
  # ───────────── 연출 — 어떻게 움직이나
  - key: text
    axis: 연출
    name: 글자 연출
    what: 제목·숫자·핵심어가 어떻게 나타나나
    source: {techniques: [글자]}
  - key: graphic
    axis: 연출
    name: 그래픽 연출
    what: 사물·도형·데이터·관계가 어떻게 움직이며 설명하나
    source: {techniques: [선·모양, 데이터, 관계·상태, 화면 나누기, 증거, 겹치기]}
  - key: camera
    axis: 연출
    name: 카메라·깊이
    what: 화면을 어디서 보고 어떻게 다가가나
    source: {techniques: [사진·깊이]}
  - key: transition
    axis: 연출
    name: 장면 전환
    what: 한 장면에서 다음 장면으로 어떻게 넘어가나
    source: {techniques: [이어 주기, 전환]}
  # ───────────── 소리
  - key: bgm
    axis: 소리
    name: 배경음
    what: 내레이션 밑에 까는 음악의 분위기 (시장 채널은 기본 없음)
    source: {bgm: assets/bgm/bgm.yaml}
  - key: sfx
    axis: 소리
    name: 효과음
    what: 장 전환·정리·튀어나옴에 아주 조금 (v12 '덜'이 기본) — 눌러서 들어 보기
    source:
      list:
        whoosh: {name: 휙, look: 장 표지로 넘어갈 때, fits: 장 전환 (push)}
        whoosh-short: {name: 짧은 휙, look: 짧은 넘김, fits: 빠른 전환}
        pop: {name: 톡, look: 튀어나옴, fits: 아이콘 줄(isotype)·작은 등장}
        click-soft: {name: 부드러운 딸깍, look: 체크·선택, fits: 체크리스트}
        riser: {name: 차오름, look: 장 표지 직전, fits: 장 표지 앞}
        chime: {name: 차임, look: 정리판, fits: 장 끝 정리(recap)}
        pencil: {name: 연필 긁기, look: 손그림 선이 그려질 때, fits: 종이 손그림 (직접 만든 소리)}
        impact-bass: {name: 저음 두웅, look: —, fits: —, avoid: 사용자 판정 "소리 자체가 싫다" (2026-11-10) — 쓰지 않음, status: hold}
  - key: voice
    axis: 소리
    name: 목소리
    what: 내레이터 (초안 edge-tts, 업로드 최종본 ElevenLabs — 채널별)
    source:
      list:
        nobel-butler: {name: Nobel Butler, look: 차분한 남성 내레이터 (ElevenLabs), fits: 호기심 (ch-knowledge) — 잼 편 v7}
        mina: {name: Mina, look: 여성 내레이터 (ElevenLabs), fits: 시사 (ch-issues)}
        teo: {name: Teo, look: 남성 브리핑 (ElevenLabs), fits: 시장 이어 읽는 시장 (예비 Sung-ho)}
        hyun-bin: {name: Hyun Bin, look: 남성 (ElevenLabs), fits: 원본 소스형·하이브리드 경제}
        injoon: {name: 인준 (edge-tts), look: 초안용 무료 음성, fits: 모든 채널 초안 — 업로드 전 교체}
  # ───────────── 포장
  - key: thumbnail
    axis: 포장
    name: 썸네일 레이아웃
    what: 제목·썸네일 A/B/C 의 틀 (thumbnail.py, prompts/thumbnail.md)
    source:
      list:
        photo: {name: 사진 + 큰 두 줄, look: 흑백 자료 사진 + 큰 두 줄 + 빨간 동그라미·도장, fits: 시사·역사·시장 (가장 많이 씀)}
        versus: {name: 숫자 맞대기, look: 종이 위 두 숫자 맞대기 (어두운 판은 punch 처럼), fits: 대비가 핵심인 편}
        board: {name: 그림판, look: 종이 + 같은 선 그림 + 큰 글씨, fits: 호기심 이야기형}
        punch: {name: 시장 펀치, look: 컬러 사진 + 노란 상자 강조 + ▲▼ 숫자 칩, fits: 시장 (2026-11-19)}
