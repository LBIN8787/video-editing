<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
:root{--base:#FAF9F2;--grid:#EEF0E6;--ink:#1F4A5A;--accent:#E0703F;--teal:#4FB3A5;--marker:#E6C36A;--muted:#7A8A8F;--line:#C9D2CC;--hatch:#D9DDD6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--base);font-family:"Noto Sans KR",sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);background-size:48px 48px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(31,74,90,.06) 100%);pointer-events:none}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.it{position:absolute;width:max-content}
.mono{font-family:Consolas,monospace}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 10px 28px rgba(31,74,90,.12)}
.chip{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:800;font-size:28px}
.hl{background:linear-gradient(transparent 58%,rgba(230,195,106,.8) 58%)}
.cover{position:absolute;inset:0;overflow:hidden;display:none;background:#0d1c22}
.cover img{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;transform-origin:50% 50%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,26,.15) 0%,transparent 35%,transparent 60%,rgba(10,20,26,.55) 100%)}
.ctitle{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:Consolas,monospace;font-size:120px;font-weight:700;color:#FFF7E6;text-shadow:0 4px 30px rgba(0,0,0,.5);z-index:2;letter-spacing:4px}
.csub{position:absolute;left:0;right:0;top:270px;text-align:center;font-size:40px;font-weight:800;color:var(--marker);z-index:2;text-shadow:0 2px 16px rgba(0,0,0,.6)}
#logo{position:absolute;left:32px;top:28px;width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;border:4px solid var(--marker);z-index:5}
#chap{position:absolute;right:40px;top:36px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 18px 6px 8px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;z-index:5}
#chap b{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
#sub{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:50px;font-weight:700;color:#fff;line-height:1.28;z-index:6;
 text-shadow:-3px -3px 0 #222A2E,3px -3px 0 #222A2E,-3px 3px 0 #222A2E,3px 3px 0 #222A2E,0 3px 0 #222A2E,0 -3px 0 #222A2E,3px 0 0 #222A2E,-3px 0 0 #222A2E,0 0 12px rgba(0,0,0,.35)}
/*EXTRA_CSS*/
</style></head><body>
<div id="bg"></div><div id="world"></div><div id="vig"></div><div id="covers"></div>
<div id="logo">YF</div><div id="chap"></div><div id="sub"></div>
<script>/*TL*/</script>
<script>/*ENGINE*/</script>
<script>/*SCENES*/</script>
<script>render(0)</script>
</body></html>
