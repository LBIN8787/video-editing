# AI 꿀팁 쇼츠 (세로 9:16). 벤치마킹: #클로드코드·#ai꿀팁·#claudecode 이번 달 상위 쇼츠 (STYLE.md)
edit:
  style: shorts
  style_ref: shorts-aitips
  width: 1080
  height: 1920
  card_width: 1920            # 카드는 가로로 그려 세로 화면 가운데에 줄여 넣음
  card_height: 1080
  font: "NanumGothic"
  subtitle_size: 70
  subtitle_chars: 14          # 쇼츠 자막은 짧게 (한 줄 14자)
  subtitle_outline: 6
  subtitle_margin_v: 330      # 가운데 화면 바로 아래 (아래쪽 유튜브 UI 위)
  subtitle_box: false
  emphasis_color: "&H003BD4FF"   # 노랑 #FFD43B
  label_position: bottom_right
  fade_in: 0.0
  push_in: 0.0
  paper:
    base: '#0B0B0D'
    ink: '#FFFFFF'
    red: '#FFD43B'
    anim_seconds: 0.8
tts:
  rate: "+18%"                # 쇼츠는 빠르게
