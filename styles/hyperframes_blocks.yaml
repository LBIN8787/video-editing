# HyperFrames 블록 — 이미 설치된 도구(tools/external.json: hyperframes@0.8.190) 안의 블록을 우리 구성요소 카테고리로 고른 목록
# (2026-11-20 사용자 "응" — docs/53 §1·§5-1 'HyperFrames 블록 정리')
#
# 원본: heygen-com/hyperframes v0.8.190 registry/ — 블록 210 · 컴포넌트 238 · 예시 8 = 456개. 전체 목록(카테고리별 이름): docs/53 부록 A
# 라이선스: 저장소 Apache-2.0. 40개는 항목에 따로 적힘(대부분 "Apache-2.0 AND MIT", 글꼴이 든 것은 OFL-1.1) — 쓰기 전에 registry-item.json 다시 확인
# 넣기: tools/hyperframes 에서  npx hyperframes add <이름>  → compositions/<이름>.html (원본 HTML, 고쳐 씀)
# 고른 기준: 설명형(정보·이야기)에 맞고, 우리 기준과 부딪히지 않는 것. 홍보·제품 광고 전용(ad-template·social 카드)과
#   화려한 셰이더 배경은 뺐습니다. 부딪히는 것은 caution 에.
#
# maps_to : styles/techniques.yaml 의 기법 id — 그 기법을 구현할 때 이 블록을 먼저 열어 봄 (techniques.yaml 은 잠금 대상이라 여기서 잇습니다)
# fit     : good 바로 맞음 · adapt 고쳐 쓰면 맞음 · hold 우리 기준과 부딪힘(쓰기 전 사용자 확인)

text:      # 글자 연출
  per-word-rise:        {what: 낱말이 흐림→선명하게 차례로 올라와 앉음, maps_to: split-reveal, fit: good}
  staggered-fade-up:    {what: 낱말이 하나씩 떠오름 (간단판), maps_to: split-reveal, fit: good}
  scramble-reveal:      {what: 섞인 글자가 왼쪽부터 진짜 글자로 굳음 (결정적·시크 안전), maps_to: scramble, fit: good}
  matrix-decode:        {what: 같은 계열, 더 짧은 판, maps_to: scramble, fit: adapt}
  count-up:             {what: 값 사이를 세며 오르고 작게 '툭' 앉음, maps_to: count-up, fit: good}
  number-wheel:         {what: 숫자 바퀴가 굴러 바뀜 (가격·점수), maps_to: count-up, fit: good}
  slot-machine-roll:    {what: 세로 릴이 한 값에서 다른 값으로, maps_to: count-up, fit: adapt}
  marker-highlight:     {what: 문장이 앉은 뒤 강조 낱말에 손그림 형광펜·동그라미·밑줄 한 번, maps_to: rough-highlight, fit: good}
  vox-annotate:         {what: 문장 속 낱말에 마커 + 가는 선이 작은 설명 라벨까지 그려짐, maps_to: rough-highlight, fit: good}
  inline-highlight:     {what: 글자 뒤로 형광펜이 깔림 (깔끔판), maps_to: rough-highlight, fit: good}
  hw-underline:         {what: 손그림 물결 밑줄·두 번 그은 취소선·괄호, maps_to: rough-highlight, fit: good}
  hw-callout-circle:    {what: 떨리는 타원이 대상을 감싸고 손글씨 라벨, maps_to: rough-highlight, fit: good}
  strikethrough-replace: {what: 옛 글자에 줄 긋고 새 글자로 — '정정·반전' 숫자, maps_to: "", fit: good, note: 기법 목록에 없음 → 후보}
  titlecard-calm:       {what: 작은 머리말 + 큰 제목이 조용히 떠올라 거의 안 움직임, maps_to: chapter-two-line, fit: good}
  hw-write-title:       {what: 손글씨 제목이 획 순서대로 써짐 (Caveat 글꼴 — 한글 아님), maps_to: "", fit: adapt, note: 한글 글꼴로 바꿔야 함}
  typewriter:           {what: 한 글자씩 + 깜빡이는 커서, maps_to: "", fit: good}
  kinetic-center-build: {what: 낱말이 오른쪽에서 들어와 문장을 밀며 가운데 정렬로 완성, maps_to: "", fit: adapt, caution: 키네틱은 훅·결론에만}
  headline-slam:        {what: 큰 제목이 떨어져 흔들리며 앉음, maps_to: "", fit: hold, caution: '쾅 하는 강조 — 강조 예산·impact 소리 싫음(2026-11-10)과 부딪힘'}

graphic:   # 그래픽·데이터·관계 연출
  bar-chart-race:       {what: 순위 막대가 시간 따라 앞지름, 축이 늘어남, maps_to: bar-race, fit: good}
  chart-story:          {what: 막대→선→도넛을 읽는 순서대로 쌓고 정확한 값에 앉음, maps_to: chart-morph, fit: good}
  data-chart:           {what: 막대+선 차트, 신문(NYT풍) 글자, maps_to: "", fit: good}
  decline-chart:        {what: 선이 내려가며 숫자가 줄고 배경이 같이 어두워짐, maps_to: "", fit: good, note: '하락 장면 (시장)'}
  conic-progress-ring:  {what: 원형 진행률이 숫자와 함께 참, maps_to: "", fit: good}
  world-map:            {what: 나라별 색칠 지도 + 돌아가는 지구 (D3 Natural Earth), maps_to: "", fit: good, note: 이미 있는 choropleth 와 비교}
  us-map-flow:          {what: 도시 사이 연결 호 (출발→도착 흐름), maps_to: motion-path, fit: adapt}
  flowchart:            {what: 쪽지 모양 노드 + 연결선 결정 나무, maps_to: "", fit: adapt, note: 커서 상호작용 장식은 뺌}
  svg-stroke-trace:     {what: SVG 길을 길이 재서 그려 감, 닫힌 길은 채움, maps_to: draw-on, fit: good}
  whiteboard-ink:       {what: 화이트보드 스케치를 한 획씩 + 펜촉이 따라감, maps_to: draw-on, fit: good, note: '화이트보드 화풍 시안의 바탕 (docs/53 §5-3)'}
  outline-draw:         {what: 둥근 테두리가 시계 방향으로 그려져 칸을 '증명', maps_to: draw-on, fit: good}
  stagger-cascade:      {what: 격자 카드가 고른 간격으로 차례 등장, maps_to: stagger, fit: good}
  arc-motion-path:      {what: 라벨이 곡선을 따라 날아감 (GSAP MotionPath), maps_to: motion-path, fit: good}
  offset-path-traveler: {what: 길 따라 기울며 이동, 곡선으로 들고 남, maps_to: motion-path, fit: good}
  facet-morph:          {what: 삼각형 36개 덩어리가 세 모양 사이로 바뀜 (로우폴리), maps_to: morph, fit: adapt}
  morph-swap:           {what: A 가 줄어들며 B 로 모양 바뀜 (같은 중심), maps_to: morph, fit: good}
  comparison-split:     {what: 전/후 두 화면, 칸막이가 쓸고 지나가 멈춤, maps_to: split-screen, fit: good}
  before-after-wipe:    {what: 같은 계열 (칸 두 개를 슬롯으로), maps_to: split-screen, fit: good}
  spotlight-card:       {what: 카드에 커서 조명·빛나는 테두리, maps_to: spotlight, fit: adapt}
  exploded-stack:       {what: 아이소메트릭 층판이 벌어져 층마다 라벨, 다시 합쳐짐 (three.js), maps_to: "", fit: good, note: '아이소메트릭 화풍 시안의 바탕 (docs/53 §5-3)'}
  stop-motion-cadence:  {what: 시간을 끊어(초당 n장) 종이 조각이 뚝뚝 움직임, maps_to: "", fit: good, note: '종이 디오라마 화풍 시안의 움직임'}
  terminal-simulator:   {what: 터미널에 명령이 쳐지고 결과가 흐름, maps_to: "", fit: good, note: 이미 있는 terminal 장면과 비교 (AI)}
  typed-prompt:         {what: 프롬프트가 사람 박자로 쳐지고 고쳐 씀, maps_to: "", fit: good, note: AI 채널}
  chat-thread:          {what: 메신저 대화 화면 한 장면, maps_to: "", fit: adapt, note: 이미 있는 chat 장면과 비교}
  cursor-annotate:      {what: 마커 펜이 들어와 영역을 고리·밑줄·화살표로 그리고 나감, maps_to: rough-highlight, fit: good}

camera:    # 카메라·깊이
  push-in:              {what: 한 번의 느린 다가가기로 집중, maps_to: "", fit: good}
  pull-back-reveal:     {what: 숫자 하나에서 물러나며 그 숫자를 설명하는 제목·카드가 드러남, maps_to: pull-back, fit: good}
  pan-stations:         {what: 옆으로 이어진 정거장을 카메라가 차례로 옮겨 가며 멈춤, maps_to: "", fit: good, note: '과정·연표 (공급망 3단계 등)'}
  focus-rack:           {what: 깊이가 다른 두 카드 사이 초점 이동 (흐림·어둡기·시차), maps_to: parallax-photo, fit: good}
  rack-focus:           {what: 같은 것을 WebGL 진짜 보케로, maps_to: parallax-photo, fit: adapt}
  camera-dolly-zoom:    {what: 다가가며 화각을 반대로 — 배경이 늘어나는 '현기증' 줌, maps_to: "", fit: hold, caution: 강한 연출, 한 편 1번 이하}
  drift-hold:           {what: 멈춘 카드가 아주 작게 숨 쉼 (고리 반복), maps_to: "", fit: good, note: '정지 화면이 죽어 보일 때'}
  scroll-camera-story:  {what: 긴 장면을 위→아래로 지나가며 층마다 시차, maps_to: parallax-photo, fit: adapt}
  camera-rig-depth-stack: {what: 3D 카드 더미, 깊이·시차·초점 이동, maps_to: "", fit: adapt}

transition: # 장면 전환
  match-cut:            {what: 원이 빨라지다 한 프레임에 장면이 바뀌고 같은 원으로 이어짐, maps_to: match-move, fit: good}
  text-match-cut:       {what: 한 줄 글자가 움직이는 도중 다른 글자로 바뀜, maps_to: match-move, fit: good}
  type-match-cut:       {what: 제목이 갈라지고 그 틈에서 다음 화면이 자라남, maps_to: match-move, fit: adapt}
  iris-reveal:          {what: 원이 열리며 다음 장면, maps_to: shape-iris, fit: good}
  fade-through:         {what: 한 겹 사라지고 바탕을 거쳐 다음 겹 (차분), maps_to: xfade-pack, fit: good}
  directional-wipe:     {what: 한 판이 다른 판 위로 밀려 들어옴, maps_to: xfade-pack, fit: good}
  torn-paper-rip:       {what: 종이가 찢어지며 흰 속살이 보이고 들려 나감, maps_to: "", fit: good, note: '종이 디오라마·손그림 계열 전환'}
  paper-collage-reveal: {what: 찢은 종이 조각들이 흩날리며 아래 내용이 드러남, maps_to: "", fit: good, note: '종이 디오라마·콜라주 계열'}
  hw-scribble-transition: {what: 낙서 띠가 화면을 덮었다 걷힘, maps_to: "", fit: good, note: 손그림·화이트보드 계열}
  parallax-unzoom:      {what: 꽉 찬 카드가 줄어들며 이웃 카드들이 들어와 격자 — '이것도 여럿 중 하나', maps_to: pull-back, fit: good}
  parallax-zoom:        {what: 가운데 카드가 커지며 화면을 채움 (반대 방향), maps_to: zoom-into, fit: hold, caution: zoom-into 가 보류(hold) 상태}
  whip-pan:             {what: 셰이더 휩 팬, maps_to: whip-pan, fit: hold, caution: 휩 팬 보류(hold)}
  flash-through-white:  {what: 흰 번쩍임 교차, maps_to: gl-transitions, fit: hold, caution: 셰이더 전환 보류(hold)}

motion:    # 화면 화풍(바탕·질감) — 스킨 위에 얹는 층
  grain-overlay:        {what: 움직이는 필름 입자 (CSS) — 따뜻함·아날로그, fit: good}
  vignette:             {what: 가장자리 어둡게 (CSS), fit: good}
  light-sweep-pass:     {what: 빛 띠가 한 번 지나가며 그림자·밝은 곳이 따라 바뀜, fit: adapt}
  ink-bleed-reveal:     {what: 잉크가 종이에 번졌다 줄며 표시가 드러남, fit: adapt, note: 손그림·종이 계열 장 표지}
  grain-field:          {what: 점 무늬가 아주 천천히 흐르는 바탕 (반복), fit: adapt}
  halftone-field:       {what: 망점이 흐르는 빛 바탕 (WebGL), fit: hold, caution: 바탕이 움직이면 글자가 덜 읽힘}

examples:  # 통째 예시 — 화면 화풍 비교용
  warm-grain:  {what: 크림 바탕 + 입자, 비교: paper-sketch·clean-flat}
  nyt-graph:   {what: 신문 지면 차트, 비교: newsprint}
  swiss-grid:  {what: 스위스 격자 배치, 비교: clean-white}
  vignelli:    {what: 굵은 글자 + 빨강 강조, 비교: kinetic-poster}
  decision-tree: {what: 갈래가 나뉘는 흐름도}
