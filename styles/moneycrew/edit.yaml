# 머니크루 레퍼런스 영상에서 자동 측정 + 프레임 검토로 고친 편집 설정
# 자동 판정은 renderer=paper 였으나 프레임 확인 결과 무늬 없는 평면 인포그래픽 → flat 렌더러
edit:
  style: flat
  style_ref: moneycrew
  font: "NanumGothic"
  subtitle_size: 44
  subtitle_position: top      # 자막은 화면 위쪽 가운데
  subtitle_dark: true         # 어두운 글씨, 상자·외곽선 없음
  subtitle_box: false
  emphasis_color: "&H00384FF0"   # 강조 = #F04F38 (빨강)
  label_position: bottom_right
  paper:                      # 애니메이션 엔진 색 (flat 렌더러도 이 이름을 씀)
    base: '#F7F6F0'
    ink: '#1C2B3A'
    red: '#F04F38'
    anim_seconds: 1.0
  bgm_hint: 레퍼런스에 배경음악이 깔려 있음 → edit.bgm 에 음원 파일을 지정하세요
