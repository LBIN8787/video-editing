# 시각효과 카탈로그 — 연출(장면 종류)·전환·겹치기를 '예시 사진'과 함께 고르는 목록
# (2026-11-20 사용자: "각 스타일 즉 화풍들 내가 나중에 골라서 이거로 해줘 할 수 있도록 분류하고 예시사진들도 넣어줘 —
#  말로만 하면 내가 나중에 이게 뭐였지? 하고 까먹으니까 이는 공통규칙이야" · "모든 연출 화풍 뭐 그런것들 말이야 결국 시각효과니까")
#
# 쓰이는 곳: ① 연출 예시 목록 페이지(따로 둔 완성본, scripts/visual_page.py → https://claude.ai/artifact/SPHyXdpGmcdPwMQu7cpMdP)
#            ② 장면별 만드는 법 styles/hybrid/scenes/<장면>.md (scripts/visual_spec.py --md — 손으로 쓴 파일은 그대로)
#   화풍·자막·소리까지 섞어 고르는 '영상 구성요소 목록'(styles/components.yaml, skills/looks-gallery)과 같은 장면을 다룸 — 이 파일은 연출의 '만드는 법' 쪽.
#
# 고르기: "statecard 로 해줘", "전환은 iris_out 으로" 처럼 id 로 말하면 대본(hybrid.json)의 type·키로 씁니다.
# 예시: scripts/visual_catalog.py 가 실제로 렌더 → <예시 폴더>/scenes/<id>.jpg(세 컷) · scenes/clips/<id>.mp4(영상) · styles/visuals/<id>.json(그 대본·움직임 순서)
# 새 장면 종류·전환·효과를 만들면 → 여기 한 항목(+ build) + visual_catalog.py + visual_spec.py --md + visual_page.py 로 페이지 다시 올리기 (공통 규칙).
#
# group: 박자가 '무엇을 보여 줘야 하나'로 묶음 (docs/45 §1 원칙: 감정 → 인물, 동작 → 연속 동작, 구조 → 모션그래픽, 크기 → 데이터, 증거 → 실제 자료)
# key:   대본에 쓰는 법 (type 또는 키)
# note:  예시 그림에 대한 주의 (실사 자리 등)
# technique: 같은 연출의 기법 id (styles/techniques.yaml) — 구성요소 목록의 그 카드가 그림 대신 이 실제 렌더 영상을 보여 줌

groups:
  data: 숫자·크기 비교
  structure: 구조·흐름·인과
  evidence: 증거·원문·실제 화면
  footage: 실사 영상
  map: 지도·장소
  story: 이야기·그림·애니메이션
  chapter: 장 나누기·정리·강조 문장
  transition: 장면 사이 전환
  overlay: 겹치기 (다른 장면 위에 얹는 것)

scene:
  bars:
    name: 가로 막대
    group: data
    key: '"type": "bars"'
    what: 막대가 하나씩 자라며 값 비교, 강조 막대만 강조색
    fits: 셋 이상 값의 크기 비교, 순위
    build:
      - "제목 아래 세로 막대들이 왼쪽부터 차례로 손그림 선으로 그려지고, 막대마다 이름·값이 떠오르며 값은 0부터 세어 올라감"
      - "emph 로 고른 막대 하나만 강조색, 나머지는 먹색"
      - "단위(unit)는 오른쪽 위 작은 글자, 출처(label)는 오른쪽 위 꼬리표"
  bignum:
    name: 큰 숫자
    group: data
    key: '"type": "bignum"'
    what: 화면 가운데 큰 숫자가 세어 올라가고 밑줄, 다음 박자에 비교 기준
    fits: 숫자 하나가 핵심일 때 (비교 기준과 함께)
    build:
      - "가운데 위 작은 설명줄(small) → 아주 큰 숫자(value, 세어 올라감) → 숫자 밑 강조색 손그림 밑줄"
      - "두 번째 박자에 compare 가 있으면 아래에 '기준 이름 + 형광펜 + 값' 한 줄"
      - "숫자는 하나만 — 비교 기준은 compare 나 대사가 맡음"
  versus:
    name: 둘 맞대기
    group: data
    key: '"type": "versus"'
    what: 왼쪽·오른쪽 아이콘 + 큰 숫자 + vs, 이어서 동그라미·질문
    fits: 두 값·두 회사·전과 후
    build:
      - "화면 좌우 28%·72% 자리에 아이콘 → 큰 숫자(세어 올라감) → 이름, 왼쪽 먹색·오른쪽 강조색, 가운데 'vs'"
      - "두 번째 박자: 오른쪽 숫자에 손그림 동그라미 + 아래 질문(question) 한 줄"
  compare:
    name: 비교표
    group: data
    key: '"type": "compare"'
    what: 두 열 표가 줄마다 채워짐
    fits: 항목 여러 개를 두 대상으로 비교
    build:
      - "두 열(cols) 머리글 → 행(rows)마다 왼쪽 이름·두 값이 차례로 쓰이고 손그림 가로줄"
      - "박자 upto 로 몇 행까지 보일지 정함 — 행을 박자에 나눠 공개"
  chart:
    name: 시세 선 그래프
    group: data
    key: '"type": "chart", "ticker": ...'
    what: 실제 시세 선이 그려지고 마지막 구간 강조 + 값
    fits: 주가·지수·환율의 최근 흐름 (시장 채널)
    build:
      - "실제 시세(marketdata, ticker·period)를 최근 60일로 잘라 먹색 선을 그림, 오른쪽 가격 눈금"
      - "마지막 n일(focus_last)을 강조색 굵은 선 + 동그라미, 마지막 값은 선과 안 겹치는 빈자리에"
      - "다음 박자 stamp → 도장. 시장 채널은 확대 없음(zoom off)"
  isotype:
    name: 사물 아이콘 줄
    group: data
    key: '"type": "isotype"'
    what: 아이콘 N개 중 일부가 흐려지며 빠짐
    fits: "'10통 중 3통' 같은 몫을 물건으로 느끼게"
    build:
      - "아이콘(icon) total 개를 한 줄로 → 그중 lost 개가 흐려지며 빠짐"
      - "before·after 숫자 라벨 2개가 차례로 — '10통 중 3통'을 물건으로"
  people:
    name: 100명 그림
    group: data
    key: '"type": "people"'
    what: 사람 아이콘 100개 중 일부가 빨갛게
    fits: 비율을 '사람'으로 (3명 중 1명)
    build:
      - "사람 아이콘 100개(10×10, scatter 면 흩어짐) → count 명이 강조색으로 채워짐"
      - "오른쪽 큰 숫자(세어 올라감) + 설명·출처 줄"
  share:
    name: 전체 중 몫
    group: data
    key: '"type": "share"'
    what: 전체 막대(100%)에 부분이 차례로 채워지고 눈금·괄호로 합계
    fits: 매출 중 지역 비중, 전체 대비 몫
    build:
      - "가로 전체 막대(100%) 테두리 → parts 가 왼쪽부터 차례로 채워짐(색 다름)"
      - "mark 위치에 비교 눈금(예: 3분의 1), sum 이면 묶을 구간 위에 괄호 + 합계 문구"
      - "explain 무대: 앞 박자 요소는 남고 show 에 적은 부품만 새로 나옴, at 으로 대사 단어에 맞춤"
  spread:
    name: 두 값 사이 간격
    group: data
    key: '"type": "spread"'
    what: 재료 → 공정 → 제품, 두 가격 높이와 괄호로 차이, 값이 바뀌면 옛 높이는 점선
    fits: 마진·스프레드·가격 차이가 어디서 생기나
    build:
      - "위: 재료 → 공정 → 제품 아이콘(steps)을 화살표로 이음"
      - "아래: 두 값(low·high) 높이의 막대 + 점선 연장, diff 괄호에 이름·식"
      - "change: 한쪽 값이 바뀌면 옛 높이는 점선 윤곽으로 남고 간격이 줄어듦"
  apartments:
    name: 칸 채우기 (세대 수)
    group: data
    key: '"type": "apartments"'
    what: 작은 칸(세대) 수백 개 중 대기·취소가 색으로 채워짐
    fits: 수백~수천 단위의 몫을 한눈에
    build:
      - "작은 칸(세대) total 개를 20열 격자로 → waiting 칸이 노랗게, cancel 칸이 빨갛게 차례로 칠해짐"
      - "아래 범례·형광펜 설명 — 큰 수의 몫을 '아파트 동'으로"
  parking:
    name: 주차장 칸
    group: data
    key: '"type": "parking"'
    what: 주차 칸이 차례로 차거나 비는 그림
    fits: 공급·수요, 자리가 차고 비는 비유
    build:
      - "주차장 칸 격자(먹색 칸) → 빈 칸만 흰색으로 남고, 오른쪽 큰 비율 숫자"
      - "빈자리 비율처럼 '거의 다 찼다'를 보여 줄 때"
  funnel:
    name: 깔때기
    group: structure
    key: '"type": "funnel"'
    what: 단계마다 좁아지는 막대
    fits: 단계별로 줄어드는 수 (지원 → 합격 → 등록)
    build:
      - "단계(bars)마다 가로 막대가 위에서 아래로 좁아지며 그려짐, 막대마다 값(세어 올라감)·설명"
      - "박자 upto 로 몇 단계까지 보일지"
  map_causal:
    name: 인과 지도
    group: structure
    key: '"type": "map_causal" + 대본 map'
    what: 칸과 손그림 화살표가 자라는 지도, 지금 이야기하는 칸이 강조. 박자 cut 으로 화살표가 빨간 점선 + X
    fits: A 때문에 B, B 때문에 C — 원인과 결과의 길
    build:
      - "대본 공통 map.nodes(칸 위치 x·y·이름·아이콘)를 한 영상 내내 같은 지도로 씀"
      - "박자마다 reveal(칸 등장) → draw(손그림 화살표, 다른 칸을 피해 ㄱ자·우회 경로) → active(지금 칸 강조색) → tag(칸 옆 형광펜 메모)"
      - "cut: 그린 화살표를 지우지 않고 빨간 점선 + X 로 (uiflow.cut_link)"
  statecard:
    technique: card-state   # 구성요소 목록의 연출 카드(styles/techniques.yaml)에 이 실제 렌더 예시를 붙임
    name: 상태 카드 (+ 가운데 주체)
    group: structure
    key: '"type": "statecard"'
    what: 같은 카드가 대기 → 진행(•••) → 성공(✓)·실패(빨간 X)로 바뀜, 가운데 주체와 연결선이 끊기기도
    fits: AI·앱이 '무엇을 대신 하나', 단계마다 결과가 나는 일 (AI 채널)
    avoid: 실제 화면 녹화가 있으면 그쪽 우선 — 재연에는 '연출' 고지가 자동으로 붙음
    build:
      - "hub 가 있으면 가운데 원(아이콘·이름, 둥실)과 둘레 카드(최대 6, 좌우 배치), 선이 hub → 카드로 그려짐. 없으면 카드만 가로로"
      - "카드 = 흰 둥근 카드(아이콘·이름·작은 줄) + 오른쪽 위 상태 배지 4개(◷ 대기·••• 진행·✓ 성공·✕ 실패)가 겹쳐 있고 state 로 하나만 켜짐"
      - "상태가 바뀌면 테두리 색(파랑·초록·빨강)·배지 교체, 실패는 카드 회색 막 + 짧게 흔들림. text 는 작은 줄을 겹쳐 바꿈(프레임 탐색에도 안전)"
      - "좌상단 '*이해를 돕기 위한 연출입니다' 자동(notice: false 로 끔). 소리: 등장 pop, 상태 click"
  timeline:
    name: 연표
    group: structure
    key: '"type": "timeline"'
    what: 가로 시간선에 해마다 표식이 찍힘
    fits: 사건의 순서, 과거 사례와 지금
    build:
      - "가로 연도 축(years) → 해마다 눈금·연도 → events 가 그 해 위에 표식·글로, spans 는 기간 막대(색)"
      - "박자 upto 로 어디까지 보일지"
  afterline:
    name: 사건 이후 누적
    group: structure
    key: '"type": "afterline"'
    what: 시간선 위 사건 표식 → '이후' 구간이 붉게 열림 → 카드가 쌓임 → 수량 문구
    fits: 제재·발표 '이후에도' 계속된 일
    build:
      - "시간선 위 사건 표식(event: 이름·날짜·금지 아이콘) → '이후' 구간이 붉게 열림 → 카드(items.count 개, 아이콘)가 하나씩 쌓임 → headline(앞말 + 강조 문구)"
      - "explain 무대: show 에 적은 부품만 나오고 앞 것은 남음"
  shape:
    name: 모양 비교 개념도
    group: structure
    key: '"type": "shape"'
    what: 숫자 축 없이 곡선 모양만 (U자 vs W자)
    fits: 정확한 수치 없이 패턴의 차이만 말할 때
    build:
      - "숫자 없는 축 2개(xlabel·ylabel)·눈금 → 박자마다 곡선(curve.points, 0~1 좌표) 하나씩 손그림으로"
      - "tone: red 면 강조 곡선, circle·note 로 부분 표시 — 정확한 수치가 아니라 모양 비교"
  motionboard:
    name: 자유 무대
    group: structure
    key: '"type": "motionboard"'
    what: 인물·카드·글자·화살표를 놓고 박자마다 나타남·이동·강조·바꿈
    fits: 정해진 틀에 안 맞는 설명 — 사람과 물건 사이 관계가 움직일 때
    build:
      - "els 에 요소를 미리 선언(person·card·img·text·arrow·brush·ban·dashed, 위치 x·y)"
      - "박자 do 에 나올 요소와 동작(move·hide·hi·dim·swap)을 적으면 그대로 연기 — 정해진 틀이 없는 관계 설명용"
      - "theme: paper(구겨진 종이)·light·dark"
  checklist:
    name: 체크리스트
    group: chapter
    key: '"type": "checklist"'
    what: 줄마다 항목이 쓰이고 체크 표시
    fits: 확인할 것·정리·조건 나열
    build:
      - "제목 → 줄(rows)마다 체크 상자(손그림) + 항목 글자가 차례로, 박자 upto 로 공개"
      - "다음 박자 stamp → 도장. x·text_w 로 오른쪽에 다른 그림을 둘 자리"
  recap:
    name: 장 끝 정리판
    group: chapter
    key: '"type": "recap"'
    what: 지금까지의 결론 한 줄씩 쌓임, 이전 줄은 흐리게
    fits: 긴 영상의 장 끝 정리
    build:
      - "'여기까지 정리' 제목 → 결론 한 줄씩 왼쪽에서 밀려 쌓임(번호 칩), new_from 이전 줄은 흐리게"
      - "장 끝에 지금까지를 다시 묶을 때"
  kinetic:
    name: 키네틱 타이포
    group: chapter
    key: '"type": "kinetic"'
    what: 말하는 순간 낱말이 박히고 강조어는 크게 강조색
    fits: 훅·장 전환·결론 한 문장 (롱폼 전체에는 쓰지 않음)
    build:
      - "말하는 순간 낱말이 화면 가운데에 하나씩 튀어나옴(단어 시각은 받아쓰기), 한 줄이 차면 위로 밀려 바뀜"
      - "강조 낱말·숫자는 크게 강조색. 화면 글자가 곧 자막이라 자막을 따로 안 씀"
  card_type:
    name: 검은 카드 타자기
    group: chapter
    key: '"type": "card_type"'
    what: 검은 바탕에 한 줄씩 타자로 쳐짐
    fits: 인용·핵심 문장, 무거운 한 마디
    build:
      - "검은 카드 바탕에 lines 가 박자마다 한 줄씩 타자기로 쳐짐, by 로 말한 사람"
      - "인용·무거운 한 문장"
  chapter:
    name: 장 표지 (종이)
    group: chapter
    key: '"type": "chapter"'
    what: 종이 한 장이 밀려 들어오며 번호·아이콘·장 제목
    fits: 장이 바뀔 때 (기본)
    build:
      - "(종이) 검은 바탕 위로 종이 한 장이 오른쪽에서 밀려 들어옴(0.7초) → 아이콘 → 큰 번호 → 장 제목 → 강조색 손그림 밑줄"
      - "장면 시작 0.9초 쉬고 내레이션. 들어올 때 push 전환이 기본"
      - "다른 모양: look: photo(장 사진 표지, edit10)·two-line(uiflow)·그래픽 팩 type"
  chapter@two-line:
    technique: chapter-two-line   # 구성요소 목록의 연출 카드(styles/techniques.yaml)에 이 실제 렌더 예시를 붙임
    name: 두 줄 장 표지
    group: chapter
    key: '"type": "chapter", "look": "two-line", "kicker", "title"'
    what: 어둡게 깐 실사 위 작은 흰 줄 → 큰 강조색 줄
    fits: 문제·비판 꼭지를 나눌 때 (앞부분은 표지 없이 흐르다가)
    note: 예시의 바탕은 '실사 자리' 색 그라데이션
    build:
      - "clip 이 있으면 실사 전체 화면(아주 느린 확대), 없으면 장면 바탕 위에 rgba(8,9,12,dim=0.62) 어두운 막"
      - "0.45초 작은 흰 줄(kicker) 떠오름 → 0.85초 큰 강조색 줄(title, 스킨 강조색을 38% 밝힘) 떠오름 + 그림자, 소리 whoosh-short"
      - "색은 color 로, 라임은 lime: true"
  quote:
    name: 인용 카드
    group: evidence
    key: '"type": "quote"'
    what: 종이 카드 위 발언 원문 + 번역, 핵심어 형광펜
    fits: 누가 무엇을 말했나 (원본 영상이 없을 때)
    build:
      - "살짝 기운 종이 카드 → 큰 따옴표 → 발언(quote) 줄 단위로 → 말한 사람 띠(who·role)가 왼쪽에서 펼쳐짐"
      - "keyword 에 형광펜, orig 가 있으면 아래에 원문, note 는 작은 메모. 박자 mark 로 표시 시점"
  docspot:
    technique: document-spotlight   # 구성요소 목록의 연출 카드(styles/techniques.yaml)에 이 실제 렌더 예시를 붙임
    name: 기사 스포트라이트
    group: evidence
    key: '"type": "docspot"'
    what: 기사 원문 카드에서 대사가 닿는 문단만 밝게(나머지 어둡게) + 형광펜 + 옆 숫자 카드
    fits: 기사·발표문·약관의 한 줄이 근거일 때
    build:
      - "왼쪽(숫자 카드가 있으면) 또는 가운데 흰 문서 카드: 출처 꼬리표 → 헤드라인 → 문단(paras, 34px, 줄 바꿈 자동) / 또는 캡처 그림(img)"
      - "박자 spot 마다 그 문단 둘레만 뚫린 어두운 막(box-shadow 3000px)이 새로 생기고 앞 막은 사라짐 → 그 줄들에 라임 형광펜이 차례로"
      - "num 이면 오른쪽 흰 숫자 카드: 이름표 → 큰 숫자(세어 올라감) → 강조색 밑줄 바 → 비교 줄. 숫자 카드는 막 위"
  hubweb:
    name: 질문 허브 관계망 (누아르)
    group: structure
    key: '"type": "hubweb", "skin": "noir"'
    what: 가운데 질문 원(그 편의 질문, 예 "누가?")에서 박자마다 사건·인물 가지가 하나씩 늘어남, 지금 말하는 가지만 빨강, 위쪽 날짜 눈금
    fits: 흩어진 사건 여러 개가 한 질문(누가·왜)으로 모이는 시사·시장 심층 — 큰 사건 주간
    avoid: 숫자 비교, 사건이 하나뿐일 때, 연결이 확인되지 않은 추측을 선으로 잇기 (선 = 확인된 관계만), 오신트의 "누군가?" 문구 그대로 쓰기 (구조만 가져옴)
    note: 예시는 가상의 회사·인물 (docs/57 §4)
    build:
      - "가운데 빨간 테두리 원에 큰 질문(hub.label) — 천천히 숨 쉬듯 빛남"
      - "add 한 가지마다: 원(또는 from 의 상자)에서 빨간 선이 그려지고 → 관계 글(rel) → 상자(label·sub·date)가 튀어나옴"
      - "다음 박자가 오면 앞 박자의 빨강은 회색으로 물러남 (빨강은 지금 하나뿐), hi 로 앞 가지를 다시 빨갛게"
      - "cut: 상자를 빨간 줄로 긋고 흐리게 (지우지 않음 — 쌓인 화면 유지)"
      - "ruler: 위쪽 날짜 눈금, 빨간 점이 새 가지의 date 로 미끄러짐 · 화면 전체는 아주 천천히 다가감"
  ledger:
    name: 두 열 장부 (누아르)
    group: structure
    key: '"type": "ledger", "skin": "noir"'
    what: 맞서는 두 편을 왼쪽·오른쪽 열에 한 줄씩 적어 감, 지금 줄만 빨간 막대, 지운 줄은 빨간 줄로 긋고 마지막에 판정 한 줄
    fits: 찬반·공방·두 진영 (끌어내리려는 자 / 다시 올리려는 자), 말과 행동 맞대기
    avoid: 숫자 크기 비교 (versus·bars 가 맞음), 한쪽이 한 줄뿐일 때
    note: 예시는 가상의 회사·인물 (docs/57 §4)
    build:
      - "두 열 머리(head·sub)가 차례로 뜨고 아래에 빨간 밑줄, 가운데 세로 회색 선"
      - "add 한 줄마다: 그 열 아래로 '날짜 · 이름(굵게) · 한 줄 설명' 이 옆에서 밀려 들어오고 왼쪽에 빨간 막대"
      - "다음 박자에 앞 줄 막대는 회색, strike 는 빨간 줄로 긋고 흐리게, verdict 는 화면 아래 큰 명조 + 빨간 밑줄"
  newsdesk:
    name: 뉴스 데스크 카드
    group: evidence
    key: '"type": "newsdesk"'
    what: 한 소식 = 한 장 — 꼬리표·큰 제목·숫자 3칸·증거 패널
    fits: 여러 소식을 차례로 (AI 뉴스 정리, 브리핑)
    note: 예시의 오른쪽 증거 패널은 캡처가 없어 비어 있음
    build:
      - "한 소식 = 한 장 고정 틀: 위 진행 막대(idx/total)·출처 → 꼬리표·날짜 → 큰 제목(hl 강조) → 요약 → 숫자 3칸(stats) → 점 목록"
      - "오른쪽 증거 패널(panel: 캡처 shot·큰 숫자·도장)이 panel_beat 박자에"
      - "아래 출처·채널 주소. 색은 그래픽 팩 색을 따름"
  newspapers:
    name: 두 나라 신문
    group: evidence
    key: '"type": "newspapers"'
    what: 왼쪽은 검은 줄로 지운 지면, 오른쪽은 크게 보도한 지면 (재구성)
    fits: 같은 사건을 다르게 다룬 매체 비교
    build:
      - "두 신문 지면을 좌우에(재구성): 왼쪽은 글줄 위에 검은 띠가 그어지고 '검열' 도장, 오른쪽은 큰 제목 보도"
      - "박자 show 로 왼쪽·오른쪽 순서"
  bite:
    name: 원본 발언 컷
    group: evidence
    key: '"type": "bite" + python -m ytflow cut'
    what: 긴 원본에서 대본과 맞는 문장만 잘라 그 사람 목소리로 + 원문·번역 2단
    fits: CEO·연준·정부의 실제 발언 (원본이 있을 때만)
    note: 원본 영상이 없으면 인용 카드로 바뀌어 그려짐
    build:
      - "앞 내레이션 동안 원본 첫 화면을 멈춘 사진처럼(어둡게, 천천히 당김) + 이름 카드"
      - "이어서 cut 으로 찾은 구간만 이어 붙인 원본 목소리·영상 + 원문·번역 2단 자막"
      - "원본이 없으면 인용 카드(quote)로 바뀌어 그려짐 (bite_fallback)"
  zoomshot:
    name: 화면 자동 줌
    group: evidence
    key: '"type": "zoomshot"'
    what: 자료 화면 위에서 카메라가 박자마다 네모로 다가가고 선으로 표시
    fits: 웹페이지·앱 화면의 한 곳을 가리킬 때
    note: 예시는 자료 화면 없이 렌더해 빈 바탕 — 실제는 웹페이지·앱 캡처 위에서 다가감
    build:
      - "자료 화면(캡처·녹화)을 화면 가득 → 박자마다 focus 의 네모로 카메라가 다가가고, 그 자리를 얇은 선 테두리 + 이름표로 표시"
      - "다음 박자에 표시가 사라지고 다른 네모로"
  chat:
    name: AI 대화 화면
    group: evidence
    key: '"type": "chat"'
    what: 질문이 타자로, 답이 단어 단위로 흘러나옴 ('예시(재구성)' 표시)
    fits: AI 사용법 — 무엇을 물으면 어떻게 답하나
    note: 예시 첫 컷은 타자 시작 전이라 빈 창
    build:
      - "앱 창 틀(상표 없음, '재구성 예시' 표시) → 사용자 질문이 타자로 → 답이 낱말 단위로 흘러나옴"
      - "turns 에 문답 순서, 박자마다 한 턴"
  terminal:
    name: 터미널
    group: evidence
    key: '"type": "terminal"'
    what: 명령이 타자로, 결과가 줄 단위로
    fits: 개발 도구·명령 사용법 (실제 실행 기록만)
    build:
      - "검은 터미널 창 → 명령(cmd)이 타자로 → 결과(out) 줄 단위로"
      - "실제 실행 기록만 (설명용 재구성이면 label 에 '재구성')"
  kb:
    name: 자료 사진 켄 번스
    group: evidence
    key: '"type": "kb"'
    what: 자료 사진 가득 + 천천히 움직임 + 필름 가장자리 + 타자기 날짜·장소
    fits: 역사·사건의 자료 사진 (아카이브 다큐)
    note: 예시는 사진 없이 렌더해 어두운 바탕만 — 실제는 자료 사진이 천천히 움직임
    build:
      - "자료 사진·영상을 화면 가득 + 켄 번스(move 방향으로 천천히 확대·이동) + 필름 가장자리 어둡게"
      - "타자기 날짜·장소 도장(stamp), 박자 lower 로 이름 자막"
  footage:
    name: 실사 영상
    group: footage
    key: '"type": "footage", "clip": {...}'
    what: 원본 영상 전체 화면 또는 종이 위 사진처럼 + 이름 자막·쪽지 주석
    fits: 실제 장면이 있을 때 — 신뢰·현장감
    note: 예시는 '실사 자리' 색 그라데이션
    build:
      - "clip 의 원본 구간을 장면 길이만큼 잘라(소리 없음) 전체 화면(frame: full, 위아래 어둡게·종이색 테두리) 또는 종이 위 사진(frame: photo, 흰 테두리·테이프·기울임)"
      - "박자 lower → 이름 자막(왼쪽 아래 띠), vox → 종이 쪽지 + 형광펜 + 펜 메모, chips → 말 칩"
  outro:
    name: 마무리
    group: footage
    key: '"type": "outro"'
    what: 흐린 실사 위 종이 카드로 마지막 한 줄
    fits: 영상 끝 의미 정리
    build:
      - "흐린 실사(사진 틀) 위에 반투명 막 + 가운데 종이 카드 → 마지막 한 줄(title) + 밑줄 → sub"
      - "영상 끝 의미 한 줄"
  journey:
    name: 지도 여정
    group: map
    key: '"type": "journey"'
    what: 세계 지도 위를 카메라가 이동·확대, 경로선이 그려지고 핀
    fits: 어디서 어디로 — 전파·이동·공급망
    build:
      - "세계 지도(직사각형, 화면 꽉)를 places 좌표로 → 박자 goto(+zoom)로 카메라 이동·확대, route 로 경로 곡선이 그려지고 pin 으로 핀·이름"
      - "highlight 나라 칠하기, seas 바다 이름"
  choropleth:
    name: 나라 색칠 지도
    group: map
    key: '"type": "choropleth"'
    what: 나라별 값으로 색칠, 박자마다 나라가 칠해짐, 범례
    fits: 여러 나라의 수치 비교
    build:
      - "나라 경계 지도(world-atlas) → values{나라: 값}으로 색 단계, 박자 show 의 나라들이 차례로 칠해짐 + 범례(legend)"
  usmap:
    name: 미국 주 지도
    group: map
    key: '"type": "usmap"'
    what: 손으로 그린 미국 지도 + 주 강조 + 숫자
    fits: 미국 주별 이야기 (선거·규제)
    build:
      - "손그림 미국 주 경계 → 박자 highlight 주 칠하기 → counter 큰 숫자(세어 올라감)·note 메모, counter2 로 두 번째 숫자"
  analogy:
    name: 비유 두 칸
    group: story
    key: '"type": "analogy"'
    what: 왼쪽(익숙한 것) ↔ 오른쪽(새로운 것) 아이콘과 설명
    fits: 어려운 개념을 익숙한 것에 빗댈 때
    build:
      - "좌우 두 칸(left 익숙한 것 · right 새로운 것)에 아이콘·이름·설명, 가운데 ≈"
      - "result 로 아래 결론 한 줄"
  story:
    name: 이야기 그림판
    group: story
    key: '"type": "story"'
    what: 큰 종이 위에 말하는 순간 사람·사물이 선으로 그려지고 카메라가 따라감
    fits: 누가·언제·어디서·무엇을 한 이야기 (호기심 채널)
    note: 예시는 그림 없이 렌더해 거의 빈 종이로 보임 — 실제는 사람·사물 그림이 선으로 그려짐
    build:
      - "큰 종이 한 장(카메라가 이동)에 박자 draw 의 사람·사물 그림이 선으로 그려지고, 날짜 도장·쪽지·말풍선·화살표"
      - "cam 으로 카메라 경로. 그림은 미리 준비(04_assets/story) — 없으면 빈 종이"
  stage:
    name: 애니메이션 무대
    group: story
    key: '"type": "stage"'
    what: 한 화면 한 생각 — 대본의 동사를 그림이 연기
    fits: 호기심 채널 이야기형, 기억할 한 장면
    note: 예시는 그림 없이 렌더해 글자만 겹쳐 보임 — 실제는 준비한 그림 조각이 연기함
    build:
      - "한 화면 한 생각: 박자 act 에 적은 배우(그림 조각)·소품이 대본의 동사를 연기(들어옴·흔들림·바뀜)"
      - "02_script/intent.md 의 목표·기억할 장면이 먼저. 그림 조각이 없으면 글자만 남음"
  illust:
    name: 손그림 삽화 카메라
    group: story
    key: '"type": "illust"'
    what: 삽화 한 장 위를 카메라가 박자마다 옮겨 가며 표시·생각 풍선
    fits: 사람들의 생각·행동·상황, 옛 사례 재현 (그림은 사람이 준비)
    note: 예시는 삽화 없이 렌더해 빈 틀 — 실제는 준비한 삽화 위를 카메라가 옮겨 감
    build:
      - "삽화 한 장(art)을 붓 쓸기로 드러냄(reveal) → 박자마다 카메라가 moves 의 자리로 옮겨 감"
      - "marks: 손그림 동그라미·화살표·생각 풍선, boil 로 선이 살아 움직임. 그림은 사람이 준비(art-brief)"
  metaphor:
    name: 움직이는 비유
    group: story
    key: '"type": "metaphor"'
    what: 무리가 한쪽으로 옮겨 가고 의태어가 튀어나옴
    fits: 사용자가 고를 때만 (따로 쓰는 스타일)
    build:
      - "무리(crowd)가 한쪽(target)으로 옮겨 가고 의태어(words)가 튀어나오는 비유 장면, 화살표·강조(hl)·꼬리표(tag)"
      - "사용자가 고를 때만 쓰는 따로 스타일"
  studio3d:
    name: 3D 무대
    group: story
    key: '"type": "studio3d"'
    what: 어두운 스튜디오의 3D 물체가 움직임
    fits: 물건 하나를 입체로 보여 줄 때 (시안)
    build:
      - "어두운 스튜디오에 3D 물체(object·preset)를 그리고 메인 시간축이 매 프레임 다시 그림"
      - "in·out·n·left·right 로 물체 수·좌우 이름. 시안 단계"

transition:
  fade:
    name: 겹치며 바뀜 (기본)
    group: transition
    key: 기본 — 쓰지 않아도 됨
    what: 앞 장면이 사라지며 다음 장면이 나타남
    fits: 보통 장면 사이
    build:
      - "앞 장면 마지막 0.3초 #root 불투명도 1→0, 다음 장면 처음 0.35초 0→1 (edit10.apply)"
  push:
    name: 밀기
    group: transition
    key: '"tr": "push" (장 표지는 기본)'
    what: 다음 장면이 옆에서 밀려 들어옴
    fits: 장이 바뀔 때
    build:
      - "앞 장면이 왼쪽으로 12% 밀리며 사라지고, 다음 장면이 오른쪽 12%에서 밀려 들어옴(0.5초), whoosh-short"
  wipe:
    name: 색 판 닦기
    group: transition
    key: '"tr": "wipe"'
    what: 강조색 판이 화면을 쓸고 지나감
    fits: 분위기가 확 바뀔 때 (자주 쓰면 정신없음)
    build:
      - "강조색 판이 왼쪽에서 화면을 덮고(앞 장면 끝 0.3초) 다음 장면에서 오른쪽으로 빠져나감(0.4초)"
  zoom:
    name: 확대 흐림
    group: transition
    key: '"tr": "zoom"'
    what: 앞 장면이 커지며 흐려지고 다음 장면이 선명해짐
    fits: 한 부분으로 '들어가는' 느낌
    build:
      - "앞 장면이 1.2배 커지며 흐려지고(blur 14px), 다음 장면이 0.82배·흐림에서 제자리로 선명해짐"
  iris:
    name: 원으로 열기
    group: transition
    key: '"tr": "iris"'
    what: 화면 가운데 원이 닫혔다가 다음 장면이 원으로 열림
    fits: 가벼운 장 전환
    build:
      - "앞 장면 끝에 clip-path 원이 가운데로 닫히고, 다음 장면이 가운데 원으로 열림"
  iris_out:
    technique: shape-iris   # 구성요소 목록의 연출 카드(styles/techniques.yaml)에 이 실제 렌더 예시를 붙임
    name: 모양 매치 아이리스
    group: transition
    key: '앞 장면에 "iris_out": {"x", "y", "r"}'
    what: 앞 장면 속 원 모양이 테두리째 커져 화면을 덮고, 다음 장면이 원으로 열림
    fits: 앞 장면의 원(보호 범위·주체)에서 다음 이야기로 이어질 때
    build:
      - "앞 장면 끝 0.75초: (x,y) 반지름 r 의 강조색 테두리 원이 나타나 화면 모서리까지 커지며 안이 바탕색으로 채워짐 (uiflow.iris_out)"
      - "다음 장면: 같은 바탕색 위에서 clip-path 원이 0 → 1400px 로 열림(0.6초, to 로 중심) — 두 장면이 따로 렌더돼도 색이 맞게 기본은 영상 팩 바탕색"
      - "한계: 원 안에 다음 장면을 직접 합성하지 않고 바탕색을 거침"

overlay:
  footage@chips:
    technique: footage-chips   # 구성요소 목록의 연출 카드(styles/techniques.yaml)에 이 실제 렌더 예시를 붙임
    name: 실사 위 말 칩
    group: overlay
    key: 'footage 박자 "chips": ["…", …]'
    what: 실사 위에 부탁·메시지 칩이 0.6초 간격으로 하나씩 떠오름
    fits: 사람들이 저마다 무엇을 원하나 / 같은 틀 사례 나열
    note: 예시의 바탕은 '실사 자리' 색 그라데이션
    build:
      - "실사 위 정해진 자리 6곳(CHIP_SLOTS) 또는 x·y 에 흰 둥근 칩(색 점 + 굵은 글자)이 chip_gap(0.6초) 간격으로 튀어나오고 위아래로 살짝 둥실, 칩마다 pop"
  chapter@noir:
    name: 누아르 장 표지
    group: chapter
    key: '"type": "chapter", "look": "noir", "kicker": "월요일 → 금요일"'
    what: 검은 바탕에 작은 빨간 줄(날짜·기간) → 큰 회백색 명조 제목 → 짧은 빨간 선, 화면이 살짝 물러남
    fits: 누아르 스킨 영상의 장 나누기 — 날짜가 이야기의 뼈대일 때 (오신트형 큰 날짜 표지의 구조)
    note: "누아르 스킨에서 look 을 안 정하고 자료 화면도 없으면 이 표지 (빨간 전면 대신 — 빨강은 한 곳만). 자료 화면이 있으면 사진 표지가 되므로 look 을 noir 로 고정"
    build:
      - "kicker(없으면 date·num)가 넓은 자간에서 좁혀지며 빨갛게 → 0.45초 뒤 큰 명조 제목 → 1초에 제목 아래 짧은 빨간 선"
      - "sub 가 있으면 아래 회색 작은 줄, 화면 전체는 1.04배에서 천천히 제자리로"
  map_causal@cut:
    technique: link-break   # 구성요소 목록의 연출 카드(styles/techniques.yaml)에 이 실제 렌더 예시를 붙임
    name: 선 끊김 (빨간 점선 + X)
    group: overlay
    key: 'map_causal·statecard 박자 "cut"'
    what: 그려 둔 연결선을 지우지 않고 빨간 점선 + X 로 바꿈
    fits: 막혔다·차단됐다·끊겼다
    build:
      - "그린 화살표(<g> 로 묶임)를 0.3초에 흐리게(12%) → 같은 경로에 빨간 점선(16·14)이 나타나 흐르고 → 가장 긴 구간 가운데 빨간 원 X 가 크게서 찍힘, pop"
