# 2026-11-12 사용자 요청: "단순 글로만 정리하는 것이 아니라 애니메이션·움직이는 효과로 편집하는 스타일을 추가" (모든 채널 적용이 아니라 스타일 추가)
# 레퍼런스: AI 자동화 해설 채널의 비유 장면(공개 썸네일 관찰 — 영상 원본은 클라우드에서 봇 확인으로 막혀 분석 못 함, 우회하지 않음).
# 가져온 것은 기법만: 갈라진 화면 · 무리가 한쪽으로 옮겨 감 · 의성어·의태어가 튀어나옴 · 손그림 곡선 화살표 · 강조 낱말 상자.
# 그림·캐릭터·문구는 복제하지 않음 — 도형·아이콘으로 직접 그림 (사용자 선택, 비용 없음·재현 가능).
id: motion-metaphor
