# 2026-11-20 v60 에서 호기심 기본이었으나, 같은 날 v73(manual/12 §0-1·04 §0-7)에서 기본이 "이야기는 삽화"로 바뀜 — 사용자가 고를 때만 씀.
# 삽화는 자료를 구하기 어렵거나 넣기 힘든 장면에만 부분적으로 ('재구성 삽화' 표시). 레퍼런스: EBS 지식채널e·북툰·Aperture.
