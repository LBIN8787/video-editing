# 2026-11-20 사용자 승인 (manual/04 §0-8): 잼·기억 편 같은 삽화 중심 대신, 사람이 나오는 짧은 실사 B-roll 과 그 위의 모션그래픽으로 설명.
# 삽화는 자료를 구하기 어렵거나 넣기 힘든 장면에만 부분적으로 ('재구성 삽화' 표시). 레퍼런스: EBS 지식채널e·북툰·Aperture.
id: broll-motion
name: "실사 B-roll + 모션그래픽 (사람 컷 위 콜아웃·데이터·핵심어, 삽화는 대체)"
status: approved
renderer: hybrid
skin: dark-doc
format: [longform]
owns: []                      # footage 는 hybrid-causal 이 셈 — 이 레시피는 연출 문법(순서·표시·색 통일)
scene_types: [footage, people, bars, kinetic]
backbone: true                # 호기심 채널의 뼈대 (v60) — 삽화 무대(anim-stage·story-board)는 대체 구간
fits:
  brands: [curiosity]
  questions: [행동의 이유, 오늘과 연결, 원인, 비교]
  moods: [차분, 실용, 미래]
  needs: [footage]
roles: [hook, body, ending, whole]
avoid: "얼굴이 보이는 스톡 인물을 질환·중독·범죄 같은 부정적 맥락의 당사자처럼 / 실험 현장 기록처럼 보이는 다른 장소 컷에 '자료 화면' 표시 없이 / 그래픽이 실사를 덮어 사람이 안 보이게"
when: "생활 속 행동·장소가 나오는 이야기 — 대사의 상황을 공유하는 사람·손·공간 컷을 무료 스톡에서 찾을 수 있을 때. 수치는 실사 위 막대·축, 데이터가 주인공이면 모션그래픽만, 기록 없는 과거 현장만 삽화"
demo: "20261120-curiosity-broll-sample"
skill: ""
