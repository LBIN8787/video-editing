# 식스시그마 화면 분석(docs/03) 기준 설정
edit:
  style: sixsigma
  style_ref: sixsigma
  family: source            # 스타일 계열 (config.FAMILIES)
  subtitle_box: false
  theme:
    bg: "#000000"
    fg: "#FFFFFF"
    muted: "#9A9A9A"
    accent: "#E8402C"
    line: 3
  kenburns: false
  push_in: 0.015              # 카드만 아주 약하게 (원본 영상은 그대로)
  fade_in: 0.2
  paper:                      # 카드 애니메이션 엔진 색 (검은 배경 프로필)
    base: '#000000'
    ink: '#FFFFFF'
    red: '#E8402C'
    anim_seconds: 1.0
  bgm: ""
