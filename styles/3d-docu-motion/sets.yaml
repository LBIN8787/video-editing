# 3D 구조 세트 등록부 — cutaway3d 장면이 고를 수 있는 '세트'와 그 안의 '샷'
# (2026-11-29 사용자: "단순 글씨카드에서 끝나는게 아니라 추가 설명이 있으면 좋은 장면은 3d그래픽이나 상황에 따라 모션그래픽 등을 추가")
#
# 세트 = 한 번 만든 3D 무대(사물·카메라·불빛 움직임이 이미 짜여 있음). 샷 = 그 무대의 한 구간.
# 대본의 박자마다 shot 을 적으면 그 구간이 박자 길이에 맞춰 늘거나 줄어 재생된다 (ytflow/stages/cutaway3d.py).
# 순서를 바꿔도 되지만, 이웃하지 않은 샷으로 건너뛰면 카메라가 '컷'으로 바뀐다(이어지는 이동은 이웃 샷끼리만).
#
#   span     : 세트 안의 원래 시각 [시작, 끝) 초
#   shows    : 그 샷이 화면에 보여 주는 것 (편집 계획이 대본 낱말과 맞춰 볼 때 씀)
#   keywords : 이 샷이 어울리는 대본 낱말 (정규식 아님, 그냥 포함 검사)
#   labels   : 그 샷에 뜨는 이름표 원문 — 장면의 "labels" 로 바꿔 쓰거나 "" 로 지움
#   title    : 왼쪽 위 구간 표시 기본값 [구간 이름, 큰 제목, 작은 줄] — 장면의 "titles" 로 바꿔 씀
#
#   context  : 세트의 소재 낱말 — 대본에 서로 다른 둘 이상 있을 때만 이 세트의 샷을 추천
#
# 새 세트를 더할 때: 시간축으로 짠 HTML(window.frame(t) 가 JPEG base64 를 돌려줌, window.ready 약속)을 sets/<id>.html 에 두고
# 여기에 샷 표를 적는다. 같은 세트를 여러 주제에 쓰려면 이름표·제목을 장면에서 바꿔 쓸 수 있게 LBL()·CFG.titles 를 거친다.

sets:
  dc-rack:
    name: 데이터센터 랙 — 랙 사이·랙 안·트레이·GPU·광/구리 연결
    file: sets/dc-rack.html
    origin: 마벨 광학 편 V2 (styles/3d-docu-motion/scene.html, 2026-11-28 GPT 제작) 를 대본으로 움직이게 바꾼 것
    length: 32.3
    # 이 세트의 소재 낱말 — 대본에 서로 다른 둘 이상이 있어야 샷을 추천 (돈·투자 이야기의 '데이터센터' 한 단어로는 추천하지 않음)
    context: [랙, GPU, 서버, "트레이 ", 트레이가, 트레이를, 트레이에, 광모듈, 광섬유, 트랜시버, 광통신, 구리, 케이블, NVLink, 엔비링크, 스위치, 인터커넥트, 이더넷, 인피니밴드, 스케일업, 스케일아웃, CPO, AEC, 네트워크, 칩끼리, 데이터센터]
    fits:
      - 스케일업(한 랙 안 GPU 묶기) 대 스케일아웃(랙과 랙 잇기) — 엔비디아 NVLink·이더넷·인피니밴드
      - 광모듈·광섬유·CPO(칩 옆 광학) — 마벨·브로드컴·코히런트·루멘텀
      - 구리 케이블·AEC 와 그 거리·전송량 한계 — 크레도 등
      - 랙 단위로 파는 서버(GB200 NVL72 같은) · 랙 밀도
    not_for:
      - 칩 내부(HBM 적층·트랜지스터) — 확대가 GPU 보드에서 멈춤
      - 냉각 배관·전력 설비 — 사물이 없음 (더하려면 세트를 고쳐야 함)
    shots:
      room:
        span: [0, 4.38]
        shows: 어두운 데이터센터 안 랙 두 대, 위로 광 케이블 하나가 이어짐
        keywords: [데이터센터, 서버실, 랙, 두 가지 연결]
        labels: [RACK 01, RACK 02]
        title: [공간과 관계, 데이터센터의 두 가지 연결, ""]
      scaleout:
        span: [4.38, 6.95]
        shows: 랙과 랙 사이 광 링크에 빛이 흐름
        keywords: [스케일아웃, 랙과 랙, 랙 사이, 네트워크, 이더넷, 인피니밴드, 스위치]
        labels: [광 링크]
        title: [랙 간 연결, 스케일아웃 · 랙과 랙 사이, ""]
      open:
        span: [6.95, 10.74]
        shows: 카메라가 랙으로 다가가 문이 열리고 트레이가 빠지며 외장 → 트레이 → PCB → GPU 순서로 이름표, 끝에 GPU 사이 연결이 빛남
        keywords: [스케일업, 랙 안, 한 랙, "트레이 ", 트레이가, 트레이를, 트레이에, 서버 안, GPU 끼리, GPU 간, NVLink, 엔비링크]
        labels: [외장, 트레이, PCB, GPU, GPU 간 연결]
        title: [랙 내부 연결, 스케일업 · 한 랙 안의 GPU, ""]
      optic:
        span: [10.74, 15.07]
        shows: 랙 위쪽 포트 클로즈업 — 광모듈에 꽂힌 광섬유
        keywords: [광모듈, 광섬유, 트랜시버, 광통신, 광 연결, 빛으로, DSP, 광학]
        labels: [광모듈, 광섬유, 광섬유 · 실선]
        title: [랙 간 광 연결, 광모듈과 광섬유, ""]
      copper:
        span: [15.07, 19.11]
        shows: 트레이 위 GPU 사이 구리선 두 줄 클로즈업
        keywords: [구리, 구리선, 케이블, AEC, DAC, 전기 신호]
        labels: [구리선 두 줄, GPU, 구리 · 이중선]
        title: [랙 내부 구리 연결, 한 랙 안의 구리 링크, ""]
      scale:
        span: [19.11, 26.34]
        shows: 뒤로 빠지며 트레이가 늘어나고 구리 경로가 트레이마다 갈라짐 — 묶는 GPU 가 늘면 연결도 늘어남
        keywords: [늘어나, 더 많은 GPU, 규모, 확장, 거리, 전송량, 한계, 병목]
        labels: [트레이로 분기, 수치 없는 개념도]
        title: [연결 규모 확대, 묶는 GPU가 늘어나면, 연결 경로가 늘어나는 개념 예시]
      now:
        span: [26.34, 28.37]
        shows: 지금은 랙 안 연결이 구리로 남아 있음
        keywords: [지금은, 현재, 아직, 남아 있]
        labels: []
        title: [현재의 예시, 랙 안에 남아 있는 구리 링크, ""]
      future:
        span: [28.37, 32.3]
        shows: 랙 안 구리 옆에 점선 광 경로가 겹쳐 나타남 — 랙 안까지 광이 들어오는 전망
        keywords: [전망, 앞으로, 들어온다면, CPO, 공동 패키징, 바뀔, 대체]
        labels: [구리 · 이중선, 광 · 점선 투영, 가상 광 경로]
        title: [기업 전망, 랙 내부까지 광 연결이 들어온다면, 점선은 기업의 전망을 재현한 경로]
