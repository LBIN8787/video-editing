# 주제 레포: AI — "AI 를 더 잘 다루고 싶다". 따라 할 수 있게, 실제 화면으로.
id: ai
name: AI · 활용
inherits: main
channels: [ch-ai-guide, ch-ai-shorts]
manual: [manual/02-ai.md]
look: 앱 창 (05 §0-7)
defaults:
  real_screen: true   # 실제 화면 녹화·캡처 중심 (docs/17 shorts-claude)
  emphasis_budget: 1  # 강조 1분 1번 (v4)
situations:
  override:
    point:
      scenes: [zoomshot, footage]
      techniques: [rough-highlight, spotlight]
      why: 화면의 한 곳 — 실제 화면 위 표시
  add:
    new-tool:
      name: 새 도구·모델 소개
      signals: ['출시', '공개', '새로 나온', '업데이트', '모델', '기능이']
      scenes: [footage, kb, chat]
      techniques: [split-reveal]
      avoid: 홍보 문구 그대로
      why: "'이거 뭔데 다들 난리야?' — 공식 화면으로"
    before-after:
      name: 쓰기 전과 후
      signals: ['전에는', '이제는', '하면 이렇게', '쓰기 전', '쓴 뒤']
      scenes: [versus, compare]
      techniques: [split-screen, match-move]
      avoid: 과장된 결과
      why: 직접 확인한 것만 '됩니다' (02 §h51)
  drop: [rank, route]
avoid_techniques: [whip-pan, gl-transitions]
