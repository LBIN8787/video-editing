# 주제 레포: 시사 (issues) — "세상이 어떻게 돌아가는지 알고 싶다". 재미있게 보는 뉴스, 사실이 재미를 이김.
id: issues
name: 시사 · 역사
inherits: main
channels: [ch-issues, ch-issues-daily]
manual: [manual/08-issues.md, manual/12-visual-storytelling.md]
look: 실제 자료와 읽기 쉬운 지도·연표·비교 화면 (08 §0-3)
defaults:
  both_sides_equal: 시사 양쪽 입장에 같은 틀 (08 §4)
  timestamp: 시사는 기준 시각, 역사는 사건 시점·자료 작성 시점 (08 §0-3)
situations:
  override:
    open-scene:
      scenes: [footage, kb, newspapers]
      why: 실제 사건의 사람·장소·시점을 자료로 보여 준 뒤 질문 하나 (08 §0-3)
    compare:
      why: 기간·단위·집계 범위를 먼저 놓고 차이를 읽을 시간 확보 (08 §0-3)
  add:
    archive-evidence:
      name: 현장과 당대 기록
      signals: ['당시 신문', '당시 사진', '기록 영상', '원본 영상', '기록 문서', '보도 화면']
      scenes: [footage, kb, newspapers]
      techniques: [draw-on, parallax-photo]
      avoid: 다른 시기·장소의 자료를 해당 사건 화면처럼 쓰기
      why: 자료의 실제 날짜·장소·출처가 사건을 뒷받침 (08 §0-3)
    both-sides:
      name: 양쪽 입장
      signals: ['반면', '반대 측', '찬성', '반대', '입장', '쪽에서는', '정부는', '야당']
      scenes: [versus, compare, quote]
      techniques: [split-screen]
      avoid: 크기·색·길이가 다른 틀 (한쪽 편들기 — 영구 원칙)
      why: 양쪽을 같은 틀로 (08 §4)
    not-known:
      name: 아직 모르는 것
      signals: ['아직', '확인되지', '조사 중', '밝혀지지', '수사']
      scenes: [card_type, checklist]
      techniques: []
      avoid: 의혹을 사실처럼, 범인 단정
      why: "'아직 모른다' 는 그대로 (08 §0-1, 영구 원칙)"
    us-link:
      name: 우리에게 무슨 뜻인가
      signals: ['우리', '생활', '가계', '월급', '물가', '내 ']
      scenes: [people, analogy, map_causal]
      techniques: [stagger, draw-on]
      avoid: 겁주기
      why: 사건 → 우리 (08 구성)
  drop: [command, ai-ask]
avoid_techniques: [whip-pan, gl-transitions]
