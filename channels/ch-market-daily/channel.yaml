id: ch-market-daily
brand: market                               # channels/brands.yaml (욕망 = 채널)
title: "이어 읽는 시장"            # 2026-11-12 사용자 확정 (docs/23)
handle: "@이어읽는시장"
brand_kit: channels/ch-market-daily/brand/   # 소개 문구 about.md · 배너·프로필 (render.js)
format: longform
style_ref: hybrid
family: source
concept: >
  매일 아침, 전날 시장을 크게 움직인 것(이슈·증권사/기관 보고서·전망·실적)을 골라 '왜 움직였나'를 설명한다.
  지수·업종 마감 → 가장 크게 움직인 이야기 2~3개 → 원인(1차 출처) → 시장 전체와 따로/같이 움직였나 → 오늘 확인할 것.
niche: "미국·한국 시장 전날 마감 해설. 실제 시세와 1차 출처(회사 발표·공시·보고서 원문·연준·통계)만. 투자 권유는 하지 않는다."
seed_keywords: ["뉴욕증시 마감", "코스피 마감", "특징주", "증권사 리포트", "목표가", "가이던스", "연준", "실적 발표"]
target_minutes: 7
cadence: "1일 1영상 — 월~금 아침 브리핑(08시 전후), 주제가 복잡한 날은(요일 무관) 심층 분석으로 대신, 토 주간 분석, 일 분석글 (docs/23-stock-channel-plan.md)"
schedule:
  weekday: {kind: briefing, minutes: [6, 8], upload: "08:00 KST 전후"}
  deep_dive: {kind: deep_dive, minutes: [7, 12], when: "요일 고정 아님 — 주제의 복잡도로 매일 정함 (docs/23 §2 신호 둘 이상), 그날의 1편을 대신하고 앞 1분은 시장 요약"}
  saturday: {kind: weekly_review, minutes: [8, 12]}
  sunday: {kind: analysis, minutes: [8, 12]}
  holidays: "미국·한국 휴장일은 쉬거나 주간 분석으로"
tone: "아침 시황 진행자. 숫자에는 비교 기준, 원인에는 출처, 끝에는 '오늘 볼 것'."
daily:
  scan: "python -m ytflow daily --project <YYYYMMDD>-market-daily"   # 전날 시장 → 01_research/daily_brief.md
  stories: [2, 3]                  # 한 편에 다룰 이야기 수
  window: "한국 아침 6~9시 제작 → 오전 업로드 (미국 장 마감 16:00 ET = 06:00 KST, 서머타임 05:00)"
  as_of: "○월 ○일 마감 기준 (미국·한국 날짜를 따로)"
sourcing:
  start_from: data
  datasets: ["시세: 야후 파이낸스 (marketdata.py, 날짜 확인)", "회사 발표·IR·SEC 8-K / DART 공시", "증권사·기관 보고서 원문(공개분) 또는 보도에 인용된 문장", "연준·통계청·BLS 발표"]
  end_with: ["오늘 확인할 것 (일정·지표·발표 시각)"]
tts:   # 2026-11-13 사용자 선택 (docs/08-voice.md §2차 후보 8명): Teo — 오래 듣기 편한 차분한 중저음. 예비 Sung-ho (AgA5UKT9OrVg7jxVBZd4)
  backend: elevenlabs
  elevenlabs: {voice_id: 0mlAtfsvMzFpppUuNWkV, model_id: eleven_v4, language_code: ko, stability: 0.55, speed: 1.0}
  # 키 없이: ElevenLabs 커넥터로 장(章)별 2~3덩어리 생성 → python -m ytflow voice-import <프로젝트> part1.mp3 part2.mp3 (테이크 중 대본과 다 맞는 것)
  # 크레딧: 한 편(6~8분, 2,500~3,300자) ≈ 2,100~2,800 크레딧/테이크 → 매일이면 월 7만~9만 (월 1만 무료 한도로는 부족)
