id: ch-data-motion
title: "(가칭) 숫자로 보는 산업"
format: longform
style_ref: moneycrew                     # 평면 인포그래픽 모션 (머니크루 스타일)
family: infographic
concept: >
  산업·공급망·실적을 차트와 막대, 굵은 숫자로 비교하는 데이터 리포트형 채널.
  과거 사례(같은 축의 주가 차트)와 지금을 나란히 놓는다.
niche: "반도체·AI·에너지 산업의 공급망과 실적 비교. 실제 시세 차트와 공시 숫자로 설명한다. 투자 권유는 하지 않는다."
seed_keywords: ["D램 가격", "HBM", "공급망", "반도체 주가", "전력 수요", "데이터센터", "관세", "수출"]
target_minutes: 8
cadence: "격주 1편"
voice: "미정 — ElevenLabs 로 정함 (영상이 확정된 뒤 목소리를 고르고 아래 tts 의 주석을 풉니다)"
tone: "데이터 리포트. 비교 기준을 늘 함께 말한다."

# 소스 찾기 (벤치마킹: docs/07-sourcing.md — 머니크루식 '숫자 계열에서 출발')
sourcing:
  start_from: data                # 직접 계산·백테스트할 수 있는 숫자 계열 + 비교할 과거 시기
  datasets: ["시세: 야후 파이낸스 티커(국내 .KS/.KQ, 미국, 지수 ^)", "FRED 공개 지표", "관세청 수출입·한국거래소 통계",
             "업계 가격 지표(트렌드포스 등 공개 보도)"]
  analogs: true                   # 과거 비슷한 시기(1970년대 원전, 2000년 닷컴, 메모리 사이클)를 같은 축으로
  end_with: ["오늘 남는 세 가지", "앞으로 볼 신호(날짜)"]

# 목소리 확정 후 (docs/08-voice.md):
# tts:
#   backend: elevenlabs
#   elevenlabs: {voice_id: "<ElevenLabs 목소리 ID>", model_id: eleven_multilingual_v2, language_code: ko, stability: 0.5, similarity_boost: 0.75, speed: 1.0}
