id: ch-anime-review
brand: anime                                   # 새 욕망 후보 — brands.yaml 반영은 매뉴얼 담당 제안함 경유
title: "(가칭) 장면의 이유"
status: draft                                  # 2026-11-16 설계안, 아직 운영 안 함
format: longform
style_ref: hybrid                              # 원작 클립(짧게) + 손그림 관계도·복선 연결선 + 원문·번역 2단
family: source
concept: >
  애니메이션을 '줄거리 대신 해석'으로 보는 채널. 장면은 근거로만 짧게 쓰고,
  시간 대부분은 왜 그런가(복선·연출·설정·제작 사정)를 내 화면(관계도·타임라인·비교)으로 풀어 준다.
niche: "화제작·명작의 복선·결말 해석, 원작(만화·소설)과 달라진 점, 연출·작화 분석, 제작 비하인드."
seed_keywords: ["애니 해석", "애니 복선", "결말 해석", "원작 차이", "애니 추천", "명장면 분석", "작화 붕괴", "애니 비하인드"]
target_minutes: 12
cadence: "주 1편 롱폼 + 같은 소재 쇼츠 2편"
tone: "3인칭 다큐 내레이터 '~습니다'. 첫 문장부터 질문(답은 숨김) → 장면 근거 → 해석 → 다시 보면 달라지는 장면."

topic_rules:
  - "원작 장면을 빼도 내 영상이 성립할 것 (해석·비교·분석이 본체, 줄거리 요약은 1/4 이하)"
  - "질문 하나가 제목: '왜 ○○는 1화부터 ○○였나'"
  - "지금 화제(방영 중·극장판 개봉·완결) 또는 오래 검색되는 명작"
  - "1차 출처(감독·작가 인터뷰, 공식 설정집, 원작 단행본 권·화)로 확인한 것만 단정"

clip_rules:                                    # 저작권 — 회피 기법 금지, 변형적 이용으로
  - "원작 클립 1개 ≤ 8초, 영상 전체 원작 화면 비율 ≤ 40%"
  - "원작 클립 사이에 반드시 내 화면(관계도·타임라인·비교표·대사 원문)"
  - "원작 OST·주제가 사용 안 함 → 무료 음원. 대사 원음은 근거가 될 때만 짧게"
  - "좌우 반전·확대·테두리·속도/음높이 변조로 탐지를 피하지 않음"
  - "공식 예고편·PV·공식 이미지가 있으면 우선 사용"

sourcing:
  start_from: user_files                        # 사용자가 정식 구매·구독한 에피소드 파일을 PC 에서 준비 (클라우드에서 받지 않음)
  verify_with: ["감독·작가 공식 인터뷰", "공식 설정집·가이드북", "원작 단행본 권·화", "제작사·배급사 공지"]
needs_pc_rebuild: true

demand:
  queries:
    해석: ["애니 해석", "애니 결말 해석", "애니 복선 정리", "애니 떡밥 정리"]
    요약: ["애니 몰아보기", "애니 결말포함 요약", "애니 줄거리 정리"]
    비교: ["애니 원작 차이", "애니 원작 비교"]
    추천: ["애니 추천", "인생 애니 추천", "애니 순위"]
    분석: ["애니 연출 분석", "애니 작화 분석", "애니 명장면 분석"]
    비하인드: ["애니 비하인드", "애니 제작 비하인드", "애니 감독 인터뷰"]
  min_seconds: 180
  per_channel: 60
