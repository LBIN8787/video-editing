id: ch-anime-review
brand: anime                                   # 새 욕망 후보 — brands.yaml 반영은 매뉴얼 담당 제안함 경유
title: "(가칭) 장면의 이유"
status: draft                                  # 2026-11-16 설계안, 아직 운영 안 함
format: longform
style_ref: recap                               # 소개형: 핵심 장면 + 내레이션 (python -m ytflow recap, docs/37 §2)
family: source
concept: >
  애니 소개 채널. 1~3화의 스토리 핵심 장면만 잘라 내레이션으로 이어 주고,
  가장 궁금한 지점에서 끊어 '이거 봐야겠다'로 끝낸다. 본편을 대신하지 않고 보게 만든다.
niche: "방영 중 화제작·OTT 신작·숨은 명작의 앞부분 소개. 결말은 다루지 않는다."
seed_keywords: ["애니 추천", "애니 리뷰", "애니 소개", "넷플릭스 애니", "명작 애니", "애니 몰아보기"]
target_minutes: 12
cadence: "주 2편 롱폼(소개형) + 같은 소재 쇼츠 2편, 가끔 분석형"
tone: "3인칭 다큐 내레이터 '~습니다'. 인트로 없이 콜드 오픈(가장 센 장면) → 설정 한 줄 → 발단·갈등·반전 → 궁금한 지점에서 끊고 볼 수 있는 곳."

topic_rules:
  - "설정 한 줄이 제목이 될 것: '○○하던 주인공이 ○○하게 되면…' (작품명보다 설정으로)"
  - "앞 1~3화 안에 콜드 오픈감 장면·반전이 있을 것"
  - "지금 볼 수 있는 곳(OTT)이 있을 것 — 끝에 안내"
  - "작품 정보(방영·제작·원작)는 1차 출처로 확인한 것만"

recap_rules:                                   # python -m ytflow recap 이 검사 (위반이면 렌더 안 함)
  max_ep: 3                                    # 앞 3화까지만, 결말 없음
  live_max_sec: 8                              # 원작 소리 장면 하나 ≤ 8초 (훅·명대사·반전에만)
  live_share_max: 0.20                         # 원작 소리 합 ≤ 영상의 20% — 나머지는 내레이션
  end_with_where_to_watch: true                # 마지막 장면: 궁금한 지점에서 끊고 볼 수 있는 곳
  no_ost: true                                 # 원작 OST·주제가 대신 무료 음원
  no_evasion: true                             # 좌우 반전·확대·테두리·속도/음높이 변조로 탐지 피하지 않음

sourcing:
  start_from: user_files                        # 사용자가 정식 구매·구독한 에피소드 파일 → projects/<프로젝트>/04_assets/episodes/ (커밋 안 함)
  verify_with: ["감독·작가 공식 인터뷰", "공식 설정집·가이드북", "원작 단행본 권·화", "제작사·배급사 공지"]
needs_pc_rebuild: true

demand:
  queries:
    해석: ["애니 해석", "애니 결말 해석", "애니 복선 정리", "애니 떡밥 정리"]
    요약: ["애니 몰아보기", "애니 결말포함 요약", "애니 줄거리 정리", "애니 리뷰 추천"]
    비교: ["애니 원작 차이", "애니 원작 비교"]
    추천: ["애니 추천", "인생 애니 추천", "애니 순위"]
    분석: ["애니 연출 분석", "애니 작화 분석", "애니 명장면 분석"]
    비하인드: ["애니 비하인드", "애니 제작 비하인드", "애니 감독 인터뷰"]
  min_seconds: 180
  per_channel: 60
