id: ch-ai-shorts
brand: ai                               # channels/brands.yaml (욕망 = 채널)
title: "(가칭) AI 꿀팁 1분"
format: shorts
style_ref: shorts-aitips
family: shorts
concept: >
  (2026-11-11 사용자 결정) AI 스킬·활용법은 모두 쇼츠로. GitHub 에서 뜨는 AI 도구·Claude/Codex 스킬·MCP 서버, 바로 써먹는 활용법 하나를
  30~45초에 '무엇이고 어떻게 쓰나'만 안내. 업계 소식 롱폼은 ch-ai-guide.
niche: "AI 활용법과 GitHub 화제 저장소 안내. README 에 있는 기능만 말한다."
seed_keywords: ["claude code skill", "mcp server", "ai agent", "codex"]
target_seconds: 40
cadence: "주 3~5편"
voice: "미정 — ElevenLabs 로 정함 (영상이 확정된 뒤 목소리를 고르고 아래 tts 의 주석을 풉니다)"
tone: "결과부터 말하는 빠른 안내."

sourcing:
  start_from: repo                # GitHub 최근 14일 별 증가 저장소 + README

# 목소리 확정 후 (docs/08-voice.md):
# tts:
#   backend: elevenlabs
#   elevenlabs: {voice_id: "<ElevenLabs 목소리 ID>", model_id: eleven_multilingual_v2, language_code: ko, stability: 0.5, similarity_boost: 0.75, speed: 1.0}
# 2026-11-13 사용자: PICKIT 쇼츠처럼 — 단, 얼굴 없이 (편집 기법만): hook-shorts (python -m ytflow hookshort, docs/25 §2-1)
reference_styles:
  default: hook-shorts       # 실제 화면(저장소·문서 캡처·화면 녹화) 꽉 채움 + 훅 제목 + 큰 자막 + 튀어나오는 카드 + 빠른 박자
