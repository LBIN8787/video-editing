id: ch-knowledge
title: "(가칭) 몰랐던 이유"
format: longform
style_ref: hybrid                        # 공공 기록 사진·영상 + 인과 지도 + 손그림 도식 (styles/hybrid)
family: source
concept: >
  모두가 이름은 알지만 이유는 모르는 것 — 역사·상식·과학·심리·지리의 '왜'를
  하나의 이야기로 끝까지 풀어 주는 교양 채널. 공공 기록 자료(미국 의회도서관·NASA·정부 기록)를
  자료 화면으로 쓰고, 원인과 결과를 손그림 인과 지도로 쌓는다.
niche: "역사 속 사건·상식의 숨은 이유·인간 심리. 1차 출처로 확인한 숫자만 쓴다. 한국과의 연결을 한 장 이상 넣는다."
seed_keywords: ["왜 그럴까", "우리가 몰랐던", "역사 속 진짜 이유", "이름의 유래", "심리학", "전염병의 역사", "전쟁사", "생활 속 과학"]
target_minutes: 9
cadence: "주 1편 + 4편마다 몰아보기(통합본) 1편"
voice: "ElevenLabs · Nobel Butler (YBRudLRm83BV5Mazcr42) — 부드러운 중년 남성 중저음, 다큐·연구 해설용. 모델 eleven_v4 (2026-11-07 확정)"
tts:
  backend: elevenlabs
  elevenlabs: {voice_id: YBRudLRm83BV5Mazcr42, model_id: eleven_v4, language_code: ko}
  # API 키 없이: ElevenLabs 커넥터(또는 웹)로 장 단위 긴 음성 생성 → python -m ytflow voice-import <프로젝트> part1.mp3 part2.mp3
tone: "이야기하듯. 장면(사람·장소·날짜)으로 시작 → 질문 → 반전 → 숫자는 사람 수로 → 오늘과 연결."
needs_pc_rebuild: false                  # 공공 기록 자료는 클라우드에서 받음

# 주제 고르기 (docs/10-knowledge-demand.md 의 기준)
topic_rules:
  - "누구나 아는 것 + 아무도 모르는 이유 → 질문 하나가 제목"
  - "사람·장소·날짜가 있는 장면으로 시작 (정의·개요로 시작 금지)"
  - "한국·지금 우리와의 연결 한 장 이상"
  - "공공 기록 사진·영상이나 1차 출처 숫자가 있을 것"
  - "충격·비밀 같은 낚시 단어보다 질문형 제목"

# 소스 찾기: 교양 주제는 '기록 보관소에서 출발'
sourcing:
  start_from: archive             # 공공 기록 보관소 (python -m ytflow archive search "<영문 검색어>")
  archives: ["미국 의회도서관 loc.gov (사진·영화, 1930년 이전은 퍼블릭 도메인)", "NASA images-api (퍼블릭 도메인)"]
  verify_with: ["정부·국제기구 통계(CDC, WHO, 통계청)", "학술 논문(PNAS, EID 등 공개본)", "당시 신문(한국: 매일신보·동아일보 인용 보도)", "백과·연구서는 교차 확인용"]

# 수요 분석 (python -m ytflow demand): 검색어와 비교 채널
demand:
  queries:
    상식: ["우리가 몰랐던 상식", "잡학 지식", "왜 그럴까 이유", "잘못 알고 있던 상식"]
    역사: ["역사 이야기", "세계사 미스터리", "조선 역사 이야기", "전쟁 역사"]
    심리: ["심리학 이야기", "사람 심리 실험", "뇌과학 이야기"]
    과학: ["과학 이야기 쉽게", "인체의 신비", "동물 신기한 사실"]
    지리: ["나라 지리 이야기", "지도로 보는", "도시 이야기"]
    생활: ["물건의 기원", "음식의 역사", "브랜드 탄생 이야기"]
  min_seconds: 180
  per_channel: 80
