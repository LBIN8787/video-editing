id: ch-knowledge
brand: curiosity                               # channels/brands.yaml (욕망 = 채널)
title: "한 겹 더 보면"
format: longform
style_ref: hybrid                        # 이야기는 삽화, 설명은 모션그래픽, 증거는 실제 자료, 마디는 검은 화면 (manual/04 §0-7, 12 §0-1)
family: source
concept: >   # 2026-11-22 사용자: "이 채널은 다양한 소재를 이야기로 풀어내고자 합니다. 사람들이 흥미를 가질 요소라면요"
  사람들이 흥미를 가질 만한 다양한 소재(심리·역사·과학·사회·문화·일상의 물건·사건 뒷이야기)를
  이야기로 풀어낸다. 익숙한 장면이나 '어? 왜지?' 하는 질문에서 시작해, 실제로 있었던 일과
  사람을 따라가며 이유를 밝히고, 처음 장면을 새롭게 보게 한다.
niche: "분야를 가리지 않는 호기심 이야기. 기준은 '사람들이 끝까지 궁금해할까'와 '실제 기록·연구로 이야기를 따라갈 수 있나'. 심리학은 여러 분야 중 하나."
seed_keywords: ["숨은 이야기", "사건의 뒷이야기", "역사 속 의외의 사실", "과학의 이유", "일상 물건의 기원", "심리학", "사회 현상의 이유", "기묘한 실화"]
script_guide: prompts/script_knowledge.md
cadence: "일 1편, 매일 18:00 공개 + 4편마다 몰아보기(통합본) 1편"   # 2026-11-22 사용자: "주1회가 아니라 일1회를 의도 … 업로드는 매일저녁6시즘"
voice: "ElevenLabs · Nobel Butler (YBRudLRm83BV5Mazcr42) — 부드러운 중년 남성 중저음, 다큐·연구 해설용. 모델 eleven_v4 (2026-11-07 확정)"
tts:
  backend: elevenlabs
  elevenlabs: {voice_id: YBRudLRm83BV5Mazcr42, model_id: eleven_v4, language_code: ko}
  # API 키 없이: ElevenLabs 커넥터(또는 웹)로 장 단위 긴 음성 생성 → python -m ytflow voice-import <프로젝트> part1.mp3 part2.mp3
character:   # 2026-11-22 사용자: "앞으로 이 채널의 화풍기준과 주요 등장인물을 지우로 설정할게"
  name: 지우
  role: "채널의 주요 등장인물(창작 인물). 편마다 지우가 겪고·해 보고·구경하는 이야기로 풀어 감. 다른 인물은 그 편에 필요할 때만 곁들임."
  look: "둥근 얼굴, 크고 둥근 눈, 짧은 검은 단발, 굵고 단순한 윤곽선, 평면 셀 채색. 옷은 장면에 맞게 바뀌어도 얼굴·머리·그림체는 같게."
  style: "부드러운 셀 애니메이션(잼 편·흰곰 편). 배경도 같은 정도로 단순하게. 실사·반실사·세밀한 질감·작은 눈 쪽으로 가지 않음."
  refs:      # Google Drive ytflow/ 아래. 모든 원화 생성에 이 두 장을 참조로 넣음 (새 편에서 그린 그림은 기준이 아님)
    - "영상/20261120-curiosity-whitebear-v2/art/night.png"          # 지우 얼굴·그림체
    - "영상/20261119-curiosity-choice-blindness/art/tasting.png"    # 채널 화풍
  check: "새 편 원화는 샘플 시트 한 장(지우가 나오는 대표 4칸)을 refs 와 나란히 사용자에게 먼저 보이고, 통과한 뒤 나머지를 그림 (manual/04 §0-7)."
tone: "차분한 이야기. 익숙한 장면·궁금증 → 질문 → 실제로 있었던 일·사람·실험을 따라감 → 처음 장면을 새롭게 이해."
needs_pc_rebuild: false                  # 무료 스톡 실사·모션그래픽·연구 자료 중심 (방송 원본 구간이 필요하면 clip-order, docs/50)

topic_rules:
  - "분야를 가리지 않는다 — 심리·역사·과학·사회·문화·물건·사건 중 사람들이 '왜?' 하고 끝까지 궁금해할 소재를 고른다. 같은 분야가 연달아 이어지지 않게 돌린다."
  - "설명이 아니라 이야기로 — 실제로 있었던 일·사람을 따라가며 처음 장면에 돌아온다."
  - "이야기의 사실(날짜·숫자·인물·연구 결과)은 1차 기록·원 연구·기관 자료로 확인한다."

sourcing:
  start_from: document
  verify_with: ["원 논문·후속 연구", "당시 기록·공문서·박물관·기관 자료", "신뢰할 만한 역사·과학 저술"]
  visuals: "이야기(생활 장면·인물의 행동)는 삽화, 실험 조건·결과는 삽화 위 모션그래픽, 증거(연구자 사진·논문·실험 원본)는 출처를 확인한 실제 자료, 마디는 검은 화면 한 줄 (04 §0-7)"

demand:
  queries:
    심리: ["심리학 이야기", "심리 실험", "기억 착각"]
    역사: ["역사 속 숨은 이야기", "역사 미스터리", "역사의 의외의 사실"]
    과학: ["과학 궁금증", "왜 그럴까 과학", "과학 실화"]
    사회·문화: ["사회 현상 이유", "문화의 기원", "세상의 숨은 규칙"]
    물건·일상: ["물건의 기원", "일상 속 숨은 이야기", "디자인의 이유"]
    실화: ["기묘한 실화", "사건 뒷이야기", "믿기 힘든 실화"]
  min_seconds: 180
  per_channel: 80

youtube:   # 유튜브 올리기 (python -m ytflow yt-publish, docs/24) — 2026-11-20 사용자: "한겹 더 보면" 채널, 일부 공개(링크가 있는 사용자)로
  expected_channel: "한 겹 더 보면"   # 권한이 가리키는 채널 이름이 다르면 올리지 않고 멈춤
  credentials: knowledge     # 이 채널 전용 권한 (YT_*_KNOWLEDGE 또는 PC 의 youtube_knowledge.json) — scripts/youtube_auth.py --name knowledge
  category_id: "27"          # 교육
  default_language: ko
  made_for_kids: false
  publish_time: "18:00"      # 한국 시간 예약 공개 (2026-11-22 사용자: 매일 저녁 6시쯤, "예약공개로 해주시고"). 예약 전까지 비공개 → 18:00 공개. 18:00 이 지났으면 바로 올리지 말고 다음 날 18:00 으로 --at
  privacy: public            # 예약 시각이 지난 채 --at 없이 올리면 바로 공개됨 — 실행기는 늘 예약으로 올림 (11-20 의 일부 공개를 대신함)
  captions: true
  synthetic_media: false
  playlists: {}
