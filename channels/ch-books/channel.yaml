id: ch-books
brand: books                                   # channels/brands.yaml (욕망 = 채널)
title: "(가칭) 책이 답한다"
format: longform
style_ref: hybrid                              # 이야기는 삽화, 설명은 모션그래픽, 증거는 실제 자료, 마디는 검은 화면
family: source
status: experiment                             # 2026-11-27 채널 방향 조사 단계 — 브랜치에만 두고 main 에 합치지 않음
concept: >   # 2026-11-27 사용자: "책 리뷰채널을 만들려고 해 … 핵심은 스토리텔링 능력이야" → 형식은 "2와 3으로"
  책 소개가 아니라 시청자의 질문에서 출발해 책으로 답하는 채널.
  두 형식을 함께 운영한다 — ② 질문형(독서·뇌·심리·습관의 질문 → 뜻밖의 답 → 그 답을 준 책)과
  ③ 명작 서사형(소설·고전 한 편을 주인공의 마음을 따라 결말까지 들려주는 이야기).
  두 형식 모두 얼굴 없이, 이야기는 장면 삽화·설명은 모션그래픽·증거는 실제 자료로 만든다.
  근거: 구독자 대비 조회수 분석(docs/74 §8) — 줄거리 서사·소설·심리가 가장 강하고, 질문형은 독서·뇌 주제에서만 강함.
niche: "소설·고전 문학·철학 고전(③)과 독서·뇌·심리·습관 책(②). 기준은 '책 없이도 끝까지 볼 만큼 궁금한가'와 '이야기·주장을 원문·원 연구로 확인할 수 있나'."
seed_keywords: ["명작 줄거리", "소설 줄거리 결말", "고전 문학 쉽게", "주인공 심리", "인생 소설", "독서가 뇌에", "책 읽는 법", "심리학 책"]
script_guide: prompts/script_books.md
research: docs/74-book-channel.md

formats:   # 두 형식 — 대기열에서 주제마다 하나를 고름 (docs/74 §3)
  question:
    name: "② 질문형"
    reference: "책그림(심리 책 → 일상 질문 + 반직관적 연구)"
    length: "8~12분"
    spine: "일상 질문(답은 숨김) → 흔한 답이 틀린 이유 → 책이 준 뜻밖의 답(연구·사례) → 내 삶에 옮기면 → 첫 질문으로 돌아가 답 + 직접 읽을 대목 하나"
    fits: "심리·자기계발·행동경제·뇌과학 — 시청자의 행동·습관·감정과 닿는 책"
  story:   # 2026-11-27 ③ 다큐형(과학)에서 바꿈 — 조회수 분석(docs/74 §8): 줄거리 서사·소설·심리가 가장 강하고 과학이 가장 약함. 사용자: "그대로 고쳐주세요"
    name: "③ 명작 서사형"
    reference: "명작 속 주인공 심리·등불 켜진 책장·삼체 소설판(구독자의 30~100배 조회) — 장면 삽화 + 내레이션으로 결말까지 들려줌"
    length: "10~20분"
    spine: "작품 속 한 장면으로 열기(제목은 나중) → 시청자의 질문 셋 → 작품·작가 한 줄 → 주인공 한 명의 마음을 따라 이야기를 시간 순서로, 막마다 다음 질문 → 결말(제목·첫머리에 '결말 포함') → 그 마음이 우리에게 묻는 것 → 첫 장면으로 돌아가기"
    fits: "소설·고전 문학·철학 고전(이야기가 있는 것) — 주인공의 마음이 오늘의 고민(사랑·상실·불안·욕망)과 닿는 작품"
    rights: "저작권이 끝난 고전 우선(한국 기준 저자 사망 1962년 이전 등은 확인 후). 현대 소설은 본문 인용을 짧게, 줄거리는 우리 말로 다시 씀. 본문 전문 낭독 없음"

cadence: "주 2편으로 시작 — ③ 명작 서사형을 주력(주 1~2), ② 질문형을 곁들임. 반응을 보고 조정"
voice: "초안 무료 목소리(edge·Gemini), 채널 목소리는 첫 편 확정 후 정함"
tts:
  backend: edge
tone: "차분한 다큐 내레이터 '~습니다'. 인사·채널 소개·순서 예고 없이 첫 문장부터 질문 또는 장면 (manual v24)."
needs_pc_rebuild: false

topic_rules:
  - "책 제목으로 열지 않는다 — 시청자의 질문(②) 또는 가장 놀라운 장면(③)으로 연다. 책은 답이나 증거로 등장한다."
  - "요약이 아니라 번역 — 책의 핵심 하나를 시청자의 삶(직장·관계·돈·습관)으로 옮긴다. 한 편 = 핵심 하나."
  - "주인공을 세운다 — 저자·연구자·책 속 인물·시청자를 대신하는 인물 중 하나를 따라간다."
  - "책의 주장 중 숫자·연구 결과는 원 논문·기록으로 확인한다. 책이 틀렸거나 반박된 부분이 있으면 말한다(재현 실패 등)."
  - "② 질문형은 다 말하지 않는다 — 직접 읽어 볼 대목 하나를 남긴다. ③ 명작 서사형은 결말까지 들려주되 제목·첫머리에 '결말 포함'을 밝힌다."
  - "주제 우선순위(조회수 분석): 소설·고전 × 인물 심리 > 철학 고전을 이야기로 > 독서·뇌·습관 질문. 과학 교양서는 당분간 하지 않는다."
  - "길이는 10~20분 — 분석에서 평소 대비 조회가 가장 높았던 구간."
  - "본문 낭독·긴 인용 금지 — 짧은 인용과 우리 말로 다시 쓴 설명만. 표지·저자 사진은 출판사 공개 자료로."
  - "협찬을 받으면 영상 첫머리와 설명란에 고지한다."

sourcing:
  start_from: document
  verify_with: ["작품 원문·번역본(쪽수 기록)", "작가 연보·당대 기록(배경 설명용)", "책이 인용한 원 논문·후속 연구·재현 연구(②)", "저자 인터뷰·강연(공식 채널)", "출판사 공개 자료(표지·소개)"]
  visuals: "③ 이야기는 박자마다 장면 삽화(같은 인물은 같은 얼굴) + 하단 자막, 마음은 생각 풍선·인물 카드, ② 연구·숫자는 모션그래픽, 증거(논문·연구자·당시 사진)는 출처를 확인한 실제 자료, 책 표지는 '오늘의 책' 카드로 한 번, 마디는 페이지 넘김·검은 화면 한 줄"

demand:
  queries:
    소설: ["명작 줄거리", "소설 줄거리 결말", "인생 소설", "주인공 심리"]
    고전: ["고전 문학 쉽게", "세계문학 줄거리", "철학 책 쉽게"]
    독서·뇌: ["독서가 뇌에", "책 읽는 법", "독서 기억법"]
    심리: ["심리학 책 요약", "심리학 책 추천"]
  min_seconds: 180
  per_channel: 80

youtube:
  expected_channel: ""      # 채널 개설 후 채움
  category_id: "27"         # 교육
  default_language: ko
  made_for_kids: false
  captions: true
  synthetic_media: false
