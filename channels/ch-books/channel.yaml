id: ch-books
brand: books                                   # channels/brands.yaml (욕망 = 채널)
title: "(가칭) 책이 답한다"
format: longform
style_ref: hybrid                              # 이야기는 삽화, 설명은 모션그래픽, 증거는 실제 자료, 마디는 검은 화면
family: source
status: experiment                             # 2026-11-27 채널 방향 조사 단계 — 브랜치에만 두고 main 에 합치지 않음
concept: >   # 2026-11-27 사용자: "책 리뷰채널을 만들려고 해 … 핵심은 스토리텔링 능력이야" → 형식은 "2와 3으로"
  책 소개가 아니라 시청자의 질문에서 출발해 책으로 답하는 채널.
  두 형식을 함께 운영한다 — ② 질문형(일상의 질문 → 뜻밖의 답 → 그 답을 준 책)과
  ③ 다큐형(한 권의 가장 놀라운 사실을 사람과 사건으로 따라가는 짧은 다큐).
  두 형식 모두 얼굴 없이, 이야기는 삽화·설명은 모션그래픽·증거는 실제 자료로 만든다.
niche: "심리·자기계발·과학·역사 교양서. 기준은 '책 없이도 끝까지 볼 만큼 궁금한가'와 '책의 주장을 원 연구·기록으로 확인할 수 있나'."
seed_keywords: ["책 추천", "책 리뷰", "책 요약", "심리학 책", "과학 책", "인생 책", "베스트셀러 리뷰", "고전 쉽게"]
script_guide: prompts/script_books.md
research: docs/74-book-channel.md

formats:   # 두 형식 — 대기열에서 주제마다 하나를 고름 (docs/74 §3)
  question:
    name: "② 질문형"
    reference: "책그림(심리 책 → 일상 질문 + 반직관적 연구)"
    length: "8~12분"
    spine: "일상 질문(답은 숨김) → 흔한 답이 틀린 이유 → 책이 준 뜻밖의 답(연구·사례) → 내 삶에 옮기면 → 첫 질문으로 돌아가 답 + 직접 읽을 대목 하나"
    fits: "심리·자기계발·행동경제·뇌과학 — 시청자의 행동·습관·감정과 닿는 책"
  docu:
    name: "③ 다큐형"
    reference: "북툰(과학 책 → 호기심 제목 + 담백한 다큐 연출)"
    length: "7~10분"
    spine: "가장 놀라운 장면·사실로 열기 → 그 일을 처음 알아낸 사람(저자·연구자·책 속 인물) → 발견까지의 과정을 시간 순서로 → 그래서 바뀐 것 → 책이 남긴 질문"
    fits: "과학·역사·문명사·인물 — 사건과 발견이 있는 책"

cadence: "주 2편으로 시작 (형식 ②·③ 번갈아). 반응을 보고 조정"
voice: "초안 무료 목소리(edge·Gemini), 채널 목소리는 첫 편 확정 후 정함"
tts:
  backend: edge
tone: "차분한 다큐 내레이터 '~습니다'. 인사·채널 소개·순서 예고 없이 첫 문장부터 질문 또는 장면 (manual v24)."
needs_pc_rebuild: false

topic_rules:
  - "책 제목으로 열지 않는다 — 시청자의 질문(②) 또는 가장 놀라운 장면(③)으로 연다. 책은 답이나 증거로 등장한다."
  - "요약이 아니라 번역 — 책의 핵심 하나를 시청자의 삶(직장·관계·돈·습관)으로 옮긴다. 한 편 = 핵심 하나."
  - "주인공을 세운다 — 저자·연구자·책 속 인물·시청자를 대신하는 인물 중 하나를 따라간다."
  - "책의 주장 중 숫자·연구 결과는 원 논문·기록으로 확인한다. 책이 틀렸거나 반박된 부분이 있으면 말한다(재현 실패 등)."
  - "다 말하지 않는다 — 결말에서 직접 읽어 볼 대목 하나를 남긴다. 스포일러(소설 결말)는 하지 않는다."
  - "본문 낭독·긴 인용 금지 — 짧은 인용과 우리 말로 다시 쓴 설명만. 표지·저자 사진은 출판사 공개 자료로."
  - "협찬을 받으면 영상 첫머리와 설명란에 고지한다."

sourcing:
  start_from: document
  verify_with: ["책 본문(쪽수 기록)", "책이 인용한 원 논문·후속 연구·재현 연구", "저자 인터뷰·강연(공식 채널)", "출판사 공개 자료(표지·소개)"]
  visuals: "이야기(인물의 행동·상황)는 삽화, 연구·숫자는 모션그래픽, 증거(논문·연구자·당시 사진)는 출처를 확인한 실제 자료, 책 표지는 '오늘의 책' 카드로 한 번, 마디는 검은 화면 한 줄"

demand:
  queries:
    심리: ["심리학 책 추천", "심리학 책 리뷰", "인간관계 책"]
    자기계발: ["자기계발 책 요약", "습관 책", "인생 책 추천"]
    과학: ["과학 책 추천", "교양 과학 책", "우주 책"]
    역사: ["역사 책 추천", "문명사 책", "총균쇠 요약"]
    고전: ["고전 쉽게", "철학 책 쉽게", "고전 요약"]
  min_seconds: 180
  per_channel: 80

youtube:
  expected_channel: ""      # 채널 개설 후 채움
  category_id: "27"         # 교육
  default_language: ko
  made_for_kids: false
  captions: true
  synthetic_media: false
