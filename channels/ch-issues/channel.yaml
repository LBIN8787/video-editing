id: ch-issues
brand: issues                            # channels/brands.yaml (욕망 = 채널)
title: "(가칭) 이슈의 구조"
format: longform
style_ref: hybrid
family: source
concept: >
  시사·사회 이슈와 역사 사건 하나를 실제 사진·영상·당시 문서로 따라가고,
  지도·연표·인포그래픽으로 시간·공간·인과와 차이를 풀어낸다. 편집 기준은 기존 스페인독감 편이다.
niche: "국제정치·사회·제도 변화, 역사 사건의 경과와 원인. 취재·기록 자료로 확인할 수 있는 사건을 다룬다."
seed_keywords: ["국제 정세", "지정학", "역사 사건", "당시 기록", "사회 이슈 정리", "제도 변화", "몰락 이유"]
script_guide: manual/08-issues.md
target_minutes: 13            # 심층 13~18분 / 빠른 정리 10~12분 (v24: 롱폼 최소 10분)
cadence: "주 1~2편 (큰 사건은 48시간 안 빠른 정리 → 1주 안 심층)"
voice: "미정 — ElevenLabs 로 정함 (차분하고 신뢰감 있는 30~40대 톤 권장)"
tone: "실제 장면으로 시작 → 질문 하나 → 시간과 인과 → 자료 비교 → 결과와 의미. 시사는 기준 시각·당사자 입장, 역사는 자료의 작성 시기와 해석 범위를 밝힌다."
needs_pc_rebuild: true        # 뉴스 영상 원본은 PC rebuild, 클라우드에서는 사진·지도·도식 중심

sourcing:
  start_from: document
  current: "기관 발표·공식 발언 원본, 당사자 입장과 별개 언론의 확인 보도"
  history: "당대 사진·영상·신문·기록 문서, 이후 조사·연구. 화면에 사용한 자료의 실제 시점과 장소를 확인"
  verify_with: ["정부·기관 공식 발표와 원문", "통신사 및 서로 다른 성향의 언론", "국제기구 통계", "당대 자료와 독립적인 역사 연구"]
  photos: "퍼블릭 도메인(미국 정부·의회도서관)·위키미디어 CC BY/CC0·공식 보도자료 사진. 뉴스 영상 화면은 출처·날짜 표시, 길게 쓰지 않음"

demand:
  queries:
    국제: ["국제 정세 정리", "전쟁 이유 정리", "지정학 이야기", "트럼프 정책 정리"]
    몰락: ["몰락 이유", "망한 이유", "붕괴 이유"]
    사회: ["사회 이슈 정리", "요즘 논란 정리", "제도 바뀌는 이유"]
    역사: ["역사 사건의 이유", "당시 신문 역사", "기록으로 보는 역사"]
  min_seconds: 180
  per_channel: 60

# 목소리·배경음 (2026-11-10 시험 적용: 사우디 앞부분) — docs/08-voice.md, assets/bgm/bgm.yaml
# 목소리: Mina (ElevenLabs 라이브러리) — 또렷·따뜻·차분, 친근하고 신뢰감 있는 대화체 → '재미있게 보는 뉴스' MC 톤. 다른 채널(남성)과 구분.
tts:
  backend: elevenlabs
  elevenlabs: {voice_id: aiUUgjHa4mpHf6UenZuf, model_id: eleven_v4, language_code: ko}
  # API 키 없이: ElevenLabs 커넥터로 긴 음성 생성 → python -m ytflow voice-import <프로젝트> part1.mp3
# bgm: 기본 없음 (2026-11-11 사용자 판정: 배경음은 꼭 필요하지 않음 — 어울리는 곡이 확실할 때만 대본에 지정). 후보: assets/bgm/bgm.yaml
