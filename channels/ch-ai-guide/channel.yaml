id: ch-ai-guide
brand: ai                                # channels/brands.yaml (욕망 = 채널)
title: "(가칭) AI 최전선"
format: longform
style_ref: hybrid                        # 실제 화면 녹화·공식 발표 영상 + 손그림 도식 (장면별 연출은 manual/05-style-matching.md)
family: source
concept: >
  (2026-11-11 사용자 결정) 롱폼 = AI 업계 최전선 소식. 이번 주 AI 업계의 큰 흐름(새 모델 발표·상장·투자·인수·칩 공급·규제·큰 회사의 사건)을
  '무슨 일 → 왜 중요한가 → 이용자에게 바뀌는 것' 순서로 푼다. 스킬·활용법은 쇼츠 라인(ch-ai-shorts)으로.
niche: "AI 업계 최전선 소식을 이용자 눈높이로. 회사 공식 발표·통신사·정부 발표로만 말한다. 주가 분석은 market, 과장 표현 금지."
seed_keywords: ["AI 업계", "새 AI 모델 발표", "OpenAI", "Anthropic", "Google Gemini", "Nvidia AI 칩", "AI 규제", "AI 투자 상장"]
target_minutes: 10
cadence: "주 1편 (큰 발표가 있으면 48시간 안에)"
voice: "미정 — ElevenLabs 로 정함 (밝고 빠른 30대 톤 권장, docs/08-voice.md)"
tone: "결과부터 보여 주고(데모) → 원리는 비유로 → 따라 하기는 단계 번호로."
needs_pc_rebuild: false

topic_rules:
  - "발표·출시 72시간 안이면 '무엇이 바뀌었나', 그 뒤면 '어떻게 쓰나'로"
  - "직접 실행해 본 결과 화면이 1개 이상 (없으면 쇼츠로 낮춤)"
  - "공식 출처(블로그·문서·릴리스 노트) 1개 이상 + 독립 검증(벤치마크·사용 후기) 1개 이상"
  - "가격·제한(무료/유료, 지역) 정보를 반드시 포함"

sourcing:
  start_from: release             # 공식 발표·릴리스 노트·GitHub 저장소 → 직접 실행 화면 녹화
  documents: ["회사 공식 블로그·문서·릴리스 노트", "GitHub README·CHANGELOG", "공식 계정 X 게시물(oEmbed 캡처)", "독립 벤치마크(LMArena, METR 등)"]
  capture: "직접 실행 화면은 Playwright 캡처 또는 사용자 PC 화면 녹화 (로그인 화면·개인정보 가리기)"

# 수요 분석 (python -m ytflow demand --channel ch-ai-guide)
demand:
  queries:
    AI디자인: ["바이브코딩 디자인", "AI 웹사이트 디자인", "AI 티 나는 디자인", "클로드 코드 디자인"]
    AI스킬: ["클로드 스킬", "claude code skills", "클로드 코드 사용법", "코덱스 사용법"]
    AI활용: ["AI 업무 자동화", "AI 활용법", "챗GPT 활용법", "AI 에이전트 사용법"]
  min_seconds: 180
  per_channel: 60
# 2026-11-13 사용자: AI 활용 채널에서 다룰 내용은 레퍼런스 1분코딩 'AI 뉴스 위클리'·PICKIT 쇼츠와 비슷함 (docs/25 §4)
reference_styles:
  weekly: news-desk          # 주간 AI 소식 N가지 — 한 소식 = 한 장 (newsdesk 장면), 2~3장마다 화면 따라 하기·도식 섞기
  explainer: hybrid          # 도구 하나 깊게 — 기존 하이브리드(실제 화면 + 손그림 도식)
