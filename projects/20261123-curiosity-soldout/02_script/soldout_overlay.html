<!doctype html>
<html><head><meta charset="utf-8">
<!-- 품절 임박 편 (2026-11-23): 판테온 v3 화면에 지우의 휴대폰 화면(uiLayer, 원화 빈 화면 위에만)·설명 겹(FX: rows·dots·clock·stock·rate)을 더함.
     판테온 편 v2 (2026-11-22): v1 화면 + 돔 단면 모션그래픽(MG.dome — 지우가 직접 지어 보는 과정, 실제 비율).
     판테온 편: 의지력 편 v15 화면을 그대로 가져와 실제 사진 출처 표시(CREDIT)만 더함 (2026-11-22).
     의지력 편 v6 화면 (D4 기각 반영 2026-11-21): 이야기가 앞, 연구는 실험실 장면 안에서. 검은 바탕, 그래프·설명 카드 없음.
     원화 위에는 그 순간의 낱말·숫자만(흰 글씨 + 어두운 띠). 기준 화면 = 서윤의 냉장고 메모. INIT/R 계약은 full_overlay.html 과 같음. -->
<style>
@font-face{font-family:NG;src:url(../../../ytflow/assets/fonts/NanumGothic-Bold.ttf)}
@font-face{font-family:NGX;src:url(../../../ytflow/assets/fonts/NanumGothic-ExtraBold.ttf)}
@font-face{font-family:BH;src:url(../../../ytflow/assets/fonts/BlackHanSans-Regular.ttf)}
@font-face{font-family:PEN;src:url(../../../ytflow/assets/fonts/NanumPenScript-Regular.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0c0b}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const BG='#0d0c0b',CREAM='#efe7da',DIM='#9a8f80',RED='#d9574a',GOLD='#e0ad4c',GRN='#4f9f78',INK='#2b2622';
// 원화 좌표 (lab16 조각 기준 1920×1080): 모니터 화면, 메모
const SCREEN={x:620,y:122,w:1030,h:686}, MEMO={x:672,y:250,w:292,h:436};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), ease=v=>{v=cl(v);return v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2};
const io=(t,a,d=.5)=>ease((t-a)/d);
const pop=(t,a)=>{const v=cl((t-a)/.35);return v<=0?0:1+0.2*Math.sin(v*Math.PI)*(1-v)};
let S=[],IM={};
function txt(s,X,Y,size,col,font='NG',align='center',alpha=1){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.fillStyle=col;x.font=`${size}px ${font}`;x.textAlign=align;x.textBaseline='middle';x.fillText(s,X,Y);x.restore()}
function wrap(s,maxW,size,font){x.save();x.font=`${size}px ${font}`;const out=[];let cur='';for(const w of s.split(' ')){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}if(cur)out.push(cur);x.restore();return out}
function para(s,X,Y,maxW,size,col,font='NG',align='center',alpha=1,lh=1.4){const L=wrap(s,maxW,size,font);L.forEach((l,i)=>txt(l,X,Y+(i-(L.length-1)/2)*size*lh,size,col,font,align,alpha));}
function rr(X,Y,w,h,r,fill,stroke,lw=3,alpha=1){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.beginPath();x.roundRect(X,Y,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}x.restore()}
function dot(X,Y,r,col,alpha=1){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.fillStyle=col;x.beginPath();x.arc(X,Y,r,0,Math.PI*2);x.fill();x.restore()}
function black(){x.fillStyle=BG;x.fillRect(0,0,1920,1080)}
function camT(lt,D,mv,name){const p=cl(lt/Math.max(D,1));let s=1.04,dx=0,dy=0;
  if(mv==='z'&&CUR&&CUR.d.scr&&CUR.d.scr[name]){const r=CUR.d.scr[name].rot,e=ease(cl(lt/2.2)),z=CUR.d.zs||1.55;s=1+(z-1)*e;dx=(r[0]-960)*(1-s)+(960-r[0])*.3*e;dy=(r[1]-540)*(1-s)+(540-r[1])*.3*e;return {s,dx,dy}}
  if(mv==='still'){s=1}else if(mv==='in'){s=1.0+0.07*p}else if(mv==='out'){s=1.07-0.07*p}else if(mv==='left'){s=1.07;dx=40-80*p}else if(mv==='right'){s=1.07;dx=-40+80*p}return {s,dx,dy}}
function art(name,lt,D,mv='in',alpha=1){if(name==='black'){x.save();x.globalAlpha=alpha;black();x.restore();return}const im=IM[name];if(!im||alpha<=0)return;const {s,dx,dy}=camT(lt,D,mv,name);
  const w=1920*s,h=1080*s;x.save();x.globalAlpha=alpha;x.drawImage(im,960-w/2+dx,540-h/2+dy,w,h);
  if(CUR&&CUR.d.ui&&CUR.d.scr&&CUR.d.scr[name]&&IM['mask_'+name]){uiLayer(name,CUR.d,CUR.t,CUR.K);x.drawImage(OC,960-w/2+dx,540-h/2+dy,w,h)}
  x.restore()}
function vign(){const g=x.createRadialGradient(960,540,500,960,540,1150);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=g;x.fillRect(0,0,1920,1080);
  const b=x.createLinearGradient(0,820,0,1080);b.addColorStop(0,'rgba(0,0,0,0)');b.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=b;x.fillRect(0,820,1920,260)}
function tag(s){}   // 왼쪽 위 꼬리표 없음 (사용자 2026-11-21: "재현 창작인물 서윤 이런 왼쪽 위 문구 없애주고")
// 장면 위 한 줄(흰 글씨 + 어두운 띠): 그 순간의 낱말
function label(s,lt,Y=110,size=48){const a=io(lt,.15,.4);if(a<=0)return;x.save();x.font=`${size}px BH`;const w=x.measureText(s).width;x.restore();
  x.save();x.globalAlpha=a*.72;x.fillStyle='#000';x.fillRect(960-w/2-40,Y-size*0.85,w+80,size*1.7);x.restore();txt(s,960,Y,size,CREAM,'BH','center',a)}
function stampT(s,lt,Y=140,col=CREAM){const n=Math.floor(cl((lt-.3)/1.2)*s.length);x.save();x.font='54px BH';const w=x.measureText(s).width;x.restore();rr(36,Y-44,w+60,84,10,'rgba(0,0,0,.55)',null,0,n>0?1:0);txt(s.slice(0,n),66,Y,54,col,'BH','left')}
function SUB(s){if(!s)return;x.save();x.font='42px NGX';const w=x.measureText(s).width;x.fillStyle='rgba(10,9,8,.86)';x.beginPath();x.roundRect(960-w/2-30,966,w+60,74,10);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(s,960,1004);x.restore()}
function mark(kind,X,Y,s,a=1){if(a<=0)return;x.save();x.globalAlpha=a;x.lineWidth=s*.16;x.lineCap='round';x.strokeStyle=kind==='q'?GOLD:GRN;x.fillStyle=kind==='q'?GOLD:GRN;
  if(kind==='q'){x.font=`${s*2}px PEN`;x.textAlign='center';x.textBaseline='middle';x.fillText('?',X,Y)}else{x.beginPath();x.moveTo(X-s*.5,Y);x.lineTo(X-s*.1,Y+s*.4);x.lineTo(X+s*.55,Y-s*.45);x.stroke()}x.restore()}
// 냉장고 메모: 손글씨 + 표시들
function memoScene(t,D,marks,add,tAdd,writeAt){art('lab16_br',t,D,'still');vign();tag('재현 · 창작 인물 서윤');
  const m=MEMO,s='자제력은 쓰면 줄어든다',n=Math.floor(cl((t-writeAt)/1.6)*s.length);
  x.save();x.translate(m.x+m.w/2,m.y+m.h/2);x.rotate(-0.04);x.font='66px PEN';x.fillStyle='#2b2622';x.textAlign='center';x.textBaseline='middle';
  const L=['자제력은','쓰면 줄어든다'];let k=0;L.forEach((l,i)=>{const take=Math.max(0,Math.min(l.length,n-k));x.fillText(l.slice(0,take),0,(i-.5)*80-20);k+=l.length});x.restore();
  const all=add?marks.concat([add]):marks;all.forEach((mk,i)=>{const nw=add&&i===all.length-1;mark(mk,m.x+m.w+150+i*190,m.y+m.h/2-20,nw?130*pop(t,tAdd):130,nw?cl((t-tAdd)/.3):1)})}

const CREDIT={};   // v105(2026-11-22): 오른쪽 위 출처 상자 기본 끔 — 사진 출처는 설명란(youtube.md)
function credit(n){const s=CREDIT[n];if(!s)return;x.save();x.font='24px NG';const w=x.measureText(s).width;x.globalAlpha=.6;x.fillStyle='#000';x.fillRect(1880-w-20,24,w+40,44);x.globalAlpha=1;x.fillStyle=CREAM;x.textAlign='right';x.textBaseline='middle';x.fillText(s,1880,46);x.restore()}

// ---------- 품절 임박 편 (2026-11-23): 지우의 휴대폰 화면(지어낸 쇼핑 앱) — 원화의 빈 화면 위에만 그림(가림막 = 원화에서 빛나는 화면 픽셀) ----------
let CUR=null;const OC=document.createElement('canvas');OC.width=1920;OC.height=1080;const oc=OC.getContext('2d');
const mmss=v=>{v=Math.max(0,Math.ceil(v));return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};
function uiState(u,t,K){const kk=k=>k==null?1e9:(k<0?0:K[k]);const st={};
  if(u.timer){const [s0,k]=u.timer;st.timer=Math.max(0,s0-Math.max(0,t-kk(k)));st.timerOn=t>=kk(k)-.2||k<0}
  if(u.stock){let v=null,at=0;u.stock.forEach(([n,k])=>{if(t>=kk(k)-.1){v=n;at=kk(k)}});st.stock=v;st.stockAt=at;st.stockPrev=null;
    for(let i=1;i<u.stock.length;i++)if(u.stock[i][0]===v&&t>=kk(u.stock[i][1])-.1)st.stockPrev=u.stock[i-1][0]}
  if(u.toast!=null)st.toast=io(t,kk(u.toast)-.1,.4);
  if(u.press!=null)st.press=io(t,kk(u.press),.3);
  if(u.zero!=null)st.zero=t>=kk(u.zero);
  return st}
function uiLayer(name,d,t,K){const sc=d.scr[name],rt=(d.uirot&&d.uirot[name])||sc.rot;const st=uiState(d.ui,t,K);
  oc.setTransform(1,0,0,1,0,0);oc.globalCompositeOperation='source-over';oc.clearRect(0,0,1920,1080);
  // 화면 기울기 그대로: 가운데로 옮기고 돌린 뒤 (0,0) 기준 상자에 그림. rot = [cx, cy, w, h, 각도(도)]
  oc.translate(rt[0],rt[1]);oc.rotate(rt[4]*Math.PI/180);const W=rt[2],H=rt[3],X=-W/2,Y=-H/2;
  const f=W/12, T=(s,px,py,size,col,font='NGX',al='center')=>{oc.font=`${size}px ${font}`;oc.fillStyle=col;oc.textAlign=al;oc.textBaseline='middle';oc.fillText(s,px,py)};
  oc.fillStyle='#f6f4f1';oc.fillRect(X-40,Y-40,W+80,H+80);
  // 위 띠: 타임세일 시계
  oc.fillStyle='#d8433a';oc.fillRect(X-40,Y-40,W+80,H*.085+40);
  if(st.timerOn!==false&&st.timer!=null){T('타임세일 종료까지',X+W*.06,Y+H*.045,f*.62,'#fff','NGX','left');T(st.zero?'00:00':mmss(st.timer),X+W*.94,Y+H*.045,f*.95,'#fff','BH','right')}
  // 상품 그림
  const pi=IM.room2_bl;if(pi){const iw=W*.88,ih=H*.33;oc.save();oc.beginPath();oc.roundRect(X+W*.06,Y+H*.11,iw,ih,f*.3);oc.clip();const sw=pi.width*.62,sh=sw*ih/iw;oc.drawImage(pi,(pi.width-sw)/2,(pi.height-sh)/2,sw,sh,X+W*.06,Y+H*.11,iw,ih);oc.restore()}
  T('겨울 후드 롱패딩',X+W*.07,Y+H*.49,f*.8,'#2b2622','NGX','left');
  T('129,000원',X+W*.07,Y+H*.555,f*1.15,'#2b2622','BH','left');
  // 남은 수량
  if(st.stock!=null){const ch=st.stockPrev!=null?pop(t,st.stockAt):1;const sz=f*1.05*(ch||1);
    if(st.stockPrev!=null&&t-st.stockAt<4.5){oc.save();oc.globalAlpha=.75*(1-cl((t-st.stockAt-3.8)/.7));T(st.stockPrev+'개',X+W*.62,Y+H*.625,f*.7,'#9a8f80','NGX','left');oc.strokeStyle='#9a8f80';oc.lineWidth=f*.08;oc.beginPath();oc.moveTo(X+W*.61,Y+H*.625);oc.lineTo(X+W*.61+f*1.6,Y+H*.625);oc.stroke();oc.restore()}
    T(st.stock+'개 남음',X+W*.07,Y+H*.625,sz,'#d8433a','BH','left')}
  // 방금 구매 알림
  if(st.toast>0){oc.save();oc.globalAlpha=st.toast;oc.fillStyle='rgba(43,38,34,.92)';oc.beginPath();oc.roundRect(X+W*.06,Y+H*.675+(1-st.toast)*f*.6,W*.88,H*.065,H*.032);oc.fill();
    T('방금 2명이 구매했습니다',X+W*.5,Y+H*.7075+(1-st.toast)*f*.6,f*.62,'#fff','NGX');oc.restore()}
  // 결제 버튼
  const pr=st.press||0;oc.fillStyle=pr>0?'#b9352d':'#d8433a';oc.beginPath();oc.roundRect(X+W*.06,Y+H*.8,W*.88,H*.09,H*.03);oc.fill();T('결제하기',X+W*.5,Y+H*.845,f*.95,'#fff','BH');
  // 가림막: 원화에서 빛나는 화면 픽셀에만
  oc.setTransform(1,0,0,1,0,0);oc.globalCompositeOperation='destination-in';oc.drawImage(IM['mask_'+name],0,0,1920,1080);oc.globalCompositeOperation='source-over'}
// 설명 겹: 원화를 어둡게 깔고 그 위에 (d.fx)
function dimBg(a){x.fillStyle=`rgba(10,9,8,${a})`;x.fillRect(0,0,1920,1080)}
function cookieIcon(X,Y,r,a=1){x.save();x.globalAlpha=a;x.fillStyle='#c9924f';x.beginPath();x.arc(X,Y,r,0,7);x.fill();x.fillStyle='#4a2f1d';[[-.35,-.2],[.25,-.3],[.05,.25],[-.3,.35],[.4,.2]].forEach(([u,v])=>{x.beginPath();x.arc(X+u*r,Y+v*r,r*.13,0,7);x.fill()});x.restore()}
const FX={};
// rows: [[왼쪽 글, 오른쪽 글, kw]] — 셋을 나란히 맞대기
FX.rows=(p,t,K)=>{const n=p.rows.length,a0=io(t,K[p.rows[0][2]]-.3,.5);dimBg(.62*a0);if(p.head)txt(p.head,960,250,44,DIM,'NGX','center',a0);
  p.rows.forEach(([l,r,k,rk],i)=>{const a=io(t,K[k]-.1,.45),Y=430+(i-(n-1)/2)*150+60,kr=rk==null?K[k]+.35:K[rk]-.1;txt(l,860,Y,58,CREAM,'BH','right',a);arrow(900,Y,1010,Y,GOLD,6,io(t,kr-.3,.3),io(t,kr-.25,.4));chip(r,1290,Y,46,'rgba(216,67,58,.95)','#fff',io(t,kr,.4))})};
// dots: n 개 중 hi 개 — [{n, cols, hi, kwShow, kwHi, top, hiText}]
FX.dots=(p,t,K)=>{const a0=io(t,K[p.kw]-.2,.5);dimBg(.72*a0);const n=p.n,cols=p.cols,rows=Math.ceil(n/cols),gap=p.gap||90,r=p.r||30;const W=(cols-1)*gap,H=(rows-1)*gap,X0=960-W/2,Y0=(p.cy||500)-H/2;
  if(p.top)txt(p.top,960,Y0-r-80,50,CREAM,'BH','center',a0);
  const hiOn=p.kwHi!=null?io(t,K[p.kwHi]-.1,.5):0;
  for(let i=0;i<n;i++){const cx=X0+(i%cols)*gap,cy=Y0+Math.floor(i/cols)*gap,ai=a0*io(t,K[p.kw]+i*(p.stagger??.02),.25);const h=p.hiSet?p.hiSet.includes(i):i<p.hi;
    const ak=p.keep!=null&&i>=p.keep?ai*(1-hiOn):ai;
    if(p.cookie)cookieIcon(cx,cy,r,ak);else dot(cx,cy,r,h&&hiOn>0?(p.hiCol||RED):'#5d544b',ai);
    if(h&&hiOn>0){x.save();x.globalAlpha=hiOn*ai;x.strokeStyle=p.hiCol||RED;x.lineWidth=6;x.beginPath();x.arc(cx,cy,r+8,0,7);x.stroke();x.restore()}}
  if(p.hiText)txt(p.hiText,960,Y0+H+r+80,54,p.hiCol||RED,'BH','center',hiOn)};
// clock: 크게 거꾸로 가는 시계 — mode 'reset'(0 → 처음으로), 'run'
FX.clock=(p,t,K)=>{const a=io(t,K[p.kw]-.2,.4);dimBg(.66*a);const lt=t-K[p.kw];let v,tagS='';
  if(p.mode==='reset'){if(lt<p.from)v=p.from-lt;else if(lt<p.from+1.1)v=0;else{v=(p.resetTo||599)-(lt-p.from-1.1);tagS='다시 처음부터'}}else v=Math.max(0,p.from-lt);
  rr(960-330,330,660,260,30,'rgba(20,18,16,.85)','#d8433a',6,a);txt(v<=0?'00:00':mmss(v),960,460,170,v<=0?'#d8433a':CREAM,'BH','center',a);
  if(p.cap)txt(p.cap,960,680,46,DIM,'NGX','center',a);if(tagS==='다시 처음부터')chip('0이 되면 → 다시 처음부터',960,250,40,'rgba(216,67,58,.95)','#fff',a)};
// stock: 남은 수량 숫자 — mode 'schedule'(정해 둔 시각마다 하나씩), 'random'(열 때마다 새 숫자)
FX.stock=(p,t,K)=>{const a=io(t,K[p.kw]-.2,.4);if(p.dim!==false)dimBg(.66*a);const lt=t-K[p.kw];const X=p.x||960;let v,sub;
  if(p.mode==='schedule'){const i=Math.floor(lt/1.3);v=Math.max(1,p.from-i);sub='정해 둔 시각마다 하나씩'}else{const i=Math.floor(lt/.9);v=[7,3,9,2,6,4,8,5][i%8];sub='열 때마다 새 숫자'}
  rr(X-260,350,520,230,30,'rgba(20,18,16,.85)','#d8433a',6,a);txt(v+'개 남음',X,465,110,'#d8433a','BH','center',a);txt(sub,X,640,44,DIM,'NGX','center',a)};
// rate: 병마다 답 비교 — cols [[그림, 이름]], rows [[항목, kw, [표시...]]] 표시 '↑' '=' ''
FX.rate=(p,t,K)=>{const a0=io(t,K[p.kw]-.2,.5);dimBg(.74*a0);const nc=p.cols.length,cw=p.cw||360,X0=960+120-(nc-1)*cw/2;
  p.cols.forEach(([im,nm],j)=>{const X=X0+j*cw,I=IM[im];if(I){x.save();x.globalAlpha=a0;x.beginPath();x.roundRect(X-130,150,260,190,18);x.clip();x.drawImage(I,I.width*.28,I.height*.08,I.width*.44,I.width*.44*190/260,X-130,150,260,190);x.restore()}
    txt(nm,X,375,38,CREAM,'NGX','center',a0)});
  p.rows.forEach(([nm,k,ms],i)=>{const Y=490+i*120,a=io(t,K[k]-.1,.4);txt(nm,X0-cw/2-40,Y,48,CREAM,'BH','right',a);line(X0-cw/2-10,Y+55,X0+(nc-1)*cw+cw/2-40,Y+55,'#5d544b',2,a);
    ms.forEach((m,j)=>{if(!m)return;const am=io(t,K[(p.mk&&p.mk[i])!=null?p.mk[i]:k]+.3,.4);txt(m,X0+j*cw,Y,m==='='?80:86,m==='='?GOLD:RED,'BH','center',am*a0)})})};

const MG={};
MG.madi=(d,t)=>{black();para(d.text,960,530,1500,d.text.length>60?54:66,CREAM,'BH','center',io(t,.35,.9),1.45);return 'nosub'};
MG.art=(d,t,K,D)=>{const sh=d.shots;let cur=-1;sh.forEach((s,k)=>{if(s[1]<0||t>=K[s[1]]-0.15)cur=k});

  if(g.drains!=null){const al=fa(g.drains);x.save();x.globalAlpha=al;x.strokeStyle=GOLD;x.lineWidth=4;x.beginPath();x.moveTo(cx-200,yF);x.quadraticCurveTo(cx,yF-14,cx+200,yF);x.stroke();x.restore();
    for(const X of [cx-90,cx-45,cx+45,cx+90])dot(X,yF+2,7,'#111',al);chip('가운데가 솟은 바닥 · 배수구',cx,yF-60,28,'#000',GOLD,al)}
  // 크기 비교: 버스 넷 · 15층 · 공
  if(g.buses!=null){const al=fa(g.buses);const L=2*r/4;for(let i=0;i<4;i++){const X=cx-r+i*L,a2=io(t,kt(K,g.buses)+i*.25,.4)*al;rr(X+4,yF-3.2*s-6,L-8,3.2*s,10,'#2f6f8f','#9fc3e0',2,a2);dot(X+L*.22,yF-6,9,'#111',a2);dot(X+L*.78,yF-6,9,'#111',a2)}
    chip('지름 43m ≈ 버스 4대',cx,yF-3.2*s-50,30,'#000',CREAM,al)}
  if(g.apt!=null){const al=fa(g.apt),X=cx+r+dw+60,W=100,fl=(yF-(yS-r))/15;for(let i=0;i<15;i++){const a2=io(t,kt(K,g.apt)+i*.06,.25)*al;rr(X,yF-(i+1)*fl+2,W,fl-4,3,'#4b5560','#8c99a6',1.5,a2);
    for(let j=0;j<3;j++)rr(X+12+j*30,yF-(i+1)*fl+fl*.3,18,fl*.35,2,'#e8c46a',null,0,a2*.8)}
    line(cx,yS-r,X,yS-r,CREAM,2,al,[8,8]);chip('15층 ≈ 43m',X+W/2,yS-r-40,30,'#000',CREAM,al)}
  if(g.ball!=null){const p=io(t,kt(K,g.ball),1.4);x.save();x.globalAlpha=.85*(p>0?1:0);x.setLineDash([14,10]);x.strokeStyle=GOLD;x.lineWidth=5;x.beginPath();x.arc(cx,yS,r-4,-Math.PI/2,-Math.PI/2+Math.PI*2*p,false);x.stroke();x.restore()}
  // 사람 셋(밑단 두께 비교)
  if(g.people!=null){const al=fa(g.people),h=1.7*s*1.0;const X=cx-r-dw-40;for(let i=0;i<3;i++){const Y=yS-i*h,a2=io(t,kt(K,g.people)+i*.3,.3)*al;x.save();x.globalAlpha=a2;x.strokeStyle=GOLD;x.fillStyle=GOLD;x.lineWidth=3;
    x.beginPath();x.arc(X,Y-h+4,4,0,7);x.fill();x.beginPath();x.moveTo(X,Y-h+8);x.lineTo(X,Y-8);x.moveTo(X,Y-8);x.lineTo(X-5,Y);x.moveTo(X,Y-8);x.lineTo(X+5,Y);x.moveTo(X-6,Y-h+14);x.lineTo(X+6,Y-h+14);x.stroke();x.restore()}
    line(X-20,yS,X-20,yS-6.2*s,CREAM,2,al,[6,6]);chip('어른 셋 < 6m',X-110,yS+50,28,'#000',GOLD,al)}
  // 치수
  if(g.measure!=null){const al=fa(g.measure);for(const [a,lab] of [[1,'6m 넘게'],[83,'1.2m']]){const [X1,Y1]=P(a,r,-1),[X2,Y2]=P(a,r+thk(a,m),-1);
    line(X1,Y1,X2,Y2,GOLD,6,al);chip(lab,X2-90,Y2-36,30,'#000',GOLD,al)}}
  if(g.light!=null){const al=fa(g.light);arrow(cx+r+dw+130,yS+40,cx+r+dw+130,yS-r+30,GOLD,7,al,io(t,kt(K,g.light)+.2,.8));chip('점점 가볍게',cx+r+dw+130,yS-r-20,32,'#000',GOLD,al)}
  if(g.bandTags!=null){[['무거운 돌',0],['벽돌',1],['가벼운 화산석',2]].forEach(([s2,i])=>{const al=fa(g.bands[i]);const [X,Y]=P(i*30+15,r-70,1);chip(s2,X-60,Y+10,28,BANDC[i],INK,al)})}
  txt('재현 도식 · 실제 비율',1880,48,22,DIM,'NG','right',.75);
}
// 블록 탑(직접 떠올려 보기)
function blocksDraw(d,t,K,D){const g=d.blocks;black();const heavy=t>=kt(K,g.heavy)-.1,light=t>=kt(K,g.light)-.1,dm=t>=kt(K,g.dome)-.1;
  const X=720,base=880,bw=200,bh=90;
  for(let i=0;i<4;i++){const Y=base-(i+1)*bh;rr(X-bw/2,Y,bw,bh-6,8,['#97683f','#a8794a','#b88d55','#c9a36b'][i],'#00000055',2,1);
    const own=(4-i-1)*34+20;const extra=heavy&&!light?120*io(t,kt(K,g.heavy)+.3+i*.12,.6):0;const shrink=light?-0*1:0;
    rr(X+bw/2+30,Y+bh/2-16,own+extra+(light?10:0),26,6,heavy&&!light?RED:GRN,null,0,.9)}
  const topY=base-5*bh;
  if(heavy&&!light){rr(X-bw*.7,topY-30,bw*1.4,bh+24,10,'#4a413b','#000',2,io(t,kt(K,g.heavy),.4));txt('무거운 블록',X,topY+bh/2-18,34,CREAM,'NGX','center',io(t,kt(K,g.heavy),.4))}
  if(light){rr(X-bw*.4,topY+30,bw*.8,bh-36,10,'#ece4d0','#000',2,io(t,kt(K,g.light),.4));txt('가벼운 블록',X,topY+bh/2+12,30,INK,'NGX','center',io(t,kt(K,g.light),.4))}
  txt('아래 블록이 받는 짐',X+bw/2+30,base+40,28,DIM,'NGX','left',1);
  if(dm){const a=io(t,kt(K,g.dome),.6);const cx=1480,cy=720,r=170;x.save();x.globalAlpha=a;
    for(let i=0;i<3;i++){for(const sd of [-1,1]){x.beginPath();const a0=i*30*RAD,a1=(i+1)*30*RAD;
      for(let k=0;k<=10;k++){const q=a0+(a1-a0)*k/10;x.lineTo(cx+sd*(r+34-i*10)*Math.cos(q),cy-(r+34-i*10)*Math.sin(q))}
      for(let k=10;k>=0;k--){const q=a0+(a1-a0)*k/10;x.lineTo(cx+sd*r*Math.cos(q),cy-r*Math.sin(q))}x.closePath();x.fillStyle=BANDC[i];x.fill()}}
    x.restore();txt('돔도 똑같다',cx,cy+70,44,GOLD,'BH','center',a)}
}
MG.dome=(d,t,K,D)=>{
  const preEnd=d.pre?kt(K,d.pre[1])-.15:0;
  if(d.pre&&t<preEnd){art(d.pre[0],t,preEnd+.5,'in');vign();if(d.pre[2])label(d.pre[2],t,110,48);return}
  const postAt=d.post?kt(K,d.post[1])-.15:1e9;
  if(t>=postAt+.45){art(d.post[0],t-postAt,D-postAt,'in');vign();if(d.post[2])label(d.post[2],t-postAt,110,48);return}
  if(d.blocks)blocksDraw(d,t,K,D);else domeDraw(d,t,K,D);
  if(d.pre&&t<preEnd+.45){x.save();x.globalAlpha=1-io(t,preEnd,.45);art(d.pre[0],t,preEnd+.5,'in');x.restore()}
  let cur=null;(d.labels||[]).forEach(([s2,k])=>{if(t>=kt(K,k)-.15)cur=[s2,k]});if(cur)label(cur[0],t-kt(K,cur[1])+.15,110,cur[0].length>30?40:48);
  if(t>=postAt){art(d.post[0],t-postAt,D-postAt,'in',io(t,postAt,.45))}
};

function R(si,t,sub){const s=S[si];x.globalAlpha=1;CUR={d:s.data,t,K:s.K};const r=MG[s.data.mg](Object.assign({id:s.data.id},s.data),t,s.K,s.D);
  if(si>0&&S[si-1].data.ch!==s.data.ch&&t<.35){x.fillStyle=`rgba(13,12,11,${1-t/.35})`;x.fillRect(0,0,1920,1080)}
  if(r!=='nosub')SUB(sub)}
function INIT(scenes,artURI){S=scenes;const names=new Set(['room2_bl']);const masks=new Set();scenes.forEach(s=>{const d=s.data;(d.shots||[]).forEach(z=>z[0]!=='black'&&names.add(z[0]));if(d.first)names.add(d.first[0]);if(d.pre)names.add(d.pre[0]);if(d.post)names.add(d.post[0]);if(d.img)names.add(d.img);if(d.mg==='etask')['lab16_bl','lab16_tr'].forEach(n=>names.add(n));(d.seq||[]).forEach(n=>names.add(n));if(d.from)names.add(d.from);Object.keys(d.scr||{}).forEach(n=>masks.add(n));(d.fx||[]).forEach(f=>Array.isArray(f.cols)&&f.cols.forEach(c=>names.add(c[0])))});
  let left=names.size+masks.size+1;window.READY=false;const done=()=>{if(--left<=0)window.READY=true};Promise.all(['40px NG','40px NGX','40px BH','40px PEN'].map(f=>document.fonts.load(f,'가나다 abc 123'))).then(done,done);
  names.forEach(n=>{const im=new Image();im.onload=done;im.onerror=done;im.src=artURI+'/'+n+'.jpg';IM[n]=im});masks.forEach(n=>{const im=new Image();im.onload=done;im.onerror=done;im.src=artURI+'/mask_'+n+'.png';IM['mask_'+n]=im})}
window.R=R;window.INIT=INIT;
</script></body></html>
