<!doctype html>
<html><head><meta charset="utf-8">
<!-- 넘기기 편 그래픽 층: 실사 위에 얹는 모션그래픽 (휴대폰 테두리·시계·셈·실험 계획판·결과·확인 목록)
     실사가 상황을, 그래픽은 숫자·관계만. 화면 글자는 숫자·이름표 위주, 대사를 다시 쓰지 않음 (manual/04 §0-8, 12 §0-1) -->
<style>
@font-face{font-family:G;src:url("FONTDIR/NanumGothic-Bold.ttf")}
@font-face{font-family:GX;src:url("FONTDIR/NanumGothic-ExtraBold.ttf")}
@font-face{font-family:GR;src:url("FONTDIR/NanumGothic-Regular.ttf")}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
#root{position:absolute;inset:0;font-family:G;color:#fff}
.abs{position:absolute}
.sub{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-family:G;font-size:46px;line-height:1.35;
  text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.55)}
.tag{position:absolute;left:56px;top:48px;font-family:G;font-size:24px;padding:7px 14px;border-radius:4px;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);letter-spacing:.5px}
.src{position:absolute;right:56px;bottom:22px;font-family:GR;font-size:22px;opacity:.75;text-shadow:0 1px 4px #000}
.glass{background:rgba(12,14,18,.62);border:1px solid rgba(255,255,255,.14);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(2px)}
.y{color:#FFD23F}
</style></head><body><div id="root"></div>
<script>
const Y="#FFD23F";
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const P=(t,t0,d)=>cl((t-t0)/d);
const TH=i=>`THUMBDIR/t${i}.jpg`;
const root=document.getElementById('root');

function feed(sc,t,B){
  const f=sc.feed, o=eo(P(t,0,0.5));
  let n=0; (B[0].kw||[]).forEach(k=>{if(t>=k+0.2)n++});
  const sw=B[0].kw.map(k=>P(t,k+0.05,0.35)).find(p=>p>0&&p<1);
  return `<div class="abs" style="left:${f.x-16}px;top:${f.y-16}px;width:${f.w+32}px;height:${f.h+32}px;border-radius:54px;border:16px solid #0d0f12;opacity:${o};
      box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.08)"></div>
    <div class="abs" style="left:${f.x+f.w/2-70}px;top:${f.y+10}px;width:140px;height:30px;border-radius:15px;background:#0d0f12;opacity:${o}"></div>
    <div class="abs" style="left:${f.x+f.w+60}px;top:${f.y+f.h/2-80}px;opacity:${o}">
      <div style="font-size:30px;opacity:.85">넘긴 영상</div>
      <div style="font-family:GX;font-size:110px;line-height:1.1">${n}</div></div>
    ${sw!==undefined?`<div class="abs" style="left:${f.x+f.w/2-36}px;top:${f.y+f.h-140-(sw*260)}px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,${.55*(1-sw)});box-shadow:0 0 0 10px rgba(255,255,255,${.15*(1-sw)})"></div>`:""}`;
}
function elapsed(sc,t,B){
  const k0=B[0].kw[0], k1=B[0].kw[1], o=eo(P(t,B[0].t,0.5));
  const p=eio(P(t,k0-0.3,Math.max(0.5,k1-k0-0.2)));
  const min=Math.round(40*p), hh=1, mm=String(min).padStart(2,'0');
  const cnt=Math.round(12+300*p);
  const stop=t>k1-0.1;
  return `<div class="abs" style="right:80px;top:70px;text-align:right;opacity:${o};text-shadow:0 2px 14px rgba(0,0,0,.7)">
     <div style="font-family:GX;font-size:96px;letter-spacing:2px">${hh}:${mm}<span style="font-size:36px;opacity:${p>0&&!stop?.85:0};margin-left:10px">▶▶</span></div>
     <div style="font-size:30px;margin-top:6px;opacity:.9">넘긴 영상 <span style="font-family:GX;font-size:44px">${cnt}</span></div></div>`;
}
function kinetic(sc,t,B){return sc.words.map(([w,o],i)=>{const p=P(t,B[0].t+o,0.45);
  return `<div class="abs" style="left:0;right:0;top:${380+i*130}px;text-align:center;font-family:GX;font-size:${i?100:70}px;
    color:${i?Y:'#fff'};opacity:${cl(p*3)};transform:translateY(${(1-eo(p))*28}px);text-shadow:0 6px 30px rgba(0,0,0,.75)">${w}</div>`}).join("")}

// 같은 10분, 두 가지 보는 법
const PX=1180, X0=370;
function planBase(t,B,a1,a2){
  let h=`<div class="abs glass" style="left:${X0-60}px;top:150px;width:${PX+150}px;height:600px;opacity:${eo(P(t,0,0.5))}"></div>`;
  // 10분 눈금
  const ru=eo(P(t,0.2,0.8));
  h+=`<div class="abs" style="left:${X0}px;top:205px;width:${PX*ru}px;height:2px;background:rgba(255,255,255,.5)"></div>`;
  [0,5,10].forEach(m=>{h+=`<div class="abs" style="left:${X0+PX*m/10-40}px;top:170px;width:80px;text-align:center;font-size:24px;opacity:${ru*.8}">${m}분</div>`});
  // 줄 A: 한 편
  const A=eo(P(t,a1-0.2,0.7));
  h+=`<div class="abs" style="left:${X0}px;top:250px;font-size:30px;opacity:${A}">10분 영상 <span class="y" style="font-family:GX">1편</span> · 넘기기 <span style="font-family:GX">✕</span></div>
    <div class="abs" style="left:${X0}px;top:300px;width:${PX*A}px;height:150px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.7);opacity:${cl(A*4)}">
      <div style="width:${PX}px;height:150px;background:url(${TH(5)}) center/cover"></div></div>`;
  return h;
}
function rowB(t,t0,cuts){
  const B2=eo(P(t,t0-0.2,0.7)); let h="";
  h+=`<div class="abs" style="left:${X0}px;top:490px;font-size:30px;opacity:${B2}">5분 영상 <span class="y" style="font-family:GX">7편</span> · 넘기기 <span style="font-family:GX">○</span></div>`;
  const tw=PX/7;
  for(let i=0;i<7;i++){const p=eo(P(t,t0+i*0.09,0.4));
    h+=`<div class="abs" style="left:${X0+i*tw+3}px;top:${540+(1-p)*30}px;width:${tw-6}px;height:150px;border-radius:8px;opacity:${p};
      background:url(${TH(i)}) center/cover;border:2px solid rgba(255,255,255,.6)"></div>`}
  for(let c=0;c<cuts;c++){const x=X0+((c*0.618034)%1)*PX;
    h+=`<div class="abs" style="left:${x}px;top:532px;width:4px;height:166px;background:${Y};box-shadow:0 0 8px ${Y}"></div>`}
  return h;
}
function plan(sc,t,B){return planBase(t,B,B[0].kw[0])+(t>B[0].kw[1]-0.4?rowB(t,B[0].kw[1],0):"")}
function plan2(sc,t,B){
  const k0=B[0].kw[0], cuts=Math.round(35*eio(P(t,B[0].t+0.3,Math.max(0.6,k0-B[0].t))));
  let h=planBase(t,B,-5)+rowB(t,-5,cuts);
  h+=`<div class="abs" style="left:${X0+PX-260}px;top:470px;width:260px;text-align:right;font-size:30px">넘긴 횟수 <span style="font-family:GX;font-size:48px" class="y">1~${Math.max(1,cuts)}</span></div>`;
  if(B[1]){const q=eb(P(t,B[1].kw[0]-0.1,0.5));
    h+=`<div class="abs" style="left:${X0+PX+20}px;top:420px;font-family:GX;font-size:${60*cl(q)}px;opacity:${cl(q)};color:#fff">?</div>`}
  return h;
}
// 결과: 7점 척도 위 두 막대
function result(sc,t,B){
  const k=B[0].kw, X1=560, L=1000, sc7=v=>X1+L*(v-1)/6;
  let h=`<div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 42%,#1d242d,#0b0e12)"></div>`;
  const a=eo(P(t,B[0].t,0.6));
  h+=`<div class="abs" style="left:0;right:0;top:130px;text-align:center;font-size:36px;opacity:${a}">10분 뒤, 얼마나 지루했나 <span style="opacity:.6;font-size:28px">(1~7점)</span></div>`;
  h+=`<div class="abs" style="left:${X1}px;top:470px;width:${L*a}px;height:2px;background:rgba(255,255,255,.4)"></div>`;
  [1,2,3,4,5,6,7].forEach(v=>h+=`<div class="abs" style="left:${sc7(v)-20}px;top:480px;width:40px;text-align:center;font-size:24px;opacity:${a*.7}">${v}</div>`);
  const bar=(y,lab,v,col,t0)=>{const p=eio(P(t,t0,1.0));return `<div class="abs" style="left:${X1-330}px;top:${y+10}px;width:300px;text-align:right;font-size:32px;opacity:${cl(p*3)}">${lab}</div>
    <div class="abs" style="left:${X1}px;top:${y}px;width:${(sc7(v)-X1)*p}px;height:64px;background:${col};border-radius:4px"></div>
    <div class="abs" style="left:${X1+(sc7(v)-X1)*p+18}px;top:${y+4}px;font-family:GX;font-size:52px;color:${col};opacity:${cl(p*2)}">${(1+(v-1)*p).toFixed(2)}</div>`};
  h+=bar(250,"한 편 · 못 넘김",3.26,"#e9edf2",B[0].t+0.2);
  h+=bar(350,"일곱 편 · 넘김",3.72,Y,k[0]-0.3);
  ["만족","몰입","의미"].forEach((w,i)=>{const p=eb(P(t,k[1+i]-0.15,0.4));
    h+=`<div class="abs" style="left:${X1+i*250}px;top:${590+(1-cl(p))*20}px;opacity:${cl(p)};font-size:38px;padding:10px 26px;border-radius:40px;border:2px solid ${Y}">${w} <span class="y" style="font-family:GX">↓</span></div>`});
  const r=eb(P(t,k[4]-0.6,0.5));
  h+=`<div class="abs" style="left:0;right:0;top:730px;text-align:center;opacity:${cl(r)};transform:scale(${0.8+0.2*cl(r)})">
     <span style="font-family:GX;font-size:44px;padding:10px 30px;border:4px solid #fff;border-radius:8px;transform:rotate(-3deg);display:inline-block">예상과 정반대</span></div>`;
  return h;
}
function checks(sc,t,B){
  return `<div class="abs" style="left:0;top:0;bottom:0;width:1050px;background:linear-gradient(90deg,rgba(6,8,12,.78),rgba(6,8,12,0))"></div>`+
  sc.checks.map((c,i)=>{const p=eb(P(t,B[0].kw[i]-0.15,0.45));
    return `<div class="abs" style="left:90px;top:${250+i*130}px;opacity:${cl(p)};transform:translateX(${(1-cl(p))*-40}px);display:flex;align-items:center">
      <div style="width:64px;height:64px;border-radius:50%;background:${Y};color:#111;font-family:GX;font-size:40px;line-height:64px;text-align:center;margin-right:26px">✓</div>
      <div style="font-size:40px;text-shadow:0 2px 10px #000">${c}</div></div>`}).join("")+
  `<div class="abs" style="left:90px;top:640px;font-size:30px;opacity:${cl(P(t,B[0].kw[1],0.4))*.85}">→ 결과는 같았다: 넘긴 쪽이 더 지루</div>`;
}
const MG={none:()=>"",night:()=>"",feed,elapsed,kinetic,plan,plan2,result,checks};
window.R=function(sc,t,B,D,sub){
  let h="";
  if(sc.stamp){const p=P(t,0.15,0.5),f=1-P(t,D-0.8,0.6);
    h+=`<div class="abs" style="left:64px;top:60px;opacity:${p*f};font-family:GX;font-size:52px;letter-spacing:2px;text-shadow:0 2px 12px #000">${sc.stamp}</div>`}
  h+=(MG[sc.mg||"none"]||MG.none)(sc,t,B,D);
  if(sc.role==="자료 화면") h+=`<div class="tag">자료 화면 · 실험 장면 아님</div>`;
  if(sc.src) h+=`<div class="src">출처: ${sc.src}</div>`;
  if(sub) h+=`<div class="sub">${sub}</div>`;
  root.innerHTML=h;
};
</script></body></html>
