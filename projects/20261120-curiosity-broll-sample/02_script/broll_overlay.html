<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:G;src:url("FONTDIR/NanumGothic-Bold.ttf")}
@font-face{font-family:GX;src:url("FONTDIR/NanumGothic-ExtraBold.ttf")}
@font-face{font-family:GR;src:url("FONTDIR/NanumGothic-Regular.ttf")}
@font-face{font-family:P;src:url("FONTDIR/NanumPenScript-Regular.ttf")}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
#root{position:absolute;inset:0;font-family:G;color:#fff}
.abs{position:absolute}
.sub{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-family:G;font-size:48px;line-height:1.35;
  text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.55)}
.tag{position:absolute;left:56px;top:48px;font-family:G;font-size:24px;padding:7px 14px;border-radius:4px;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);letter-spacing:.5px}
.src{position:absolute;right:56px;bottom:24px;font-family:GR;font-size:22px;opacity:.75;text-shadow:0 1px 4px #000}
.y{color:#FFD23F}
</style></head><body><div id="root"></div>
<script>
const Y="#FFD23F";
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);                 // ease out
const eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // back out
const P=(t,t0,d)=>cl((t-t0)/d);
const root=document.getElementById('root');
function H(s){root.innerHTML=s}
function fmt(n){return n.toLocaleString('en-US')}

// ------------------------------------------------ 장면별 모션그래픽
const MG={
 none:()=>"",
 focus:(sc,t,B)=>{ // 인물 위 모서리 괄호 + 라벨 + 초 세기
   const f=sc.focus,p=eo(P(t,B[0].t+0.3,0.6)),L=60*p,c="rgba(255,255,255,.95)";
   const x=f.x,y=f.y,w=f.w,h=f.h,s=`position:absolute;border-color:${c};border-style:solid;width:${L}px;height:${L}px;`;
   const sec=Math.max(0,t-B[0].t-0.3);
   const lab=P(t,B[0].t+0.8,0.4);
   return `<div style="${s}left:${x}px;top:${y}px;border-width:4px 0 0 4px"></div>
   <div style="${s}left:${x+w-L}px;top:${y}px;border-width:4px 4px 0 0"></div>
   <div style="${s}left:${x}px;top:${y+h-L}px;border-width:0 0 4px 4px"></div>
   <div style="${s}left:${x+w-L}px;top:${y+h-L}px;border-width:0 4px 4px 0"></div>
   <div class="abs" style="left:${x+w+22}px;top:${y+10}px;opacity:${lab};transform:translateX(${(1-eo(lab))*-20}px);font-size:30px">
     <div style="background:${Y};color:#111;padding:6px 14px;border-radius:4px;display:inline-block">${f.label}</div>
     <div style="font-family:GX;font-size:64px;margin-top:10px;text-shadow:0 2px 8px #000">0:${String(Math.floor(sec)).padStart(2,'0')}<span style="font-size:30px;opacity:.8">.${Math.floor((sec%1)*10)}</span></div>
   </div>`;
 },
 kinetic:(sc,t,B)=>sc.words.map(([w,o],i)=>{const p=P(t,B[0].t+o,0.35);
   return `<div class="abs" style="left:0;right:0;top:${330+i*190}px;text-align:center;font-family:GX;font-size:${i?170:120}px;
     color:${i?Y:'#fff'};opacity:${cl(p*3)};transform:scale(${0.6+0.4*eb(p)});text-shadow:0 6px 30px rgba(0,0,0,.6)">${w}</div>`}).join(""),
 bars:(sc,t,B)=>{const b=sc.bars,a=eo(P(t,B[0].t-0.1,0.5));
   const rows=b.rows.map(([k,v],i)=>{const t0=i?B[1].t+0.9:B[0].t+0.9,p=eo(P(t,t0,1.0));
     return `<div style="margin-top:38px;opacity:${cl(P(t,t0-0.2,0.3))}"><div style="font-size:34px;margin-bottom:12px">${k}</div>
     <div style="display:flex;align-items:center"><div style="height:46px;width:${6.2*v*p}px;background:${i?'#fff':Y};border-radius:3px"></div>
     <div style="font-family:GX;font-size:56px;margin-left:20px">${Math.round(v*p)}%</div></div></div>`}).join("");
   return `<div class="abs" style="right:0;top:0;bottom:0;width:${760*a}px;background:linear-gradient(90deg,rgba(8,10,14,.0),rgba(8,10,14,.82) 18%)"></div>
   <div class="abs" style="left:1210px;top:300px;opacity:${a}"><div style="font-family:GX;font-size:44px">${b.title}</div>
   <div style="width:${300*a}px;height:3px;background:${Y};margin-top:14px"></div>${rows}</div>`},
 buy:(sc,t,B)=>{
   const h=P(t,B[0].t,0.5), k3=B[1].kw[0], k30=B[1].kw[1];
   const col=(x,lab,n,t0,acc)=>{const p=P(t,t0,0.4),q=eo(P(t,t0+0.2,0.9));let d="";
     for(let i=0;i<100;i++){const on=i<Math.round(n*q);d+=`<div style="width:30px;height:30px;border-radius:50%;margin:5px;background:${on?acc:'rgba(255,255,255,.13)'}"></div>`}
     return `<div class="abs" style="left:${x}px;top:330px;opacity:${p};transform:translateY(${(1-eo(p))*30}px)">
       <div style="font-size:38px;margin-bottom:6px">${lab}</div><div style="font-family:GR;font-size:24px;opacity:.7;margin-bottom:18px">멈춘 손님 100명 중 산 사람</div>
       <div style="display:flex;flex-wrap:wrap;width:400px">${d}</div>
       <div style="font-family:GX;font-size:110px;color:${acc};position:absolute;left:440px;top:170px">${Math.round(n*q)}%</div></div>`};
   return `<div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 40%,#1c232c,#0b0e12)"></div>
   <div class="abs" style="left:0;right:0;top:${t<B[1].t?400:150}px;text-align:center;font-family:GX;font-size:${t<B[1].t?84:54}px;opacity:${h};transition:none">
     실제로 <span class="y">산</span> 사람은?</div>
   ${t>B[1].t-0.2?col(230,"24가지",3,k3-0.3,"#fff")+col(1050,"6가지",30,k30-0.3,Y):""}`},
 term:(sc,t,B)=>{const t0=B[1].kw[0]-0.15,n=sc.term[0].length;
   let s="";for(let i=0;i<n;i++){const p=P(t,t0+i*0.07,0.3);s+=`<span style="display:inline-block;opacity:${p};transform:translateY(${(1-eb(p))*40}px)">${sc.term[0][i]===' '?'&nbsp;':sc.term[0][i]}</span>`}
   const u=eo(P(t,t0+0.4,0.6)),e=P(t,t0+0.7,0.4);
   return `<div class="abs" style="left:0;top:0;bottom:0;width:1000px;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,0))"></div>
   <div class="abs" style="left:110px;top:380px"><div style="font-family:GX;font-size:130px;text-shadow:0 4px 20px rgba(0,0,0,.5)">${s}</div>
   <div style="height:8px;width:${640*u}px;background:${Y};margin-top:6px"></div>
   <div style="font-family:GR;font-size:40px;margin-top:22px;opacity:${e*.9};letter-spacing:2px">${sc.term[1]}</div></div>`},
 tiles:(sc,t,B)=>{const T=t-B[0].t,close=B[0].kw[0];let d="";
   const off=(Math.max(T,0)*260)%220,fade=1-P(t,close+0.3,0.5);
   for(let r=-1;r<7;r++)for(let c=0;c<3;c++){const y=r*220-off+60;
     d+=`<div class="abs" style="left:${40+c*250}px;top:${y}px;width:212px;height:196px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 6px 18px rgba(0,0,0,.35)">
       <div style="margin:14px;height:96px;border-radius:8px;background:hsl(${(r*3+c)*47%360},45%,78%)"></div>
       <div style="margin:0 14px;height:12px;width:150px;background:#c9cdd3;border-radius:6px"></div>
       <div style="margin:10px 14px;height:16px;width:80px;background:#2b2f36;border-radius:6px"></div></div>`}
   const cnt=Math.round(Math.min(T,close-B[0].t)*170+24);
   const x=P(t,close,0.35);
   return `<div class="abs" style="left:1100px;top:0;width:820px;height:1080px;overflow:hidden;opacity:${fade*cl(P(t,B[0].t-0.2,0.4))};
     -webkit-mask-image:linear-gradient(180deg,transparent,#000 15%,#000 80%,transparent)">${d}</div>
   <div class="abs" style="left:1130px;top:60px;font-family:GX;font-size:46px;opacity:${cl(P(t,B[0].t,0.3))};text-shadow:0 2px 10px #000">상품 <span class="y">${fmt(Math.max(cnt,24))}</span>개</div>
   <div class="abs" style="left:1360px;top:400px;width:200px;height:200px;border-radius:50%;background:rgba(0,0,0,.6);border:5px solid #fff;
     opacity:${x};transform:scale(${0.5+0.5*eb(x)});font-family:GX;font-size:140px;line-height:190px;text-align:center">✕</div>`},
 meta:(sc,t,B)=>{const m=sc.meta,h=P(t,B[0].t,0.4),moveUp=eo(P(t,B[1].t-0.1,0.5));
   const st=m.stats.map(([n,u],i)=>{const p=P(t,B[1].kw[0]+i*0.25,0.4);return `<div style="opacity:${p};transform:translateY(${(1-eo(p))*24}px);margin:0 50px;text-align:center">
     <div style="font-family:GX;font-size:96px">${n}</div><div style="font-size:32px;opacity:.85">${u}</div></div>`}).join("");
   const ax=eo(P(t,B[1].kw[1]-0.6,0.6)),mk=eb(P(t,B[1].kw[1]-0.1,0.5)),X0=360,X1=1560,mid=(X0+X1)/2;
   const mx=mid+m.d*1500; // 0.02 → 30px 오른쪽 (축: -0.4 ~ +0.4 개념 눈금)
   return `<div class="abs" style="left:0;right:0;top:${300-170*moveUp}px;text-align:center;font-family:GX;font-size:${76-24*moveUp}px;opacity:${h}">
       늘 되풀이되지는 <span class="y">않았다</span></div>
     <div class="abs" style="left:0;right:0;top:250px;display:flex;justify-content:center">${st}</div>
     <div class="abs" style="left:${X0}px;top:620px;width:${(X1-X0)*ax}px;height:4px;background:#fff"></div>
     <div class="abs" style="left:${mid-2}px;top:596px;width:4px;height:52px;background:#fff;opacity:${ax}"></div>
     <div class="abs" style="left:${mid-60}px;top:660px;width:120px;text-align:center;font-size:30px;opacity:${ax}">0</div>
     <div class="abs" style="left:${X0}px;top:660px;font-family:GR;font-size:26px;opacity:${ax*.8}">← 많으면 더 산다</div>
     <div class="abs" style="left:${X1-260}px;top:660px;width:260px;text-align:right;font-family:GR;font-size:26px;opacity:${ax*.8}">많으면 덜 산다 →</div>
     <div class="abs" style="left:${mx-17}px;top:${540-60*(1-mk)}px;opacity:${cl(mk*2)};width:34px;height:34px;border-radius:50%;background:${Y};box-shadow:0 0 0 8px rgba(255,210,63,.25)"></div>
     <div class="abs" style="left:${mx-200}px;top:470px;width:400px;text-align:center;font-family:GX;font-size:38px;opacity:${cl(mk)}">평균 효과 <span class="y">0.02</span></div>`},
 tags:(sc,t,B)=>{const head=P(t,B[0].t,0.4);
   return `<div class="abs" style="left:90px;top:120px;font-size:30px;opacity:${head};letter-spacing:1px">후속 연구가 찾은 <span class="y">조건</span></div>`+
   sc.tags.map((g,i)=>{const p=P(t,B[0].kw[i]-0.1,0.4);return `<div class="abs" style="left:90px;top:${185+i*92}px;opacity:${cl(p*2)};transform:translateX(${(1-eb(p))*-40}px);
     font-size:40px;background:rgba(10,12,16,.72);border-left:8px solid ${Y};padding:12px 24px 12px 20px">${g}</div>`}).join("")},
 end:(sc,t,B,D)=>{const t0=B[0].t+B[0].d+0.3,p=P(t,t0,0.8),f=P(t,D-1.6,1.4);
   return `<div class="abs" style="inset:0;background:rgba(0,0,0,${0.45*p+0.55*f})"></div>
   <div class="abs" style="left:0;right:0;top:470px;text-align:center;font-family:GX;font-size:80px;opacity:${p*(1-f)};letter-spacing:1px">
     ${sc.end.replace('기준','<span class="y">기준</span>')}</div>`},
 illust:(sc,t,B)=>""   // 삽화는 아래 SVG
};

// ------------------------------------------------ 대체 삽화 (자료 화면이 없을 때만)
function illust(sc,t,B){
  const dr=(t0,d)=>eo(P(t,t0,d));           // 선 그리기 진행
  const s=(len,p)=>`stroke-dasharray:${len};stroke-dashoffset:${len*(1-p)}`;
  const t0=B[0].t, tb=B[1].t;
  const many=t<tb+1.6;                      // 24 → 6 바뀌는 순간
  const sw=P(t,tb+1.4,0.5);
  let jars="";
  const N=many?24:6, cols=many?12:6, gap=many?62:118, x0=many?590:610, w=many?42:70;
  for(let i=0;i<N;i++){const r=Math.floor(i/cols),c=i%cols,x=x0+c*gap,y=520-r*(w*1.25)+ (many?0:-10);
    const p=many?dr(t0+1.2+i*0.04,0.3):eb(P(t,tb+1.6+i*0.08,0.35));
    const hue=[350,20,45,300,0,30][i%6];
    jars+=`<g opacity="${cl(p*1.5)}" transform="translate(${x},${y+(1-p)*-30})">
      <rect x="0" y="${-w*1.1}" width="${w}" height="${w*1.1}" rx="${w*.18}" fill="hsl(${hue},55%,${55+(i%3)*6}%)" stroke="#222" stroke-width="3"/>
      <rect x="${-3}" y="${-w*1.1-w*.28}" width="${w+6}" height="${w*.3}" rx="4" fill="#f4efe6" stroke="#222" stroke-width="3"/>
      <rect x="${w*.18}" y="${-w*.75}" width="${w*.64}" height="${w*.34}" fill="#fffaf0" stroke="#222" stroke-width="2"/></g>`}
  const clock=P(t,tb+0.2,0.4);
  return `<div class="abs" style="inset:0;background:#efe8da"></div>
  <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.35),rgba(0,0,0,.18))"></div>
  <svg class="abs" width="1920" height="1080" style="left:0;top:0" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 540 L1400 540 L1400 760 L520 760 Z" style="${s(2200,dr(t0+0.1,0.9))}" fill="rgba(255,255,255,${0.5*dr(t0+0.5,0.6)})"/>
    <path d="M560 760 L560 870 M1360 760 L1360 870" style="${s(240,dr(t0+0.6,0.4))}"/>
    <path d="M600 200 L1320 200 L1300 290 L620 290 Z" style="${s(1700,dr(t0+0.4,0.7))}" fill="rgba(200,60,60,${0.85*dr(t0+0.8,0.5)})"/>
    <path d="M640 290 L640 540 M1280 290 L1280 540" style="${s(560,dr(t0+0.7,0.5))}"/>
    <path d="M300 900 Q 960 880 1640 905" stroke-width="3" style="${s(1400,dr(t0+0.2,0.8))}"/>
    ${jars}
    <text x="960" y="262" text-anchor="middle" font-family="P" font-size="62" fill="#fff" stroke="none" opacity="${dr(t0+0.9,0.4)}">잼 시식 · TASTING</text>
    <text x="960" y="700" text-anchor="middle" font-family="P" font-size="58" fill="#222" stroke="none" opacity="${t<tb?0:1}">${many?'24가지':'6가지'}</text>
  </svg>
  <div class="abs" style="left:1460px;top:600px;opacity:${clock};transform:scale(${0.6+0.4*eb(clock)})">
    <svg width="150" height="150" viewBox="0 0 150 150" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round">
      <circle cx="75" cy="75" r="60" fill="#fff"/><path d="M75 75 L75 35" transform="rotate(${(t-tb)*120} 75 75)"/><path d="M75 75 L105 75"/></svg>
    <div style="font-family:P;font-size:46px;color:#222;text-align:center;margin-top:-6px">몇 시간마다</div></div>
  <div class="abs" style="left:90px;top:120px;font-family:P;font-size:54px;color:#222;opacity:${dr(t0+0.3,0.5)}">2000년 · 아이엔가 &amp; 레퍼</div>`;
}

// ------------------------------------------------ 한 프레임
window.R=function(sc,t,B,D,sub){
  let h="";
  if(sc.kind==="illust") h+=illust(sc,t,B);
  h+=(MG[sc.mg||"none"]||MG.none)(sc,t,B,D);
  if(sc.role==="자료 화면") h+=`<div class="tag">자료 화면 · 실험 장소 아님</div>`;
  if(sc.role==="재구성 삽화") h+=`<div class="tag" style="color:#222;background:rgba(255,255,255,.6);border-color:#555">재구성 삽화 · 실험 당시 영상 없음</div>`;
  const src=sc.src||(sc.bars&&sc.bars.src)||(sc.meta&&sc.meta.src);
  if(src) h+=`<div class="src">출처: ${src}</div>`;
  if(sub) h+=`<div class="sub" style="${sc.kind==='illust'?'color:#fff':''}">${sub}</div>`;
  H(h);
};
</script></body></html>
