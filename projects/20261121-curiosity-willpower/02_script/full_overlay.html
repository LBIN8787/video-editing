<!doctype html>
<html><head><meta charset="utf-8">
<!-- 의지력 편 전체 화면. INIT(장면들, 원화 폴더 URI) 뒤 R(장면 번호, 장면 안 초, 자막) 이 한 프레임을 그린다(결정적).
     장면 data.mg 마다 함수 하나. K = kw 를 말하는 시각(장면 안 초), D = 장면 길이. 6장은 D3 샘플(ch6_overlay.html) 그대로. -->
<style>
@font-face{font-family:NG;src:url(../../../ytflow/assets/fonts/NanumGothic-Bold.ttf)}
@font-face{font-family:NGX;src:url(../../../ytflow/assets/fonts/NanumGothic-ExtraBold.ttf)}
@font-face{font-family:BH;src:url(../../../ytflow/assets/fonts/BlackHanSans-Regular.ttf)}
@font-face{font-family:PEN;src:url(../../../ytflow/assets/fonts/NanumPenScript-Regular.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1d1b19}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const PAPER='#efe7da',INK='#2b2622',DIM='#8d8274',RED='#c8473a',GRN='#3f8f6b',BLUE='#3d6fa8',GOLD='#d9a441',LINE='#d8cdbd';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), ease=v=>{v=cl(v);return v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2};
const io=(t,a,d=.5)=>ease((t-a)/d);
const pop=(t,a)=>{const v=cl((t-a)/.35);return v<=0?0:1+0.18*Math.sin(v*Math.PI)*(1-v)};
let S=[],IM={},CUR=null;
function txt(s,X,Y,size,col,font='NG',align='center',alpha=1){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.fillStyle=col;x.font=`${size}px ${font}`;x.textAlign=align;x.textBaseline='middle';x.fillText(s,X,Y);x.restore()}
function wrap(s,maxW,size,font){x.save();x.font=`${size}px ${font}`;const out=[];let cur='';for(const w of s.split(' ')){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}if(cur)out.push(cur);x.restore();return out}
function para(s,X,Y,maxW,size,col,font='NG',align='center',alpha=1,lh=1.35){const L=wrap(s,maxW,size,font);L.forEach((l,i)=>txt(l,X,Y+(i-(L.length-1)/2)*size*lh,size,col,font,align,alpha));return L.length}
function rr(X,Y,w,h,r,fill,stroke,lw=3,alpha=1){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.beginPath();x.roundRect(X,Y,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}x.restore()}
function line(a,b,c2,d,col=INK,lw=4,alpha=1,dash){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.strokeStyle=col;x.lineWidth=lw;if(dash)x.setLineDash(dash);x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke();x.restore()}
function arrow(a,b,c2,d,col=INK,lw=5,alpha=1,prog=1){if(alpha<=0||prog<=0)return;const ex=a+(c2-a)*prog,ey=b+(d-b)*prog;line(a,b,ex,ey,col,lw,alpha);const an=Math.atan2(d-b,c2-a);x.save();x.globalAlpha=alpha;x.fillStyle=col;x.beginPath();x.moveTo(ex,ey);x.lineTo(ex-22*Math.cos(an-0.45),ey-22*Math.sin(an-0.45));x.lineTo(ex-22*Math.cos(an+0.45),ey-22*Math.sin(an+0.45));x.closePath();x.fill();x.restore()}
function dot(X,Y,r,col,alpha=1){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.fillStyle=col;x.beginPath();x.arc(X,Y,r,0,Math.PI*2);x.fill();x.restore()}
function bg(){x.fillStyle=PAPER;x.fillRect(0,0,1920,1080);
  x.save();x.globalAlpha=.05;let s=7;for(let i=0;i<900;i++){s=(s*9301+49297)%233280;const a=s/233280;s=(s*9301+49297)%233280;const b=s/233280;x.fillStyle=INK;x.fillRect(a*1920,b*1080,2,2)}x.restore()}
function src(s){if(s)txt(s,1880,56,22,DIM,'NG','right')}
function chap(d){txt(d.ch+' · '+d.chapter,40,56,24,DIM,'NG','left')}
function tag(s,dark=true){const Y=dark?30:84;x.save();x.font='26px NGX';const w=x.measureText(s).width;rr(36,Y,w+40,50,25,dark?'rgba(20,18,16,.62)':'rgba(255,255,255,.75)');x.restore();txt(s,56,Y+25,26,dark?'#f3ece0':INK,'NGX','left')}
function chip(s,X,Y,size,fill,col,alpha=1,align='center'){if(alpha<=0)return;x.save();x.font=`${size}px NGX`;const w=x.measureText(s).width;x.restore();const bx=align==='center'?X-w/2-26:(align==='left'?X:X-w-52);rr(bx,Y-size*0.9,w+52,size*1.8,size*0.9,fill,null,0,alpha);txt(s,bx+26+w/2,Y,size,col,'NGX','center',alpha)}
function stampT(s,lt){const n=Math.floor(cl((lt-.3)/1.2)*s.length);x.save();x.font='54px BH';const w=x.measureText(s).width;x.restore();rr(36,96,w+60,84,10,'rgba(20,18,16,.6)',null,0,n>0?1:0);txt(s.slice(0,n),66,140,54,'#f3ece0','BH','left')}
// 원화: 카메라가 천천히 움직임
function art(name,lt,D,mv='in',alpha=1){const im=IM[name];if(!im||alpha<=0)return;const p=cl(lt/Math.max(D,1));let s=1.04,dx=0,dy=0;
  if(mv==='in'){s=1.0+0.07*p}else if(mv==='out'){s=1.07-0.07*p}else if(mv==='left'){s=1.07;dx=40-80*p}else if(mv==='right'){s=1.07;dx=-40+80*p}else if(mv==='up'){s=1.07;dy=30-60*p}
  const w=1920*s,h=1080*s;x.save();x.globalAlpha=alpha;x.drawImage(im,960-w/2+dx,540-h/2+dy,w,h);x.restore()}
function shade(){const g=x.createLinearGradient(0,800,0,1080);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=g;x.fillRect(0,800,1920,280)}
function SUB(s){if(!s)return;x.save();x.font='42px NGX';const w=x.measureText(s).width;x.fillStyle='rgba(20,18,16,.84)';x.beginPath();x.roundRect(960-w/2-30,966,w+60,74,10);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(s,960,1004);x.restore()}
const ph=(K,t)=>K.filter(k=>t>=k).length;

// ---------- 그림 조각 ----------
function battery(X,Y,w,h,level,col,alpha=1){if(alpha<=0)return;x.save();x.globalAlpha=alpha;x.strokeStyle=INK;x.lineWidth=8;x.beginPath();x.roundRect(X,Y,w,h,18);x.stroke();
  x.fillStyle=INK;x.fillRect(X+w,Y+h*0.3,22,h*0.4);const lv=cl(level);x.fillStyle=lv<0.3?RED:col;x.fillRect(X+14,Y+14,(w-28)*lv,h-28);x.restore()}
function cookie(X,Y,r,a=1){dot(X,Y,r,'#c99a5b',a);[[-.35,-.2],[.3,-.35],[.1,.25],[-.25,.35],[.42,.15]].forEach(([u,v])=>dot(X+u*r,Y+v*r,r*.12,'#4a3426',a))}
function radish(X,Y,r,a=1){x.save();x.globalAlpha=a;x.fillStyle='#4f8a4a';[-0.4,0,0.4].forEach(an=>{x.beginPath();x.ellipse(X+Math.sin(an)*r*.6,Y-r*1.2,r*.22,r*.6,an,0,Math.PI*2);x.fill()});x.restore();dot(X,Y,r,'#b8324a',a);dot(X-r*.3,Y-r*.3,r*.2,'rgba(255,255,255,.35)',a)}
function plate(X,Y,r,a=1){x.save();x.globalAlpha=a;x.strokeStyle=DIM;x.lineWidth=5;x.beginPath();x.arc(X,Y,r,0,Math.PI*2);x.stroke();x.beginPath();x.arc(X,Y,r*.7,0,Math.PI*2);x.stroke();x.restore()}
function paperIcon(X,Y,w,h,col,a=1){rr(X,Y,w,h,6,'#fbf7f0',col,3,a);for(let i=0;i<3;i++)line(X+12,Y+18+i*14,X+w-12,Y+18+i*14,LINE,3,a)}
function person(X,Y,s,col,a=1){dot(X,Y-s*1.1,s*.45,col,a);x.save();x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.roundRect(X-s*.6,Y-s*.55,s*1.2,s*1.4,s*.5);x.fill();x.restore()}
function monitor(X,Y,w,h,a=1){rr(X,Y,w,h,18,'#2f2b27',null,0,a);rr(X+18,Y+18,w-36,h-36,8,'#f7f2ea',null,0,a);rr(X+w/2-40,Y+h,80,40,0,'#2f2b27',null,0,a);rr(X+w/2-120,Y+h+40,240,16,8,'#2f2b27',null,0,a)}
function mark(kind,X,Y,s,a=1){if(a<=0)return;if(kind==='q'){dot(X,Y,s,GOLD,a);txt('?',X,Y+2,s*1.3,'#fff','BH','center',a)}else{dot(X,Y,s*0.8,GRN,a);x.save();x.globalAlpha=a;x.strokeStyle='#fff';x.lineWidth=s*.18;x.lineCap='round';x.beginPath();x.moveTo(X-s*.35,Y);x.lineTo(X-s*.08,Y+s*.28);x.lineTo(X+s*.38,Y-s*.3);x.stroke();x.restore()}}
// 가설 기준 화면 (4~5장에 돌아오는 화면)
function hypBoard(lt,marks,add,tAdd){bg();txt('가설',960,250,34,DIM,'NGX');
  rr(360,300,1200,170,24,'#fbf7f0',INK,4);txt('자제력은 쓰면 줄어든다',960,385,82,INK,'BH');
  const all=add?marks.concat([add]):marks, n=Math.max(all.length,1), sx=960-(n-1)*110;
  all.forEach((m,k)=>{const isNew=add&&k===all.length-1;const a=isNew?cl((lt-tAdd)/.3):1;const s=isNew?66*pop(lt,tAdd):66;mark(m,sx+k*220,640,s,a);
    const lab=['2016 · 23곳','2021 · 12곳','2021 · 36곳'][k]||'';txt(lab,sx+k*220,750,28,DIM,'NG','center',a)});
  if(!all.length){for(let k=0;k<3;k++)rr(960-330+k*220-60,580,120,120,60,null,LINE,4,io(lt,.5));}
}
// 신뢰구간 그림
function ciPlot(d,lt,K,yc=560,sx=380,ex=1540,showRef){const X0=-0.2,X1=0.7,X=v=>sx+(v-X0)/(X1-X0)*(ex-sx);
  line(sx,yc+120,ex,yc+120,INK,3);[0,0.2,0.4,0.6].forEach(v=>{line(X(v),yc+112,X(v),yc+128,INK,3);txt(v.toFixed(1),X(v),yc+160,28,DIM)});
  line(X(0),yc-170,X(0),yc+120,RED,3,1,[10,10]);txt('효과 0',X(0),yc-195,28,RED,'NGX');
  txt('효과 크기(d)',ex,yc+200,26,DIM,'NG','right');
  const g=io(lt,(K[1]??K[0]??0),1.0);x.save();x.globalAlpha=g;x.strokeStyle=INK;x.lineWidth=8;x.beginPath();x.moveTo(X(d.lo),yc);x.lineTo(X(d.hi),yc);x.moveTo(X(d.lo),yc-22);x.lineTo(X(d.lo),yc+22);x.moveTo(X(d.hi),yc-22);x.lineTo(X(d.hi),yc+22);x.stroke();x.restore();
  dot(X(d.est),yc,20,BLUE,g);txt('d ≈ '+d.est.toFixed(2),X(d.est),yc-60,36,BLUE,'BH','center',g);
  if(showRef){dot(X(d.ref),yc,20,DIM,io(lt,showRef,.6));txt('처음 보고된 효과 ≈ '+d.ref,X(d.ref),yc-60,30,DIM,'NGX','center',io(lt,showRef,.6));
    arrow(X(d.ref)-30,yc+50,X(d.est)+30,yc+50,DIM,4,io(lt,showRef+.4,.6),io(lt,showRef+.4,1))}
}

// ---------- 장면 ----------
const MG={};
MG.madi=(d,t,K,D)=>{x.fillStyle='#0d0c0b';x.fillRect(0,0,1920,1080);para(d.text,960,530,1500,d.text.length>60?54:66,'#efe7da','BH','center',io(t,.35,.9),1.45);return 'nosub'};
MG.art=(d,t,K,D)=>{const sh=d.shots;let cur=0;sh.forEach((s,k)=>{if(s[1]<0||t>=K[s[1]]-0.15)cur=k});
  const st=k=>sh[k][1]<0?0:K[sh[k][1]]-0.15, en=k=>k+1<sh.length?st(k+1):D;
  if(cur>0){art(sh[cur-1][0],t-st(cur-1),en(cur-1)-st(cur-1)+0.6,sh[cur-1][2])}
  art(sh[cur][0],t-st(cur),en(cur)-st(cur),sh[cur][2],cur>0?io(t,st(cur),.45):1);
  if(sh[cur][3]==='coat'){const a=io(t,st(cur)+.4);rr(1310,250,470,190,22,'rgba(251,247,240,.94)',INK,3,a);txt('장바구니',1545,300,30,DIM,'NGX','center',a);txt('겨울 코트 · 담아 두기만',1545,370,40,INK,'BH','center',a)}
  shade();
  const isLab=sh[cur][0].startsWith('lab');tag(d.tag||(isLab?'재현 · 실제 사진 아님':'재현 · 창작 인물 서윤'));
  if(d.stamp)stampT(d.stamp,t);
  if(d.thought){const a=io(t,K[0]);rr(1080,150,760,190,95,'rgba(251,247,240,.94)',INK,3,a);dot(1120,370,18,'rgba(251,247,240,.94)',a);dot(1090,410,11,'rgba(251,247,240,.94)',a);para(d.thought,1460,245,660,54,INK,'PEN','center',a,1.2)}
  if(d.box){const a=io(t,K[d.boxk]);rr(410,800,1100,96,16,'rgba(251,247,240,.95)',RED,4,a);txt(d.box,960,848,40,INK,'BH','center',a)}
  if(d.focus){chip('계속 참기보다 즐거운 쪽으로',960,140,40,'rgba(251,247,240,.93)',INK,io(t,K[0])*(t<K[1]?1:.0));
    const f1=io(t,K[1])*(t<K[2]?1:.35),f2=io(t,K[2]);chip('열량이 높다',600,560,46,'rgba(60,110,170,.92)','#fff',f1);
    chip('맛있겠다',1330,520,58*pop(t,K[2])||58,'rgba(217,164,65,.96)',INK,f2);if(t>=K[3])chip('같은 치킨, 다르게 보인다',960,160,42,'rgba(20,18,16,.75)','#fff',io(t,K[3]))}
  if(d.strip){['day_tl','day_tr','day_bl'].forEach((n,k)=>{const a=io(t,K[k+1]);if(a<=0)return;x.save();x.globalAlpha=a;const X=1310,Y=200+k*220;x.drawImage(IM[n],X,Y,360,203);x.strokeStyle='#fbf7f0';x.lineWidth=6;x.strokeRect(X,Y,360,203);x.restore()})}
};
MG.timeline=(d,t,K,D)=>{bg();chap(d);const y=520;line(240,y,1680,y,INK,5,io(t,.2));
  const n1=io(t,K[0]);dot(380,y,26,INK,n1);txt('1998',380,y-70,52,INK,'BH','center',n1);para('쿠키를 참은 사람들 → 퍼즐을 일찍 포기',380,y+110,420,34,INK,'NGX','center',n1);
  const n2=io(t,K[1]);x.save();x.globalAlpha=n2;for(let i=0;i<40;i++){const s=(i*7919)%97/97;dot(700+i*16,y-30+((i*37)%60),7,DIM,0.55)}x.restore();
  txt('수천 명 · 다시 검증',960,y-90,40,DIM,'BH','center',n2);para('결과가 예전처럼 뚜렷하지 않음',960,y+110,520,34,INK,'NGX','center',n2);
  const n3=io(t,K[2]);dot(1540,y,26,RED,n3);txt('2025',1540,y-70,52,RED,'BH','center',n3);txt('?',1540,y+120,110*pop(t,K[2]),RED,'BH','center',n3)};
MG.factcard=(d,t,K,D)=>{bg();chap(d);src(d.src);txt(d.kicker,960,260,36,DIM,'NGX','center',io(t,0));txt(d.title,960,360,86,INK,'BH','center',io(t,.3));
  d.rows.forEach((r,k)=>{const a=io(t,K[k]);rr(560,470+k*130,800,100,16,'#fbf7f0',LINE,3,a);txt(r,960,520+k*130,44,INK,'NGX','center',a)})};
MG.three=(d,t,K,D)=>{bg();chap(d);src(d.src);txt('세 부류로 나눔',960,190,64,INK,'BH','center',io(t,0));
  const cols=[[420,'무만 먹기','쿠키는 눈앞에 두고 참기',RED],[960,'쿠키·초콜릿 먹기','',INK],[1500,'음식 과제 없음','바로 다음 과제로',INK]];
  cols.forEach(([cx,h,s,col],k)=>{const a=io(t,K[k]);const p=pop(t,K[k]);if(k===0){radish(cx-60,500,62*p,a);cookie(cx+90,510,52*p,a*.45);line(cx+40,460,cx+140,560,RED,8,a);}
    else if(k===1){cookie(cx-50,510,62*p,a);dot(cx+80,520,34*p,'#5a3a2a',a)}else{plate(cx,510,80*p,a)}
    txt(h,cx,680,48,col,'BH','center',a);txt(s,cx,745,32,DIM,'NG','center',a)})};
MG.bars98=(d,t,K,D)=>{bg();chap(d);src(d.src);txt('포기하고 종을 울릴 때까지 버틴 시간 (평균)',960,170,50,INK,'BH','center',io(t,0));
  const base=840,H=560/22;line(330,base,1590,base,INK,3);
  const B=[[560,'쿠키·초콜릿 먹음',18.9,INK,0],[960,'음식 과제 없음',20.9,INK,1],[1360,'무 먹고 쿠키 참음',8.4,RED,2]];
  B.forEach(([cx,l,v,col,k])=>{const g=io(t,K[k],1.2);const h=H*v*g;rr(cx-120,base-h,240,h,6,col,null,0,g>0?1:0);txt(l,cx,base+44,32,INK,'NGX','center',io(t,K[k]));txt(v+'분',cx,base-h-40,52,col,'BH','center',g>.95?1:0)});
  if(t>=K[3]){const a=io(t,K[3]);line(1250,base-H*8.4-80,1250,base-H*18.9,RED,4,a,[12,10]);txt('절반도 안 됨',1300,base-H*14,40,RED,'BH','left',a)}};
MG.pair=(d,t,K,D)=>{x.fillStyle='#111';x.fillRect(0,0,1920,1080);[['L',d.left,0],['R',d.right,960]].forEach(([s,n,X])=>{const im=IM[n];x.save();x.beginPath();x.rect(X,0,960,1080);x.clip();
  const sc=1.0+0.04*cl(t/D);const w=1920*sc,h=1080*sc;x.globalAlpha=s==='R'?0.35+0.65*io(t,K[0]):1;x.drawImage(im,X+480-w/2,540-h/2,w,h);x.restore()});line(960,0,960,1080,'#efe7da',6);shade();
  chip('1998 · 쿠키를 참은 학생 (재현)',480,120,34,'rgba(20,18,16,.7)','#fff');chip('서윤의 하루 (재현)',1440,120,34,'rgba(20,18,16,.7)','#fff',io(t,K[0]))};
MG.battery=(d,t,K,D)=>{bg();chap(d);src(d.src);tag('1998년의 설명 · 비유',false);
  txt('자아 고갈',960,210,96,INK,'BH','center',io(t,K[0]));txt('ego depletion',960,290,36,DIM,'NG','center',io(t,K[0]+.3));
  const lv=1-0.7*io(t,K[1]+.4,2.6);battery(700,400,460,200,lv,GRN,io(t,K[1]-.2));txt('참기에 쓰면 줄어든다',930,670,40,INK,'NGX','center',io(t,K[1]+.4));
  const n=Math.floor(cl((t-K[2])/2.5)*9);for(let i=0;i<n;i++)paperIcon(1360+(i%3)*90,340+Math.floor(i/3)*120,74,96,GRN);txt('지지하는 결과들',1490,720,32,GRN,'NGX','center',io(t,K[2]))};
MG.bias=(d,t,K,D)=>{bg();chap(d);const p=ph(K,t);
  if(p<2){tag('비유',false);battery(560,330,360,160,0.3,GRN,1);txt('배터리 (비유)',740,560,36,DIM,'NGX');
    const a=io(t,K[0]);rr(1060,300,640,110,16,'#e3efe6',GRN,4,a);txt('보여 준 것: 참은 뒤 일찍 포기',1380,355,38,INK,'NGX','center',a);
    const b=io(t,K[0]+1.6);rr(1060,450,640,110,16,'#f6d9d3',RED,4,b);txt('배터리가 들어 있다는 증거',1380,505,38,INK,'NGX','center',b);line(1090,505,1670,505,RED,6,b);

// ---------- 6장 (D3 샘플 그대로, i 문단 번호) ----------
function eye(cx,cy,r,look,alpha=1){x.save();x.globalAlpha=alpha;x.fillStyle='#fff';x.strokeStyle=INK;x.lineWidth=4;x.beginPath();x.ellipse(cx,cy,r*1.5,r,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle=INK;x.beginPath();x.arc(cx+look*r*0.85,cy,r*0.45,0,Math.PI*2);x.fill();x.restore()}
function clock(cx,cy,r,frac,label){x.save();x.strokeStyle=LINE;x.lineWidth=14;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();x.strokeStyle=INK;x.beginPath();x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);x.stroke();x.restore();txt(label,cx,cy,40,INK,'BH')}
function antisaccade(cx,cy,r,t,per,anti=true,a=1){const k=Math.floor(t/per),f=(t%per)/per,side=(k%2?1:-1);dot(cx+side*r*4,cy,r*0.35,RED,a*(f>.15&&f<.85?1:0));
  let look=0;if(f>.2&&f<.35)look=side*0.5*((f-.2)/.15);else if(f>=.35&&f<.85)look=anti?-side:side;if(anti&&f>=.35&&f<.45)look=side*0.5+(-side-side*0.5)*((f-.35)/.1);eye(cx,cy,r,look,a);txt('+',cx,cy+r*1.9,30,DIM,'NG','center',a)}
function gonogo(cx,cy,t,a=1,err=false){const items=['go','go','nogo','go','go','go','nogo','go'];const sp=1.1;const n=Math.floor(t/sp),f=(t%sp)/sp;const it=items[n%items.length];x.save();x.globalAlpha=a;
  const sy=cy-60;if(it==='go'){dot(cx,sy,60,GRN)}else{x.strokeStyle=RED;x.lineWidth=18;x.beginPath();x.moveTo(cx-50,sy-50);x.lineTo(cx+50,sy+50);x.moveTo(cx+50,sy-50);x.lineTo(cx-50,sy+50);x.stroke()}
  const by=cy+330;x.fillStyle=LINE;x.beginPath();x.ellipse(cx,by,110,34,0,0,Math.PI*2);x.fill();const press=(it==='go'||(err&&it==='nogo'))&&f>.25&&f<.55;x.fillStyle=press?(it==='nogo'?RED:INK):'#6b6157';
  x.beginPath();x.ellipse(cx,by-(press?4:14),80,24,0,0,Math.PI*2);x.fill();x.fillStyle='#e9c8a8';x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.roundRect(cx-26,by-(press?150:190),52,120,24);x.fill();x.stroke();x.restore();
  if(it==='nogo')txt(err&&f>.25?'잘못 누름':'멈춤',cx+170,cy-60,40,RED,'NGX','center',a*(f>.1?1:0))}
function bar(X,Y,w,val,max,col,label,vtxt,grow){const h=560*val/max*grow;x.fillStyle=col;x.fillRect(X,Y-h,w,h);txt(label,X+w/2,Y+40,30,INK);txt(vtxt,X+w/2,Y-h-34,36,INK,'BH','center',grow>0.95?1:0)}
MG.ch6=(d,lt,K,dur)=>{bg();chap(d);const i=d.i;
  if(i===0){txt('2025년',960,300,40,DIM,'NG','center',io(lt,0));txt('첫 과제를 더 오래, 더 힘들게',960,420,92,INK,'BH','center',io(lt,.3,.6));clock(960,700,120,cl((lt-1.5)/(dur-1.5))*0.75,'30~40분');src('Dang 외 (2025), J. Pac. Rim Psychol. 19')}
  else if(i===1){txt('점의 반대쪽을 보세요',960,170,60,INK,'BH','center',io(lt,0));antisaccade(960,560,90,lt,1.6,true,1);txt('끌려가는 눈을 매번 붙잡아 반대로',960,860,40,DIM,'NG','center',io(lt,3));
    const m=Math.min(40,Math.floor(cl(lt/dur)*40));clock(1660,240,70,m/40,m+'분');src('재현 도식')}

    cols.forEach(([cx,h,s,anti,len],k)=>{const a=io(lt,dur*(0.25+k*0.2));antisaccade(cx,470,55,lt,1.6,anti,a);txt(h,cx,660,46,anti?RED:INK,'BH','center',a);txt(s,cx,720,30,DIM,'NG','center',a);
      x.save();x.globalAlpha=a;x.fillStyle=LINE;x.fillRect(cx-170,780,340,22);x.fillStyle=anti?RED:INK;x.fillRect(cx-170,780,340*len*cl((lt-dur*(0.25+k*0.2))/2),22);x.restore()});src('Dang 외 (2025) 설계 · 재현 도식')}
  else if(i===3){txt('세 집단 모두 같은 두 번째 과제',960,140,52,INK,'BH','center',io(lt,0));gonogo(960,400,lt,io(lt,.4),false);
    const a=io(lt,dur*0.6);x.save();x.globalAlpha=a;x.strokeStyle=RED;x.lineWidth=4;x.strokeRect(560,800,800,90);x.restore();txt('주 지표 · 누르지 말아야 할 때 잘못 누른 실수',960,845,38,RED,'NGX','center',a)}
  else if(i===4){txt('누르지 말아야 할 때 잘못 누른 실수',960,110,46,INK,'BH','center',io(lt,0));txt('14개 표본 · 2,078명 · 실험실과 온라인',960,175,32,DIM,'NG','center',io(lt,.4));
    const g1=io(lt,dur*0.3,1.2),g2=io(lt,dur*0.42,1.2);x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.moveTo(470,810);x.lineTo(1450,810);x.stroke();
    bar(560,810,300,0.35,0.4,RED,'오래 참기 vs 길게 쉬운 과제','d = 0.35',g1);bar(1060,810,300,0.31,0.4,RED,'오래 참기 vs 짧게 쉬운 과제','d = 0.31',g2);
    txt('효과 크기(d) · 다른 연구와 과제·지표가 달라 직접 비교하지 않음',960,905,28,DIM,'NG','center',io(lt,dur*0.6));src('Dang 외 (2025), J. Pac. Rim Psychol. 19')}
  else if(i===5){txt('쉬운 과제: 오래 vs 짧게',960,140,52,INK,'BH','center',io(lt,0));x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.moveTo(470,780);x.lineTo(1450,780);x.stroke();
    const g=io(lt,.6,1);bar(600,780,260,0.35,0.4,'#c9bfb0','오래 참기 vs 길게 쉬운 과제','d = 0.35',g*0.999);bar(1060,780,260,0.01,0.4,INK,'길게 vs 짧게','d = 0.01',g);
    txt('뚜렷한 차이가 확인되지 않음 — 차이가 없다는 증명은 아님',960,895,34,INK,'NGX','center',io(lt,dur*0.45))}
  else if(i===6){txt('모든 능력이 똑같이 떨어진 것은 아니다',960,160,56,INK,'BH','center',io(lt,0));
    const rows=[['누르지 말아야 할 때 잘못 누름','차이 나타남',RED],['다른 종류의 실수','뚜렷한 차이 확인 안 됨',DIM],['반응 시간','뚜렷한 차이 확인 안 됨',DIM]];
    rows.forEach(([a,b,col],k)=>{const al=io(lt,dur*(0.12+k*0.14));x.save();x.globalAlpha=al;x.fillStyle=k===0?'#f6d9d3':'#e6ddcf';x.fillRect(420,330+k*150,1080,110);x.restore();txt(a,470,385+k*150,42,INK,'NGX','left',al);txt(b,1450,385+k*150,38,col,'NGX','right',al)});
    txt('같은 결과가 다른 연구진에서도 나올지는 아직',960,840,34,DIM,'NG','center',io(lt,dur*0.7))}};

function R(si,t,sub){const s=S[si];x.globalAlpha=1;const r=MG[s.data.mg](Object.assign({id:s.data.id},s.data),t,s.K,s.D);
  // 장면 첫 0.25초: 앞 장면에서 넘어오는 짧은 디졸브 대신 검은 막을 걷음(장 바뀔 때만)
  if(si>0&&S[si-1].data.ch!==s.data.ch&&t<.35){x.fillStyle=`rgba(13,12,11,${1-t/.35})`;x.fillRect(0,0,1920,1080)}
  if(r!=='nosub')SUB(sub)}
function INIT(scenes,artURI){S=scenes;const names=new Set();scenes.forEach(s=>{const d=s.data;(d.shots||[]).forEach(z=>names.add(z[0]));['left','right','then'].forEach(k=>d[k]&&names.add(d[k]));if(d.strip)['day_tl','day_tr','day_bl'].forEach(n=>names.add(n))});
  let left=names.size+1;window.READY=false;const done=()=>{if(--left<=0)window.READY=true};Promise.all(['40px NG','40px NGX','40px BH','40px PEN'].map(f=>document.fonts.load(f,'가나다 abc 123'))).then(done,done);
  names.forEach(n=>{const im=new Image();im.onload=done;im.onerror=done;im.src=artURI+'/'+n+'.jpg';IM[n]=im})}
window.R=R;window.INIT=INIT;
