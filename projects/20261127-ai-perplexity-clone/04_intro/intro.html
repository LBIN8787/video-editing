<script>
const W=1920,H=1080;
const X=y=>300+(y-2022)*275, Y=v=>820-(v-0.70)/0.30*660;
const PTS=[[2022.2,.986],[2023.2,.913],[2023.7,.911],[2024.3,.906],[2024.8,.899],[2025.12,.876],[2025.3,.902],[2025.6,.896],[2025.93,.888],[2026.2,.871],[2026.5,.828],[2026.85,.761]];
const LAB={0:['유창한 대화','0.986','GPT-3.5','bubble',-10,-70],1:['생각하고 답하기','0.913','GPT-4','bulb',30,-90],9:['쓸 만한 코더','0.871','GPT-5.3-Codex / 5.4','code',-400,56],10:['사이버보안 전문가','0.828','GPT-5.6 Sol','shield',-420,44],11:['밀레니엄 수학 난제를 풀었다','0.761','GPT-6.2 Astra','sigma',-560,30]};

const el=(tag,a,parent)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(parent||svg).appendChild(e);return e};
const svg=document.getElementById('chart');
// 정의: 빗금
const defs=el('defs',{});const pat=el('pattern',{id:'hatch',width:14,height:14,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);el('rect',{width:14,height:14,fill:'#EEF0EA'},pat);el('line',{x1:0,y1:0,x2:0,y2:14,stroke:'#C9CEC6','stroke-width':6},pat);

el('text',{x:0,y:24,'text-anchor':'middle','font-size':16,fill:'#7A8A8F'},G.ylab).textContent='Log-perplexity · 낮을수록 잘 맞힘';
G.title=el('g',{});el('text',{x:1700,y:110,'text-anchor':'end','font-size':34,'font-weight':800,fill:'#1F4A5A'},G.title).textContent='기반 모델 로그 퍼플렉시티';
el('text',{x:1700,y:138,'text-anchor':'end','font-size':17,fill:'#7A8A8F'},G.title).textContent='OpenAI 사내 코드베이스 기준 · 원문 값을 다시 그림';
G.arrow=el('path',{d:'M 160 490 Q 250 440 345 440',fill:'none',stroke:'#E0703F','stroke-width':5,'marker-end':''},svg);

// 아이콘 열
const ICON={bubble:'M-18,-12 h36 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-20 l-10,9 v-9 h-6 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z',bulb:'M0,-20 a14,14 0 0 1 9,25 v7 h-18 v-7 a14,14 0 0 1 9,-25 z M-7,16 h14',code:'M-10,-10 l-12,10 l12,10 M10,-10 l12,10 l-12,10 M4,-16 l-8,32',shield:'M0,-20 l16,6 v10 c0,12 -8,20 -16,24 c-8,-4 -16,-12 -16,-24 v-10 z',sigma:'M12,-16 h-24 l14,16 l-14,16 h24'};
G.icons=el('g',{});const ICOL=['bubble','bulb','code','shield','sigma'];
ICOL.forEach((k,i)=>{const g=el('g',{transform:`translate(262 ${Y([.986,.913,.871,.828,.761][i])})`},G.icons);el('circle',{r:24,fill:'#fff',stroke:'#E0703F','stroke-width':2.5},g);el('path',{d:ICON[k],fill:'none',stroke:'#1F4A5A','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round',transform:'scale(.72)'},g)});
// 미래 띠
G.band=el('g',{});
el('rect',{x:220,y:Y(0.70),width:1480,height:Y(0.68)-Y(0.70)+18,fill:'url(#hatch)'},G.band);
el('text',{x:1300,y:Y(0.695)+22,'text-anchor':'middle','font-size':34,'font-weight':700,fill:'#E0703F','font-family':'Consolas'},G.band).textContent='0.68–0.70';
G.bandbox=el('rect',{x:220,y:Y(0.70),width:1480,height:Y(0.68)-Y(0.70)+18,fill:'none',stroke:'#E0703F','stroke-width':4,rx:6});
G.q=el('text',{x:1560,y:Y(0.69)+40,'text-anchor':'middle','font-size':150,'font-weight':900,fill:'#1F4A5A'});G.q.textContent='?';
// 선
const pts=PTS.map(p=>[X(p[0]),Y(p[1])]);const dstr='M'+pts.map(p=>p.join(' ')).join(' L ');
G.ghost=el('path',{d:dstr,fill:'none',stroke:'#E0703F','stroke-width':4,opacity:.18});

const cum=[0];for(let i=1;i<pts.length;i++){cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}const LEN=cum[cum.length-1];
G.line.setAttribute('stroke-dasharray',LEN+' '+LEN);
G.dots=pts.map((p,i)=>el('circle',{cx:p[0],cy:p[1],r:LAB[i]?11:7,fill:'#fff',stroke:'#1F4A5A','stroke-width':LAB[i]?4:3}));

for(const i in LAB){const [a,v,m,ic,dx,dy]=LAB[i];const g=el('g',{transform:`translate(${pts[i][0]+dx} ${pts[i][1]+dy})`});

 const t2=el('text',{x:0,y:30,'font-size':22,fill:'#7A8A8F'},g);t2.innerHTML=`<tspan fill="#E0703F" font-family="Consolas" font-weight="700" font-size="24">${v}</tspan>  ${m}`;
 G.labs[i]=g}
// 내부 모델
G.inner=el('g',{});const ip=[X(2026.95),Y(0.732)];
el('rect',{x:ip[0]-10,y:ip[1]-10,width:20,height:20,fill:'#1F4A5A'},G.inner);
el('text',{x:ip[0]+22,y:ip[1]-4,'font-size':22,'font-weight':700,fill:'#1F4A5A'},G.inner).textContent='내부 모델';
G.innerv=el('text',{x:ip[0]+22,y:ip[1]+26,'font-size':28,'font-weight':700,fill:'#E0703F','font-family':'Consolas'},G.inner);
// 지금 점선
G.nowl=el('line',{x1:X(2026.95),x2:X(2026.95),y1:150,y2:840,stroke:'#E0703F','stroke-width':3,'stroke-dasharray':'8 8'});
// 값 알약(축 위)
G.vp=el('g',{});el('rect',{x:-58,y:-20,width:116,height:40,rx:20,fill:'#E0703F'},G.vp);G.vpt=el('text',{x:0,y:9,'text-anchor':'middle','font-size':24,'font-weight':700,fill:'#fff','font-family':'Consolas'},G.vp);
// 썸네일 차트
const ts=document.getElementById('thumbsvg');const tp=PTS.map(p=>[80+(p[0]-2022)*170,60+(1-p[1])/0.3*420]);
const tpath=document.createElementNS(NS,'path');tpath.setAttribute('d','M'+tp.map(p=>p.join(' ')).join(' L '));tpath.setAttribute('fill','none');tpath.setAttribute('stroke','#E0703F');tpath.setAttribute('stroke-width','3');ts.appendChild(tpath);

// ---- 시간 도구
const TL=window.TL; const L={},E={};TL.lines.forEach(l=>{L[l.id]=l.start;E[l.id]=l.end});
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eout=x=>1-Math.pow(1-x,3);
const P=(t,s,d=.35)=>eout(cl((t-s)/d)); // 등장 진행
const show=(node,p,dy=12)=>{node.style.opacity=p;node.style.transform=`translateY(${(1-p)*dy}px)`};
const sv=(node,p,extra='')=>{node.setAttribute('opacity',p)};
const pop=(node,p,cx,cy)=>{const s=.6+.4*p;node.setAttribute('opacity',p);node.setAttribute('transform',`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`)};
// 카메라 키프레임 [시각, cx, cy, 배율, 걸리는 시간]
const CAM=()=>[[0,960,540,1,0],[L.article+4.2,960,860,1,1.4],[L.lift+1.4,960,540,1,1.2],[L.axis,250,490,2.0,1.1],[L.scrub,960,540,1,1.1],[L.p1,620,330,1.75,1.2],[L.p3,960,540,1,1.3],[L.below,1320,700,1.8,1.3],[L.face,960,540,1,1.3],[L.hello,960,540,.56,1.0]];
function cam(t){const C=CAM();let i=0;while(i+1<C.length&&C[i+1][0]<=t)i++;const c=C[i],p=C[Math.max(0,i-1)];const k=i==0?1:ease(cl((t-c[0])/c[4]));return [p[1]+(c[1]-p[1])*k,p[2]+(c[2]-p[2])*k,p[3]+(c[3]-p[3])*k]}
function wrap(s){if(s.length<=24)return s;let m=Math.floor(s.length/2),best=-1;for(let d=0;d<m;d++){for(const i of [m-d,m+d]){if(s[i]===','||s[i]===' '){best=i;break}}if(best>=0)break}return best<0?s:s.slice(0,best+1).trim()+'<br>'+s.slice(best+1).trim()}

window.render=function(t){
 const [cx,cy,s]=cam(t);document.getElementById('world').style.transform=`translate(${W/2}px,${H/2}px) scale(${s}) translate(${-cx}px,${-cy}px)`;
 // 원문
 const art=document.getElementById('article');const ao=1-P(t,L.lift+0.3,.6);art.style.opacity=ao;art.style.display=ao<=0.001?'none':'block';
 show(document.getElementById('achip'),P(t,L.article+1.3));
 const sc=document.getElementById('scrub');const sp=cl((t-(L.article+6.2))/2.2);sc.style.opacity=sp>0&&t<L.lift+0.4?1:0;sc.style.left=(80+ease(sp)*720)+'px';sc.querySelector('b').textContent=Math.round(2022+sp*4);
 // 차트 층: 기울어진 종이 → 평평하게
 const cw=document.getElementById('chartwrap');const ci=P(t,L.lift,.5),fl=ease(cl((t-(L.lift+1.4))/1.2));
 cw.style.opacity=t<L.lift?0:ci;cw.style.transform=`translateY(${(1-fl)*260}px) scale(${.5+.5*fl}) rotateX(${(1-fl)*26}deg) rotateZ(${(1-fl)*-4}deg)`;
 cw.style.background=fl<1&&t>=L.lift?`rgba(255,255,255,${(1-fl)})`:'transparent';cw.style.boxShadow=fl<1&&t>=L.lift?`0 30px 60px rgba(0,0,0,${.18*(1-fl)})`:'none';
 // 따옴표 카드
 const q=document.getElementById('quote');const qo=P(t,L.quote+0.2,.45)*(1-P(t,E.quote+0.15,.35));q.style.opacity=qo;q.style.transform=`translateX(${(1-P(t,L.quote+0.2,.45))*-80}px)`;
 document.getElementById('hl').style.width=(cl((t-(L.quote+1.6))/.6)*100)+'%';
 // 세로축 알약·카드
 G.ypill.setAttribute('stroke-dasharray','1200');G.ypill.setAttribute('stroke-dashoffset',1200*(1-cl((t-(L.axis+0.6))/.6)));G.ypill.setAttribute('opacity',t<L.scrub+0.6?1:1-P(t,L.scrub,.5));
 const ap=P(t,L.axis+1.4,.4)*(1-P(t,L.scrub,.4));G.arrow.setAttribute('opacity',ap);G.arrowHead.setAttribute('opacity',ap);G.arrow.setAttribute('stroke-dasharray','260');G.arrow.setAttribute('stroke-dashoffset',260*(1-cl((t-(L.axis+1.4))/.4)));
 const ax=document.getElementById('axcard');ax.style.opacity=P(t,L.axis+1.7,.4)*(1-P(t,L.scrub,.4));ax.style.transform=`scale(${.9+.1*P(t,L.axis+1.7,.4)})`;
 // 값 알약: 축 따라 내려감
 const vk=cl((t-(L.scrub+0.4))/2.4),vv=.986-(.986-.90)*ease(vk);G.vp.setAttribute('transform',`translate(220 ${Y(vv)})`);G.vpt.textContent=vv.toFixed(3);G.vp.setAttribute('opacity',P(t,L.scrub+0.2,.3)*(1-P(t,L.scrub+3.4,.4)));
 // 유령선·제목·아이콘
 sv(G.ghost,t<L.scrub+2?1:(t<L.p1?.18/0.18*0.6:1));G.ghost.setAttribute('opacity',(t<L.scrub+2.2?.9:.18)*(t<L.below+0.2?1:1));
 sv(G.title,1);G.icons.setAttribute('opacity',P(t,L.scrub+3.0,.5));
 // 선 그리기
 const tgt=[[L.p1,0,0],[L.p2+0.2,1,1.0],[L.p3+0.2,9,1.6],[L.p4+0.2,10,.7],[L.p5+0.2,11,.8]];let len=0;
