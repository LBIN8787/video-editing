# 미주일기 레퍼런스 영상에서 자동 측정한 편집 설정 (ytflow style)
edit:
  style: paper
  style_ref: mijudiary
  subtitle_box: true
  push_in: 0.04               # 레퍼런스: 계속 느리게 흐르는 카메라
  fade_in: 0.3
  paper:
    base: '#E4E0D7'
    ink: '#303848'
    red: '#8C2C3D'
    anim_seconds: 1.2
  bgm_hint: 레퍼런스에 배경음악이 깔려 있음 → edit.bgm 에 음원 파일을 지정하세요
