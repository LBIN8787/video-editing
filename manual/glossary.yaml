# 용어 사전 — 매뉴얼·코드에 나오는 연출 말 중 '그래서 저게 뭐야?' 싶은 것을 쉬운 말로.
# 편집 스타일(styles/recipes)·장면 종류(렌더 함수)·효과(fx)·그래픽 팩(skins)은 코드에서 자동으로 읽고,
# 여기에는 코드에 이름이 따로 없는 움직임·측정 용어를 적습니다. 같은 key 를 적으면 자동 설명을 덮어씁니다.
#
#   aliases : 매뉴얼·코드에서 이 말을 찾을 때 쓰는 낱말 (영문은 낱말 단위로 찾음)
#   plain   : 한 줄 뜻 (일반인이 읽어도 알게)
#   look    : 화면에서 실제로 어떻게 보이나
#   how     : 어떻게 만들어지나 (코드가 하는 일)
#   code    : "파일::그 줄에 있는 글자" — 그래프가 지금 줄 번호를 찾아 보여 줌
#   enable  : 켜고 끄는 법
#   anim    : 도구에서 보여 줄 작은 움직임 예시 (camera-beat·push·kenburns·tilt·idle·walk·zoomshot·beat-motion·static·crossfade·cut·kinetic·draw·scan·dust·leak·perspective·layers)
#   caution : 헷갈리기 쉬운 점

terms:
  beat-camera:
    name: 박자 카메라
    cat: motion
    aliases: [박자 카메라, 박자마다 카메라, 박자마다 방향을 바꾸며, "\"camera\": \"beat\""]
    plain: 대본이 한 박자(문장 한 토막) 넘어갈 때마다 카메라가 그 박자의 주인공 쪽으로 옮겨 가는 움직임
    look: 화면 전체가 박자마다 조금씩 밀리고 당겨지며, 지금 말하는 대상 쪽으로 다가감. 머무는 동안에도 아주 천천히 움직임
    how: 렌더러가 박자 시각마다 화면 묶음(cam)에 이동·확대 애니메이션을 붙임. 자료 화면·지도·키네틱·장 표지 같은 장면은 빼고 적용
    code: ["ytflow/stages/hybrid.py::D.cam = spec.get(\"camera\"", "ytflow/stages/edit10.py::def _beat_camera", "ytflow/stages/hybrid.py::CAM_SKIP ="]
    enable: '기본 끔 — 시장·하이브리드 장면은 "camera": "beat", 애니메이션 무대(stage)는 "camera": "move" (v30·v34)'
    anim: camera-beat
    caution: 화면이 움직인다고 '말하는 내용이 화면에 생기는' 것은 아님 — 정지 비율 숫자는 좋아지지만 의미는 그대로일 수 있음 (v30)

  slow-push:
    name: 장면 안 느린 확대 (확대·축소)
    cat: motion
    aliases: [느린 확대, 천천히 다가가, 한 방향 느린 카메라, 확대·축소, no_zoom, "\"zoom\": \"off\""]
    plain: 한 장면이 이어지는 동안 화면 전체가 아주 천천히 커지는(다가가는) 움직임
    look: 장면 내내 2~3% 정도 서서히 확대됨. 길게 보면 '웅웅거리는' 느낌이 날 수 있음
    how: 장면 묶음에 시작→끝 확대 애니메이션을 붙임. 시장 채널은 D.no_zoom 으로 끔
    code: ["ytflow/stages/edit10.py::if not getattr(D, \"no_zoom\"", "ytflow/stages/hybrid.py::# v31 확대·축소 없음"]
    enable: '기본 켬, 시장 채널은 hybrid.json "zoom": "off" 가 기본 (v31)'
    anim: push

  idle:
    name: 대기 동작 (그림이 숨 쉼)
    cat: motion
    aliases: [대기 동작, 숨 쉰다, 숨 쉬듯]
    plain: 화면에 나온 사람·사물 그림이 가만히 있지 않고 아주 조금씩 위아래·좌우로 흔들리는 것
    look: 멈춘 것처럼 보이는 그림도 1~2픽셀씩 계속 들썩임
    how: 애니메이션 무대(stage) 렌더러가 켜졌을 때 등장한 그림마다 끝까지 반복 움직임을 붙임
    code: ["ytflow/stages/stage.py::self.idle: list", "ytflow/stages/stage.py::cam_move = opt.get"]
    enable: '기본 끔 (v34) — 장면이나 대본 맨 위 "idle": true'
    anim: idle
    caution: "'완전히 멈춘 프레임 없음'을 만들기 위한 장치 — 정지 비율은 낮아지지만 내용이 바뀌는 것은 아님"

  perspective-paper:
    name: 원근 종이 (2.5D)
    cat: motion
    aliases: [원근 종이, 원근 바닥, 2.5D]
    plain: 그림이 그려진 종이가 살짝 누운 채 박자마다 좌우로 천천히 돌아가는 연출
    look: 화면이 평평한 종이가 아니라 책상 위 종이를 비스듬히 보는 듯한 깊이
    how: 무대 전체에 CSS 원근(perspective)과 rotationX·rotationY 애니메이션
    code: ["ytflow/stages/stage.py::# ④ 원근"]
    enable: '기본 끔 (v34) — 장면이나 대본 맨 위 "perspective": true'
    anim: perspective

  walk-in:
    name: 걸어 들어오기
    cat: motion
    aliases: [걸어 들어, "from: walk", 걸어서(굴러서)]
    plain: 사람·로봇·수레가 갑자기 나타나지 않고 화면 밖에서 걸어(굴러) 들어오는 것
    look: 그림이 왼쪽(또는 오른쪽) 밖에서 통통 튀며 자리까지 이동
    how: 'stage 장면 박자에 from: walk 를 적으면 시작 위치를 화면 밖에 두고 이동 애니메이션'
    code: ["ytflow/stages/stage.py::if m.get(\"from\") == \"walk\""]
    enable: 'hybrid.json stage 박자의 "from": "walk"'
    anim: walk

  beat-motion:
    name: 말에 맞춰 생기는 사물 (박자 motion)
    cat: motion
    aliases: [박자 motion, 말에 맞춰 생기는, 말하는 것이 화면에 생긴다, 말하는 숫자가, "`motion`"]
    plain: 내레이션이 숫자·사물을 말하는 바로 그 순간 그 숫자·아이콘·화살표가 화면에 생기는 것
    look: "'631억'이라고 말하는 순간 631억 카드가 튀어나오고, '은행'이라고 하면 은행 아이콘이 나타남"
    how: 박자마다 적은 motion 항목(count·icon·arrow·pulse)을 그 낱말을 말하는 시각(받아쓰기 시각)에 맞춰 등장시킴
    code: ["ytflow/stages/hybrid.py::motion2.apply(D, sc, bt, dur)", "ytflow/stages/motion2.py::def apply"]
    enable: 'hybrid.json 박자의 "motion": [...] (시장 채널 v27부터 G4 MUST)'
    anim: beat-motion
    caution: "사용자가 말한 '동영상의 이점'(말하는 것이 화면에 생긴다)에 가장 가까운 장치 (09 §6 v30)"

  static-ratio:
    name: 정지 화면 비율
    cat: measure
    aliases: [정지 화면 비율, 정지 비율, static_ratio]
    plain: 완성 영상에서 앞 프레임과 거의 똑같은(차이 0.6 미만) 순간이 몇 %인지
    look: 숫자 하나 (0.26 = 영상의 26% 동안 화면이 거의 안 바뀜)
    how: 완성본 프레임을 뽑아 이웃 프레임 사이 밝기 차이를 재고, 작은 차이의 비율을 셈 → 05_edit/motion.json
    code: ["ytflow/stages/style.py::\"static_ratio\": round", "ytflow/stages/hybrid.py::project.write_json(\"edit\", \"motion.json\""]
    enable: 렌더 끝에 자동 측정, check G6 이 읽음 (호기심 ≤0.3 MUST, 시장은 참고만)
    anim: static
    caution: 무엇이 바뀌었는지(의미)는 모름 — 카메라를 흔들거나 그림을 들썩이게 하면 내용 변화 없이도 숫자가 좋아짐

  change-rate:
    name: 화면 변화 (회/분)
    cat: measure
    aliases: [화면 변화, change_events_per_min]
    plain: 완성 영상에서 화면이 눈에 띄게 바뀌는 순간이 1분에 몇 번인지
    look: 숫자 하나 (22.7/분 ≈ 2.6초마다 무언가 바뀜)
    how: 이웃 프레임 차이가 큰 순간(변화 사건)을 세어 분당으로 나눔
    code: ["ytflow/stages/style.py::change_events_per_min"]
    anim: crossfade
    caution: 정지 비율과 같은 한계 — '왜' 바뀌는지는 재지 않음

  transition:
    name: 장면 전환 (겹침·밀기)
    cat: motion
    aliases: [장면 전환, 겹침 전환, 휙 전환, 부드러운 겹침]
    plain: 한 장면에서 다음 장면으로 넘어갈 때 딱 자르지 않고 0.3초쯤 겹치거나 밀며 넘어가는 것
    look: 앞 장면이 흐려지며 다음 장면이 겹쳐 나타남 (장 표지만 옆으로 밀기)
    how: 앞 장면 끝 0.3초 + 다음 장면 처음 0.35초에 걸친 전환을 렌더러가 붙임
    code: ["ytflow/stages/edit10.py::A2 장면 전환", "ytflow/stages/edit10.py::# ---- 나가기"]
    anim: crossfade

  hard-cut:
    name: 하드 컷
    cat: motion
    aliases: [하드 컷, 딱 자르기]
    plain: 전환 효과 없이 한 프레임에 다음 장면으로 바로 바뀌는 것
    look: 앞 장면이 그대로 끊기고 다음 장면이 바로 나옴
    how: 전환을 붙이지 않은 장면 경계
    anim: cut

  layers:
    name: 장면 안 겹치기 (layers)
    cat: motion
    aliases: [layers, 겹친 장면, 장면 안 겹치기]
    plain: 한 장면 위에 사진·지도·도장·표시 같은 층을 하나 더 얹는 것
    look: 도식 위에 자료 사진이 비스듬히 붙거나, 지도 조각·도장이 찍힘
    how: 장면의 layers 목록을 렌더러가 장면 그림 위에 차례로 얹음
    code: ["ytflow/stages/directions.py::def apply_layers"]
    enable: 'hybrid.json 장면의 "layers": [...]'
    anim: layers

  graphic-pack:
    name: 그래픽 팩·바탕 (look)
    cat: skin
    aliases: [그래픽 팩, 바탕색, "\"look\""]
    plain: 연출은 그대로 두고 색·글꼴·배경 질감만 바꾸는 겉옷 (스킨)
    look: 같은 장면이 미색 종이·칠판·남색 대시보드 등으로 옷만 바뀜
    how: skins/<id>/skin.yaml 의 색 토큰·글꼴·배경을 렌더러가 읽음. 장면마다 look 으로 바꿀 수 있음
    code: ["ytflow/stages/skin.py::TOKENS"]
    enable: edit.yaml 의 skin, 장면의 "look"
    anim: layers
