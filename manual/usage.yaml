# 용도표 원본 — 기능(장면 종류·움직임·효과·그래픽 팩)마다 '언제 쓰고, 언제 쓰지 않고, 대신 무엇을'
# 2026-11-15 사용자: "어떤 상황에서 애니메이션을 넣고 언제 그림판을 넣는지 — 기능에 맞추어 그 기능들·연출들·편집법들이 언제 쓰이는지 먼저 정리.
#                     이 둘만이 아니라 전체 모두."
# 사람이 읽는 표는 manual/10-when-to-use.md (python -m ytflow manual-graph 가 이 파일·styles/recipes·styles/techniques.yaml·
# manual/situations.yaml 에서 다시 만듦). 편집 스타일(레시피)의 용도는 레시피의 when·fits·roles·avoid, 연출 기법은 techniques.yaml 이 원본.
#
#   group   : 기능 묶음 (아래 groups 의 id)
#   does    : 화면에서 무엇을 하나 (한 줄)
#   when    : 언제 쓰나 — 대본의 그 박자가 하는 일 / 자료 조건
#   not_when: 언제 쓰지 않나
#   instead : 그럴 때 대신 쓸 것 (key)
#   situations: manual/situations.yaml·topics 의 상황 id (그래프가 이어 줌)
#   층: 모두 '스타일 기본값' — 금지·MUST 가 아니라 고르는 기준 (README §3-1). 원칙(사실·라이선스)은 따로 지킴.

groups:
  evidence: {name: 실제 자료로 증거를 보여 준다, why: "누가 무엇을 말하고 했는지 — 사실은 그대로 보여 줄 때 가장 믿음이 감"}
  act: {name: 이야기를 연기한다 (사람·사물의 행동), why: "대본의 동사를 그림이 직접 하면 설명 없이 이해됨 (04 §0-5)"}
  link: {name: 원인·관계를 잇는다, why: "A 가 B 로 이어지는 구조를 한 장에서 보이게"}
  place: {name: 장소·이동을 보여 준다, why: "'어디서 어디로'는 지도가 가장 빠름"}
  number: {name: 숫자·크기·변화를 느끼게 한다, why: "숫자는 비교 기준·사람 수·모양으로 바꿔야 느껴짐"}
  time: {name: 시간 순서를 보여 준다, why: "한 줄기 이야기를 시간 순서로 (README §2-3)"}
  frame: {name: 질문·정리·장 구분, why: "시청자가 지금 어디쯤인지, 무엇을 기억할지"}
  howto: {name: 방법을 보여 준다 (AI·도구), why: "따라 할 수 있게 — 실제 화면이 주인공"}
  bundle: {name: 여러 소식을 묶는다, why: "같은 틀에 한 소식씩 — 많은 소식을 빠르게"}
  motion: {name: 움직임·이어 주기 (장면 위에 얹는 것), why: "말하는 것이 그 순간 화면에 생기게 (README §2-5) — 수단이지 목적이 아님"}
  look: {name: 겉모습 (색·글꼴·바탕), why: "연출은 그대로 두고 분위기만 바꿈 (docs/13)"}

# 애니메이션 무대 vs 이야기 그림판 — 사용자 질문의 직접 답 (manual/10 §1)
compare_stage_story:
  stage:
    한마디: 한 화면 = 한 순간. 주인공이 대본의 동사를 '연기'한다
    쓰는 때: [주인공(사람·로봇·동물·사물)이 무언가를 '하는' 박자 — 앉다·쓰러지다·닫다·집다·미끄러지다,
              반전·깨달음을 그림의 움직임 하나로 보여 줄 때 (시소가 넘어감·모양이 바뀜),
              두 주인공의 대결·대비 (체스 말 vs 티셔츠),
              처음·가운데·끝에 같은 주인공을 다시 불러 모티프로 묶을 때]
    쓰지 않는 때: [여러 사실을 한 장에 모아 '전체 그림'을 봐야 할 때 → story, 숫자 비교가 핵심 → number 묶음, 실제 인물·사건의 증거 → evidence 묶음]
  story:
    한마디: 큰 종이 한 장에 이야기가 '쌓인다'. 카메라가 다음 자리로 옮겨 감
    쓰는 때: [여러 장소·인물·날짜가 이어져 마지막에 한 장으로 모아 볼 때 (지도처럼 펼쳐진 사건의 흐름),
              관계·계보·연표처럼 앞에 그린 것이 뒤의 의미가 될 때,
              장 끝에 지금까지 그린 것을 한 화면에 모아 대비·질문으로 닫을 때 (카메라 full),
              주인공의 '행동'보다 '무엇과 무엇이 엮였나'가 이야기의 핵심일 때]
    쓰지 않는 때: [한 순간의 행동·반전 → stage, 요소가 6개를 넘어 콜라주가 될 때 (v22 기각 원인) — 장면을 나누거나 stage 로,
                   글자 쪽지·소제목으로 대본을 다시 쓰게 될 때]
  둘 다: "같은 영상에서 섞어 쓴다 — 박자가 '하는 일'이 정한다 (사람이 한다 → stage, 쌓아 엮는다 → story). 호기심 대본은 주인공의 행동이 많아 stage 가 자주 나올 뿐 '항상'이 아님"

items:
  statecard: {group: howto, does: 같은 카드의 대기·진행·성공·실패를 박자에 맞춰 바꿈, when: "AI 요청·예약·결제의 상태가 달라질 때; hub로 주체·서비스 연결", not_when: "실제 실행을 검증해야 할 때는 실제 화면 우선; 재연 고지 유지", instead: [footage, chat], situations: [ai-ask]}
  docspot: {group: evidence, does: 문서의 읽는 문단만 밝게 남기고 형광펜·옆 숫자로 강조, when: "기사·공식 문서의 근거 문장과 수치를 짚을 때", not_when: "출처 미확인·재구성 문서를 원본으로 오인하게 하는 경우", instead: [quote, newsdesk], situations: [point, media]}
  # ───────── 실제 자료로 증거
  footage: {group: evidence, does: 원본 영상(인터뷰·발표·현장)을 화면 가득, when: "그 사람·현장의 실제 모습이 사실의 근거일 때, 발언 원본이 있을 때", not_when: "원본이 없거나 라이선스가 불명일 때 (원칙)", instead: [kb, quote], situations: [said, open-scene]}
  kb: {group: evidence, does: 자료 사진을 화면 가득 + 날짜·장소 타자, when: "사건의 장면을 열 때(때·곳·사람), 역사 사진·공공 기록이 있을 때", not_when: "시장 채널의 사진 밀기(확대)는 v31 로 끔 — 정지 사진으로", instead: [footage, stage], situations: [open-scene]}
  bite: {group: evidence, does: 긴 원본에서 대본과 맞는 문장만 잘라 그 사람 목소리로 + 원문·번역 2단, when: "경영진·당국자의 약속·답변이 핵심일 때 (어닝콜·기자회견)", not_when: "원본 음성을 받을 수 없을 때 (PC rebuild)", instead: [quote], situations: [said, call-bite]}
  quote: {group: evidence, does: 발언·문서 문장 카드 + 형광펜, when: "원본 영상이 없는 발언, 공시·보고서 한 문장", not_when: "말한 사람의 목소리가 있을 때 → bite", instead: [bite, footage], situations: [said, media]}
  newspapers: {group: evidence, does: 두 매체(나라) 지면 비교 재구성, when: "매체마다 다르게 보도한 것 자체가 이야기일 때", not_when: "실제 지면을 복제하게 될 때 (재구성 표시)", instead: [quote, versus], situations: [media]}
  zoomshot: {group: evidence, does: 화면 녹화·캡처 위로 카메라가 한 곳으로 다가가 테두리, when: "자료 화면의 한 줄·한 칸을 가리킬 때", not_when: "한 장면에 3번 이상, 시장 채널(v31 확대 끔) — 표시만", instead: [layers], situations: [point]}

  # ───────── 이야기를 연기
  stage: {group: act, does: 한 화면 한 생각 무대 — 주인공이 동사를 연기, when: "주인공이 무언가를 '하는' 박자, 반전·깨달음을 움직임 하나로, 두 주인공 대비", not_when: "여러 요소를 한 장에 모아야 할 때, 숫자 비교가 핵심일 때", instead: [story, bars], situations: [character-acts, change, reveal, open-scene, scale]}
  story: {group: act, does: 큰 종이 한 장에 사람·사물이 선으로 그려지며 쌓이고 카메라가 따라감, when: "여러 장소·인물·날짜가 엮여 마지막에 한 장으로 볼 때, 관계·연표, 장 끝 모아 보기", not_when: "요소가 6개를 넘어 콜라주가 될 때, 한 순간의 행동", instead: [stage, map_causal], situations: [build-up, timeline]}
  illust: {group: act, does: 손그림 삽화 한 장 위를 카메라가 옮겨 가며 표시, when: "사람들의 생각·행동·상황을 한 장의 그림으로 (그림을 준비했을 때)", not_when: "그림이 없을 때 (자리 카드만 나옴)", instead: [stage], situations: [open-scene, character-acts]}
  metaphor: {group: act, does: 무리가 한쪽으로 몰려가고 의태어가 튀어나오는 비유, when: "돈·사람·데이터가 한쪽으로 쏠리는 비유 — 사용자가 고를 때만", not_when: "매뉴얼 기본 선택으로는 쓰지 않음 (품질 보완 필요)", instead: [analogy, stage], situations: []}
  studio3d: {group: act, does: 어두운 3D 무대의 물체, when: "제품·물체 하나를 입체로 돌려 볼 때", not_when: "이야기·숫자 장면 (무겁고 느림)", instead: [stage], situations: []}

  # ───────── 원인·관계
  map_causal: {group: link, does: 칸과 화살표 인과 지도 — 같은 칸 위치를 유지하며 하나씩 켬, when: "원인 → 결과가 3단계 이상 이어질 때, 시장을 흔든 사건의 파급 경로", not_when: "화살표가 1~2개뿐 (말로 충분)", instead: [analogy, story], situations: [cause, hub-event]}
  board: {group: link, does: 같은 인과 지도를 코르크 판 카드 + 붉은 실로, when: "사람·기관·회사가 엮인 관계도 (시사·소송·조사)", not_when: "원리·과정 설명 → 칠판(chalk) 모양", instead: [map_causal], situations: [cause, say-vs-do]}
  analogy: {group: link, does: 왼쪽 익숙한 것 ↔ 오른쪽 낯선 것 비유 그림, when: "어려운 구조를 생활 속 하나로 바꿀 때 (원리)", not_when: "비유가 사실을 왜곡할 때", instead: [map_causal, stage], situations: [cause, us-link]}
  # 설명 무대 (styles/explain-stage, 2026-11-20 사용자: 쉽게 설명·상황 설명 = 모션그래픽)
  motionboard: {group: act, does: "인물(사진·실루엣)·소품 카드·글자·화살표·붓을 한 무대에 놓고 박자마다 나타남·옮김·강조·흐리게", when: "누가 무엇을 누구에게 넘기나, 제도·구조가 어떻게 작동하나 (보호예수·공매도·블록딜)", not_when: "캐릭터 몸짓 → stage, 지도 위 이동 → journey", instead: [map_causal, stage], situations: [explain, explain-market]}
  afterline: {group: time, does: "시간선 위 사건 표식(붓 금지) → 붉은 '이후' 구간 → 카드가 하나씩 쌓임 → 수량 문구", when: "사건 뒤에도 계속됐다 — 시간 조건과 수량을 한 화면에", not_when: "날짜 간격이 중요 → timeline", instead: [timeline], situations: [explain, explain-market, timeline]}
  spread: {group: number, does: "재료→공정→제품 소품, 두 가격 막대·점선·괄호로 차이, 한쪽 값이 바뀌면 간격이 줄어듦", when: "두 값의 차이가 이름을 가진 개념 (마진·스프레드·괴리)", not_when: "단순 두 숫자 비교 → versus", instead: [versus, bars], situations: [explain, explain-market]}
  share: {group: number, does: "전체 막대 안에 부분이 차례로 채워짐 → 비교 눈금 → 합계 괄호", when: "전체 중 몫, 합치면 기준을 넘나 (매출 비중)", not_when: "사람 비율 → people", instead: [people, parking], situations: [explain, explain-market, ratio]}
  funnel: {group: link, does: 단계마다 줄어드는 깔때기 막대, when: "여러 단계를 거치며 수가 줄어드는 과정 (지원 → 합격, 주문 → 출하)", not_when: "단계가 없는 단순 비교", instead: [bars], situations: []}

  # ───────── 장소·이동
  journey: {group: place, does: 세계 지도 위 경로가 그려지고 핀, when: "어디서 어디로 퍼지고 옮겨 간 이야기 (전파·무역·공급망), 장소 3곳 이상", not_when: "장소가 1~2곳, 한 영상에 5번 이상", instead: [layers, usmap], situations: [route]}
  usmap: {group: place, does: 미국 주별 지도, when: "미국 안 주별 차이·이동", not_when: "나라 단위", instead: [choropleth], situations: [route]}
  choropleth: {group: place, does: 나라별 색칠 지도 + 범례, when: "여러 나라의 값·해당 여부를 한눈에", not_when: "출처 없는 값 (원칙)", instead: [journey], situations: [compare]}

  # ───────── 숫자·크기·변화
  chart: {group: number, does: 실제 시세 선 그래프, when: "주가·지표가 움직였을 때 (실제 데이터)", not_when: "손그림 가짜 그래프가 될 때, 시장 채널의 차트 확대(v31)", instead: [bignum, bars], situations: [metric, rank]}
  bars: {group: number, does: 막대 비교, when: "같은 단위의 값 3~8개 비교, 순위", not_when: "값이 2개 → versus", instead: [versus, isotype], situations: [metric, rank, earnings, compare]}
  bignum: {group: number, does: 큰 숫자 하나 + 비교 기준, when: "기억해야 할 숫자 하나, 말하는 순간 생기는 숫자", not_when: "숫자를 연달아 늘어놓을 때", instead: [versus], situations: [metric, earnings]}
  versus: {group: number, does: 숫자 두 개 맞대기, when: "전과 후, 예상과 실제, A 와 B", not_when: "3개 이상 → bars", instead: [bars, compare], situations: [compare, say-vs-do, earnings]}
  compare: {group: number, does: 세 칸 비교, when: "같은 틀로 2~3가지를 나란히 (과거 사례 비교)", not_when: "숫자 하나 차이만 → versus", instead: [versus], situations: [compare, before-after]}
  isotype: {group: number, does: 사물 아이콘 줄에서 일부가 빠짐, when: "양이 줄었다·늘었다를 물건 수로 (10통 중 3통)", not_when: "정확한 소수점 값", instead: [bars], situations: [ratio]}
  people: {group: number, does: 100명 중 N명 색칠, when: "비율을 사람 수로 느끼게", not_when: "사람이 아닌 대상의 비율 → isotype", instead: [isotype], situations: [ratio, us-link]}
  parking: {group: number, does: 주차칸이 찬/빈 칸으로 비율, when: "점유율·빈자리 비유", not_when: "사람 비율 → people", instead: [people], situations: [ratio]}
  apartments: {group: number, does: 전체·대기·취소 칸 그림, when: "전체 중 대기·취소처럼 세 갈래로 나뉘는 수", not_when: "두 갈래면 people·isotype", instead: [isotype], situations: [ratio]}
  shape: {group: number, does: 숫자 축 없는 모양 개념도 (U자·W자), when: "패턴의 모양이 핵심일 때", not_when: "실제 값이 있을 때 → chart", instead: [chart], situations: []}

  # ───────── 시간
