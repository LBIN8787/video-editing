# 모순 장부 — 서로 반대로 말하는 지침 쌍을 적고 끝까지 관리합니다 (docs/34 §모순 관리, 2026-11-20 사용자 요청).
# 사용자: "모순되는 지침은 없는지 체크하고 주기적으로 이를 관리 할 수 있도록 해줘"
#
# 누가 쓰나: 매일 밤 정기 검토(skills/manual-review §2-1) — 바뀐 지침만 / 7일마다 전체 / 정기 작업 지시문.
# 항목: id · found(찾은 날) · topic(무엇에 대해) · a·b {file, line, text} · current(a|b|unknown, 근거 버전·날짜) · why · fix(고칠 문장 제안)
#       status: open(사용자 판단 필요 → manual-audit 의 '물어볼 것') | decided(답을 decision 에 적음 → '고칠 것') | resolved(고침) | kept(범위가 달라 둘 다 유지, 사용자 확인)
# 낡은 쪽이 분명하면(더 새 버전·날짜의 매뉴얼 규칙이 대체) 바로 고치고 resolved 로 적습니다. 사용자 원문(feedback·reviews·인용)은 고치지 않습니다.
# 정기 작업(예약된 작업) 지시문은 저장소 밖에 있으므로 file 에 "schedule:<작업 이름>" 으로 적습니다.
