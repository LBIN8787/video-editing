# 매뉴얼 관리 — 한 번에 한 명만 고친다 (2026-11-15 사용자: "매뉴얼 작성을 이 에이전트 저 에이전트 중복해서 수정하지 않도록,
#   깃 수정 등 파일관리는 한번에 한명만")
# 2026-11-16 바꿈 — 정해진 담당 없음. 고칠 때만 잠그고 순서대로, 잠겨 있으면 요청.
#   사용자: "담당 세션이 하는게 아니라 그냥 순차적으로 서로 메뉴얼 관리할때만 잠금하고 잠금도중에 누군가 사용하려하면 그냥 요청하면 되는거 아니야?"
#   "바뀐 메뉴얼을 바탕으로 또 다음메뉴얼이 작성되기도 하는데 지금은 텀이 너무 길잖아"
# 설명: docs/35-manual-ownership.md

lock:                          # 지금 매뉴얼을 고치고 있는 한 명 — 원격 브랜치 'locks' 의 manual-lock.json
  branch: locks
  file: manual-lock.json
  hours: 2                     # 짧게. 다 고치면 main 에 합치고 바로 release. 세션이 끊겨도 2시간 뒤 저절로 풀림 (길면 acquire 다시 = 연장)

# 순서: acquire(잡자마자 main 합침) → 고치기 → push·PR 로 main 에 합치기 → release(main 에 안 합친 매뉴얼 변경이 있으면 거절)
# 잠겨 있으면: python -m ytflow manual-lock request "내용" → 풀리면 직접 acquire 하거나, 잡은 쪽이 처리

protected:                     # 잠금을 가진 쪽만 고침 (glob). 저장소 전체로 넓히려면 "**" 한 줄
  - manual/**
  - topics/**
  - styles/techniques.yaml
  - styles/recipes/**
  - skills/**
  - .claude/skills/**
  - .agents/skills/**
  - AGENTS.md
  - CLAUDE.md
  - ytflow/stages/checklist.py
  - ytflow/stages/audit.py
  - ytflow/stages/manualgraph.py
  - ytflow/stages/governance.py
  - .githooks/**
  - .claude/settings.json

open:                          # 병렬로 고쳐도 되는 곳 (보호 범위 안이라도 이것은 열림)
  - proposals/**               # 제안함 — 파일 하나 = 제안 하나 (이름이 겹치지 않아 충돌 없음)
  - manual/graph.json          # 생성물 — 잠금을 가진 쪽만 다시 만들도록 명령이 막지만, 커밋 충돌을 피하려 열어 둠

# 잠금이 없는 에이전트: 영상·렌더러·자료는 각자 브랜치에서 계속. 매뉴얼을 고칠 일이 생기면 그때 acquire.
# 급하지 않은 것은 python -m ytflow manual-propose "내용" [--kind feedback|review|fix|rule] [--project 프로젝트]
# → proposals/manual/<시각>-<브랜치>.md (다음에 잠금을 잡는 세션·정기 검토가 반영).
# review·feedback 명령도 잠금이 없으면 자동으로 제안함에 쓴다.
