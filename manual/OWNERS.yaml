# 매뉴얼 관리 — 한 번에 한 명만 고친다 (2026-11-15 사용자: "매뉴얼 작성을 이 에이전트 저 에이전트 중복해서 수정하지 않도록,
#   깃 수정 등 파일관리는 한번에 한명만. 병렬로 작업하는 경우가 분명히 생길텐데 모두가 수정하면 관리가 엉망이 된다")
# 결정: 담당자 1명 + 잠금 (둘 다), 보호 범위 = 매뉴얼과 규칙 파일. 설명: docs/35-manual-ownership.md
#
# 이 파일을 바꾸는 것도 담당자(잠금을 가진 쪽)만.

steward:                       # 매뉴얼 담당 — 평소에 매뉴얼을 쓰는 단 한 명
  name: 매뉴얼 담당 (매일 밤 정기 검토 세션)
  branch: ccr-a5c429db-8v4dhx  # 담당 세션의 작업 브랜치. 담당이 바뀌면 사용자가 정하고 여기를 고침
  session: session_01UfDwTiiuaTLz5eLQbhxdoK

lock:                          # 지금 매뉴얼을 쓰고 있는 한 명 — 원격 브랜치 'locks' 의 manual-lock.json
  branch: locks
  file: manual-lock.json
  hours: 26                    # 잠금 유효 시간 — 담당은 매일 밤 정기 검토 때 다시 잡음 (지나면 다른 세션이 사용자 허락 아래 잡을 수 있음)

protected:                     # 잠금을 가진 쪽만 고침 (glob). 저장소 전체로 넓히려면 "**" 한 줄
  - manual/**
  - topics/**
  - styles/techniques.yaml
  - styles/recipes/**
  - skills/**
  - .claude/skills/**
  - .agents/skills/**
  - AGENTS.md
  - CLAUDE.md
  - ytflow/stages/checklist.py
  - ytflow/stages/audit.py
  - ytflow/stages/manualgraph.py
  - ytflow/stages/governance.py
  - .githooks/**
  - .claude/settings.json

open:                          # 병렬로 고쳐도 되는 곳 (보호 범위 안이라도 이것은 열림)
  - proposals/**               # 제안함 — 파일 하나 = 제안 하나 (이름이 겹치지 않아 충돌 없음)
  - manual/graph.json          # 생성물 — 담당만 다시 만들도록 명령이 막지만, 커밋 충돌을 피하려 열어 둠

# 담당이 아닌 에이전트가 할 일: 영상·렌더러·자료는 각자 브랜치에서 계속.
# 매뉴얼에 넣고 싶은 것(사용자 피드백·검토·새 기준·고칠 곳)은
#   python -m ytflow manual-propose "내용" [--kind feedback|review|fix|rule] [--project 프로젝트]
# → proposals/manual/<시각>-<브랜치>.md 로 남기면 담당이 다음 정기 검토에서 반영한다.
# review·feedback 명령도 담당이 아니면 자동으로 제안함에 쓴다.
