# 영상이 말한 '볼 것'을 실제로 지켜보는 목록 (2026-11-22 사용자: "각 영상들의 주목해야 할 체크리스트들 이걸 실제로 주시해주세요")
# 쓰는 곳: ytflow/stages/daily.py → daily_brief.md '⑥-3 영상 신호 점검' (매일 아침), config/local_routines/market-daily.md 의 점검 단계.
# 규칙:
#  - 신호마다 지금 값(baseline)과, 움직이면 어느 쪽을 가리키는지(means)를 적어 둔다. 영상에서 말한 그대로.
#  - 뉴스 검색은 '단서'. 값이 바뀌었다고 쓰려면 1차 출처(공시·실적 자료·회사 발표·TrendForce 원문)로 확인한다.
#  - 움직임을 확인하면 inbox/signals/log.md 에 한 줄(날짜·신호·새 값·출처·어느 쪽을 가리키나)을 남기고,
#    그날 브리핑 소재·후속편·고정 댓글 정정 후보로 올린다. 아무 일 없으면 적지 않는다.
#  - 날짜가 있는 신호(due)는 그날이 지나면 결과를 적고 status: done 으로 바꾼다.
#  - 새 시장 영상을 올리면 그 영상의 '다음 소식을 읽는 …'·'이 해석이 틀리는 경우'를 여기에 더한다.

videos:
  ai-chips:     {title: "AI 칩·메모리 하강 원리 (심층)", youtube: 1_AcJrrHOc0, project: 20261121-market-deep-ai-chips}
  memory:       {title: "메모리 값 4배, 그런데 주가는 폭락? (후속, 미공개)", youtube: "", project: 20261122-market-deep-memory-chicken}
  nvidia:       {title: "엔비디아 순환금융 (심층, 미공개)", youtube: "", project: 20261122-market-deep-nvidia-circular}
  weekly-1123:  {title: "11월 3주차 주간 종합", youtube: iOKBizNcBb8, project: 20261122-market-weekly}

signals:
  # ── 메모리 사이클 (ai-chips · memory) ──
  - id: nand-contract
    from: [ai-chips, memory]
    what: 낸드 계약가 방향 (TrendForce 분기 전망)
    baseline: "2026.11.19 TrendForce — 낸드 계약가 내년 1분기부터 하락 전망"
    means: "하락 폭이 커지면 '흔한/깊은 하강' 쪽, 전망이 상향되면 '얕은 하강' 쪽"
    q: "TrendForce NAND contract prices"
  - id: dram-contract-spot
    from: [memory]
    what: D램 계약가·현물가 (계약은 오르는데 현물이 먼저 빠지나)
    baseline: "최근 한 달 현물 D램 -5%, 낸드 -20% (KB증권, 2026.11.20 보도) · KB 내년 D램 계약가 +40% 전망"
    means: "현물 하락이 이어지고 계약가 전망이 꺾이면 '갈라진 시장'의 범용 쪽이 먼저 꺾이는 그림"
    q: "DRAM spot price TrendForce"
  - id: ltA-renegotiation
    from: [ai-chips, memory]
    what: 장기 계약 재협상·취소 소식 (메모리 고객 쪽)
    baseline: "마이크론 2027 물량 75%+ · SK하이닉스 2027~28 생산능력 절반+ 장기 계약 (회사 발표)"
    means: "재협상·물량 조정 보도가 나오면 공급 과잉이 고객 창고에 나타나기 시작한 첫 신호"
    q: "memory long-term agreement renegotiate DRAM customers"
  - id: micron-gm
    from: [ai-chips]
    what: 마이크론 분기 총이익률 (지금 87%)
    baseline: "87% (직전 분기, 2018년 분기 꼭대기 61%)"
    means: "조금 내려오면 '얕은 하강', 크게 내려오면 '흔한/깊은 하강'"
    due: "2026-12-18"   # 미국 12.17(목) 14:30 MT = 한국 18일 아침 (회사 발표 2026.11.19)
    q: "Micron earnings date gross margin"
    ticker: MU
  - id: cut-utilization
    from: [memory]
    what: 메모리 회사가 감산·가동률을 말하나
    baseline: "지금은 증설 쪽 (SK하이닉스 웨이퍼 5년 2배 — 최태원), 감산 언급 없음"
    means: "감산·가동률 조정 언급 = 하강 인정. 늦을수록 하강이 깊었던 게 과거 패턴"
    q: "삼성전자 SK하이닉스 감산 가동률"
    lang: ko
  - id: china-capex
    from: [memory]
    what: 중국 메모리 업체 증설 (CXMT·YMTC)
    baseline: "보도 기준 증설 진행 중 (수치는 1차 출처 확인 필요)"
    means: "값이 내려도 증설을 이어 가면 '정부가 받치는 공급' → 하강이 길어짐"
    q: "CXMT YMTC capacity expansion"
  - id: share-vs-margin
    from: [memory]
    what: 실적 발표에서 '점유율'을 말하나 '수익성'을 말하나
    baseline: "지금은 수익성·장기 계약 중심 표현"
    means: "점유율을 강조하기 시작하면 치킨 게임 재개 신호"
    q: "memory maker market share strategy Samsung SK hynix Micron"
  - id: dram-lawsuit
    from: [memory]
    what: 미국 D램 담합 집단소송 (삼성·SK하이닉스·마이크론이 2022년 말부터 범용 D램 생산을 함께 조였다는 주장)
    baseline: "2026.11.14 캘리포니아 북부 연방법원(노엘 와이즈 판사) 기각 신청 거부 → 소송 진행. 위법이라는 판단은 아님"
    means: "증거 공개 단계로 가면 '감산은 각자 판단'이라는 영상 설명(2023 감산)에 반론 자료가 나올 수 있음 — 판결 전까지 단정 금지"
    q: "DRAM antitrust class action Samsung SK hynix Micron"
  - id: gpu-rent
    from: [ai-chips]
    what: GPU 임대료 (H100·B200 시간당)
    baseline: "오르는 중 — Silicon Data H100 지수 시간당 2.88달러(2026.10.24, 2025.12 2.00달러) · 코어위브 3분기 콜: 호퍼·암페어 가격 전 분기보다 30~50% 상승(2026.11.10)"
    means: "임대료가 빠지면 칩이 남기 시작한 것 → AI 쪽 수요 꺾임의 선행 신호"
    q: "GPU rental price H100 per hour index"

