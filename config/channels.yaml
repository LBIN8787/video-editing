# 벤치마킹 대상 채널.
# url 은 채널 페이지 주소(@핸들)입니다. 채널을 추가하면 weight 합이 1 이 되도록 맞춰 주세요.
channels:
  - name: 식스시그마
    role: primary          # primary = 편집/대본 스타일의 기준 채널
    url: "https://www.youtube.com/@식스시그마"
    weight: 0.7
  - name: AI비즈PT
    role: reference
    url: "https://www.youtube.com/@AIBizPT"
    weight: 0.3
  - name: 미주일기
    role: style            # style = 편집 스타일(화면·움직임) 기준. 대본 통계에는 넣지 않음
    url: "https://www.youtube.com/@mijudiary"
    weight: 0
    # 내려받은 레퍼런스 영상 파일 경로 (있으면 benchmark 때 'ytflow style' 분석을 함께 실행)
    reference_videos: []
  # 로제타: 채널 주소가 확인되면 주석을 풀고 weight 를 다시 나눠 주세요.
  # - name: 로제타
  #   role: reference
  #   url: "https://www.youtube.com/@CHANGE_ME_rosetta"
  #   weight: 0.2

# 채널마다 분석할 최근 영상 수 / 그중 상세 분석(자막·컷)할 상위 아웃라이어 수
recent_videos: 40
deep_dive_top: 6
shorts_max_seconds: 70     # 이 길이 이하면 쇼츠로 보고 롱폼 통계에서 분리
