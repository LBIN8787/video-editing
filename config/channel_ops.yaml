# 채널 운영·분석 (python -m ytflow ops, docs/63-channel-ops.md)
# 2026-11-23 사용자: "앞으로 내 채널은 네가 운영하고 네가 분석하길 바래"
# 운영하는 유튜브 채널마다: 저장소의 채널 폴더 + 권한 이름(ytpublish.creds: 비어 있으면 기본 YT_*, 아니면 YT_*_<이름>)

channels:
  market:
    dir: ch-market-daily        # 이어 읽는 시장 @이어읽는시장
    credentials: ""
  curiosity:
    dir: ch-knowledge           # 한 겹 더 보면 @한겹더보면
    credentials: knowledge

# 올린 뒤 살펴보는 시점 (시간). 판정은 고정 숫자가 아니라 같은 채널의 같은 나이 영상과 견줌 (manual README §5)
checkpoints_h: [24, 48, 168]
# 같은 채널 중앙값의 몇 배면 '앞섬'·'처짐'으로 표시할지 — 표시용일 뿐 합격선이 아님
outlier_ratio: 2.0
laggard_ratio: 0.5
