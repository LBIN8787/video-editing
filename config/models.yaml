# 모델 티어 — 판단은 최상위, 복잡한 일은 중간, 간단한 일은 가벼운 모델
# 2026-11-22 사용자: "판단 가장 중요한 판단이 들어가는 부분 판단부분은 fable이 복잡한 일은 opus 간단한 일은 sonnet입니다.
#   다른 프론티어 모델들도 이런식으로 티어가 나뉘는데 모델 이름과 버전만 다르다는 느낌으로 하려구요"
# (앞 말: "fable5.2가 sonnet5.5랑 opus5.5를 오케스트레이션 했으면 해 물론 모델이 새로 나오면 이도 재 설정하고")
#
# 티어는 제공사와 상관없이 셋 — 일은 티어에 맡기고(tasks), 티어마다 어느 모델인지는 제공사별 표(providers)에서 바꿉니다.
#   judge   판단: 무엇을 만들지·어느 쪽이 맞는지·통과인지 정하는 일, 일 나누기(지휘), 사용자에게 올리는 결정 정리, **원고·대본 쓰기**(대본이 1순위)
#   complex 복잡한 일: 길고 여러 조건을 함께 지켜야 하는 제작 — 대본 근거 검수표·구성요소 대조표(쓴 모델과 다른 눈으로), 레퍼런스 분석, 장면표·연출 설계, 영상 검수 대조
#   simple  간단한 일: 범위가 분명한 실무 — 자료 수집·요약·목록 뽑기·옮겨 적기·렌더·캡처·자막
# 2026-11-22 사용자: "그냥 opus로 세션진행하고 fable은 중요할때만 호출하게 해보세요" → judge 도 Opus. Fable 은 .claude/agents/fable.md 로 중요한 판단에만.
# 쓰는 곳: ytflow/llm.py (claude-cli·api → anthropic, codex-cli → openai) · .claude/agents/{senior,worker}.md
# 새 모델이 나오면: providers 의 이름만 바꾸고 checked 날짜를 고친다 (정기 검토가 30일마다 묻는다).
# 2026-11-27 사용자: "판단이 필요한 부분이 아니라 단순 작업은 소넷이 판단이 필요하면 작업은 opus 종합적인 검수가 필요한 부분은 페이블이 계층적으로 판단의 중요성에 따라서 이를 나누어줘"
#   → 세 층: simple(Sonnet, 판단 없는 단순 작업) · judge/complex(Opus, 판단이 필요한 작업) · review(Fable, D2·D4 직전 종합 검수 — .claude/agents/fable.md)
checked: '2026-11-27'
tiers:
  judge:   {label: 판단, effort: high}
  complex: {label: 복잡한 일, effort: high}
  simple:  {label: 간단한 일, effort: high}
  review:  {label: 종합 검수, effort: high}   # 파이프라인 단계에는 쓰지 않음 — fable 에이전트로만
providers:
  anthropic:
    judge:   {model: claude-opus-5-5, cli: opus}   # 2026-11-22 사용자: "오푸스로 바꿔주세요" (Fable 소모량 감당이 어려움) — 여유가 생기면 claude-fable-5-2 / fable 로
    complex: {model: claude-opus-5-5, cli: opus}
    simple:  {model: claude-sonnet-5-5, cli: sonnet}
    review:  {model: claude-fable-5-2, cli: fable}
  openai:    # Codex — 비워 두면 Codex 기본 모델. 티어에 맞는 모델 이름을 사용자가 정해 채움
    judge:   {model: ""}
    complex: {model: ""}
    simple:  {model: ""}
    review:  {model: ""}
# 2026-11-27 사용자: "기계적인 단계는 소넷으로 작업하는게 현재 아니야? 아니라면 소넷으로 설정해줘"
#   → LLM 호출이 아닌 기계적 단계(렌더·캡처·자막·음성 자르기·파일 정리·Drive 올리기)는 메인이 직접 하지 않고 worker(simple 티어, Sonnet)에게 넘긴다 (manual/11 §1-1).
# ytflow 파이프라인 단계 → 티어 (없는 단계는 default)
tasks:
  default: complex
  topic_select: judge      # 어느 주제로 갈지 고름
  insights: simple         # 인사이트 수집: 제목 거르기·자막에서 판단 문장 뽑기 (docs/70)
  scout: judge             # 소스가 강한 주제·형식 판단
  shorts_pick: judge       # 쇼츠 소재 고름
  package: judge           # 제목·썸네일 문구 고름 (무엇이 눌릴지 판단)
  article: judge           # 원고 — 대본이 1순위 (2026-11-22 사용자: "대본쓰기의 경우 매우 중요한데")
  script: judge            # 대본 — 가장 중요한 일이라 판단 티어가 직접 씀. 근거 검수표는 complex 가 따로(쓴 쪽과 검수하는 쪽을 나눔)
  script_fix: judge        # 대본 고치기
  shorts_script: judge
  benchmark: complex       # 레퍼런스 대본 규칙 분석
  style_rules: complex     # 레퍼런스 장면 시트 분석
  research: simple         # 자료 수집 (근거 검수는 따로 — 13 §4-1)
  articles: simple         # 기사 목록 옮겨 적기
  shorts_facts: simple
