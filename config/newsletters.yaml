# 재사용 조건 — 도메인 → 한 줄 (없으면 '보도·글: 단서만, 인용은 짧게 출처 표시')
reuse:
  ourworldindata.org: "CC BY — 출처 표시하면 재사용. 차트 속 다른 기관 자료는 그 기관 조건. 원자료(CSV)로 다시 그리기 권장"
  pewresearch.org: "출처 표시하고 인용·다시 그리기. 차트 이미지를 그대로 쓰지 않기"
  loc.gov: "항목마다 rights 확인 (archive.py 가 'copyright' 표기는 거름)"
