  si.edu: "CC0 표시된 것만 (archive si 가 CC0 만 고름)"
  commons.wikimedia.org: "파일마다 라이선스 — PD·CC0·CC BY 만 (archive commons)"
  publicdomainreview.org: "그림 원본은 대부분 PD, 사이트 글은 저작물 — 원본 소장처 링크에서 받기"
