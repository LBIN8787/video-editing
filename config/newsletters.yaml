# 뉴스레터 — 소스 탐색·참조용 (2026-11-15 사용자: 무료 뉴스레터 구독, 채널별로 소재를 나눠 쌓기)
# 쓰는 곳: ytflow/stages/newsletters.py, 설명 docs/36-newsletters.md
#
# 뉴스레터는 '단서'입니다. 문장을 대본·화면에 옮기지 않고, 영상에 넣을 숫자·발언은 링크를 따라 1차 출처로 확인합니다.
# match: 보낸 사람 주소(또는 표시 이름)에 들어 있는 글자 — 하나라도 맞으면 이 뉴스레터
# subject: (선택) 제목 정규식 — 같은 보낸 사람이 여러 뉴스레터를 보낼 때 (TLDR AI / TLDR Tech)
# brands: 이 뉴스레터 소재가 기본으로 갈 채널 (market·ai·curiosity·issues). 여러 개면 소재마다 낱말로 나눔
# arrives: 한국 시간 대략 도착 시각 (구독 1주 뒤 실제 시각으로 고치기) — 06:05 아침 제작에 쓸 수 있나 판단
# status: subscribed(구독함) · planned(구독 예정) · blocked(가입 막힘 — 사람이 휴대폰에서)

sources:
  # ── 시장 ──
  - {id: axios, name: Axios (Markets·Closer), match: [axios.com], brands: [market, issues], cadence: 평일, arrives: "장 마감 판이면 06~07시 / 아침 판은 전날 밤", status: subscribed}
  - {id: dailyupside, name: The Daily Upside, match: [thedailyupside.com], brands: [market], cadence: 평일, arrives: "전날 밤 (배경·심층용)", status: subscribed}
  - {id: uppity, name: 어피티 머니레터, match: [uppity.co.kr], brands: [market, issues], cadence: 평일 아침, arrives: "07시 전후", status: subscribed}
  - {id: kdi, name: KDI 경제정보센터, match: [kdi.re.kr], brands: [market, issues], cadence: 수시, arrives: 수시, status: planned}
  - {id: bloomberg, name: Bloomberg 아침 판, match: [bloomberg.com, bloomberg.net], brands: [market], cadence: 평일, arrives: "확인 필요", status: blocked}
  - {id: wsj, name: WSJ The 10-Point, match: [wsj.com, dowjones.com], brands: [market, issues], cadence: 평일, arrives: "확인 필요", status: blocked}
  # ── AI ──
  - {id: tldr-ai, name: TLDR AI, match: [tldrnewsletter.com, tldr.tech], subject: "(?i)TLDR AI", brands: [ai], cadence: 평일, arrives: "21시 전후", status: subscribed}
  - {id: tldr-tech, name: TLDR Tech, match: [tldrnewsletter.com, tldr.tech], subject: "(?i)^(?!.*TLDR AI)", brands: [ai, market], cadence: 평일, arrives: "21시 전후", status: subscribed}
  - {id: batch, name: The Batch (DeepLearning.AI), match: [deeplearning.ai], brands: [ai], cadence: 주간, arrives: 수시, status: planned}
  - {id: simonw, name: Simon Willison (블로그 RSS), rss: "https://simonwillison.net/atom/everything/", brands: [ai], cadence: 수시, arrives: RSS, status: subscribed}
  # ── 호기심 ──
  - {id: quanta, name: Quanta Magazine, match: [simonsfoundation.org, quantamagazine.org], brands: [curiosity], cadence: 주간, arrives: 수시, status: subscribed}
  - {id: aeon, name: Aeon, match: [aeon.co], brands: [curiosity], cadence: 주간, arrives: 수시, status: subscribed}
  - {id: jstor, name: JSTOR Daily, match: [jstor.org], brands: [curiosity, issues], cadence: "주간(목)", arrives: 수시, status: planned}
  - {id: pdr, name: The Public Domain Review, match: [publicdomainreview.org], brands: [curiosity], cadence: 격주, arrives: 수시, status: subscribed}
  # ── 시사 (+ 데이터) ──
  - {id: owid, name: Our World in Data Brief, match: [ourworldindata], brands: [issues, curiosity, market], cadence: "월 2회", arrives: 수시, status: subscribed}
  - {id: pew, name: Pew Research Center, match: [pewresearch.org], brands: [issues, curiosity], cadence: 주간, arrives: 수시, status: subscribed}
  - {id: newneek, name: 뉴닉, match: [newneek.co], brands: [issues], cadence: 평일, arrives: "07시 전후", status: blocked}

# 소재마다 채널을 나눌 때 쓰는 낱말 (뉴스레터의 brands 가 여러 개일 때만). 소문자로 비교
route:
  market: [stock, shares, earnings, revenue, guidance, fed, rate, inflation, cpi, bond, yield, ipo, tariff, nasdaq, s&p, dow, oil, dollar, valuation, investor, 주가, 증시, 실적, 금리, 물가, 환율, 코스피, 투자, 매출, 관세, 연준]
  ai: [" ai ", "ai,", "ai.", "ai's", llm, gpt, claude, gemini, openai, anthropic, model, agent, chatbot, neural, 인공지능, 에이전트]
  issues: [election, court, law, policy, war, government, congress, senate, poll, survey, protest, 정책, 정부, 국회, 선거, 법원, 전쟁, 여론]
  curiosity: [history, ancient, brain, physics, math, universe, species, evolution, why, 역사, 우주, 뇌, 진화]

