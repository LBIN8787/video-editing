# 재사용 조건 — 도메인 → 한 줄 (없으면 '보도·글: 단서만, 인용은 짧게 출처 표시')
reuse:
  ourworldindata.org: "CC BY — 출처 표시하면 재사용. 차트 속 다른 기관 자료는 그 기관 조건. 원자료(CSV)로 다시 그리기 권장"
  pewresearch.org: "출처 표시하고 인용·다시 그리기. 차트 이미지를 그대로 쓰지 않기"
  loc.gov: "항목마다 rights 확인 (archive.py 가 'copyright' 표기는 거름)"
  images.nasa.gov: "대체로 퍼블릭 도메인 — NASA 로고·사람 얼굴 광고성 사용 금지"
  nasa.gov: "대체로 퍼블릭 도메인 — 제3자 사진은 예외, 항목 확인"
  si.edu: "CC0 표시된 것만 (archive si 가 CC0 만 고름)"
  commons.wikimedia.org: "파일마다 라이선스 — PD·CC0·CC BY 만 (archive commons)"
  publicdomainreview.org: "그림 원본은 대부분 PD, 사이트 글은 저작물 — 원본 소장처 링크에서 받기"
  archive.org: "항목마다 권리 표기 확인"
  sec.gov: "공문서 — 인용 자유, 출처 표시"
  federalreserve.gov: "공문서 — 인용 자유, 출처 표시"
  dart.fss.or.kr: "공시 원문 — 인용·캡처 시 출처 표시"
  arxiv.org: "논문마다 라이선스 — 그림은 확인 후, 인용은 짧게"
  github.com: "저장소 라이선스 확인, 화면 캡처는 출처 표시"
  youtube.com: "남의 영상 — 원본 발언 짧게, 출처 표시 (source-cut 기준)"

