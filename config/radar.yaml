# 원본 레이더 — 사람의 말(원본 영상)·큰 날(사건)을 매일 추적 (2026-11-23 사용자: "우리도 사람의 말이나 사건형 원본형처럼 이를 추적할 수 있었으면")
# 쓰는 곳: ytflow/stages/radar.py → inbox/radar/<날짜>.md · tracker.json. 설명: docs/63-source-radar.md
# 사람 목록은 config/ceo_watch.yaml 의 ceos 를 그대로 씀 (여기서는 무게·별칭만 더함).
# 레이더가 찾는 것은 '단서'. 영상에 쓰는 발언은 원본 영상·공식 기록에서 직접 확인 (manual/09 §3-4·§3-5).

window_days: 9            # 원본형: 공개 뒤 2~9일 안에 해설이 가장 많이 붙음 (식스시그마·월가인사이드 관찰, PLAN §6)
event_move_pct: 3.0       # 사건형: 지수가 이만큼 넘게 움직인 날 = '큰 날'
event_indices: ["^SOX", "^IXIC", "^GSPC", "^KS11", "^KQ11"]

# 사람의 무게 (조회 잠재력). 없으면 2. 근거: docs/55 인물 해설 영상 배수, 이번 주 벤치마크(드러켄밀러 28만·손정의 22만)
weight:
  젠슨 황: 3
  일론 머스크: 3
  워런 버핏: 3
  스탠리 드러켄밀러: 3
  샘 올트먼: 3
  빌 게이츠: 3
  마이클 버리: 3
  케빈 워시: 3
