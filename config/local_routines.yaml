# 로컬(이 PC) 정기 작업 — Windows 작업 스케줄러가 시각마다 scripts/local_routine.py <작업> 을 실행 (docs/56-local-routines.md)
# 2026-11-21 사용자: "시장 자동화도 로컬에서 돌 수 있도록 세팅해주고 매번 클라우드라서 막혔니 뭐니 말이 너무 많아서"
#                    "시장 관련 자동화처럼 호기심 채널도 자동화 세팅해줘" · "작업파일은 c드라이브에 두지 말고 구글드라이브에 보관해줘"
# 시각은 한국 시간(이 PC 시계). 바꾸면 설치 스크립트를 다시 실행: powershell -ExecutionPolicy Bypass -File scripts\install_local_routines.ps1
# 지시문(prompt)은 실행할 때마다 origin/main 에서 새로 읽으므로, 지시문만 고칠 때는 다시 설치할 필요 없음.

jobs:
  market-daily:
    title: "이어 읽는 시장 — 매일 아침 영상"
    time: "08:00"               # 영상 공개 10:00 (manual/09). 전날 미국 장 마감 뒤 실적·어닝콜까지 보려고 08:00 시작
    prompt: config/local_routines/market-daily.md
    timeout_min: 240
  curiosity:
    title: "한겹 더 보면 — 호기심 채널 진행"
    time: "07:00"               # 진행 중인 편을 다음 사용자 결정(D1~D4)까지 밀고, 없으면 새 주제 카드 (주 1편)
    prompt: config/local_routines/curiosity.md
    timeout_min: 180
  channel-ops:
    title: "채널 운영·분석 — 두 채널 수치 → 해석 → 다음 편에 하나"
    time: "22:10"               # 시장 08:30·호기심 18:00 공개 뒤 수치가 쌓인 시각. 2026-11-23 사용자: "앞으로 내 채널은 네가 운영하고 네가 분석하길 바래"
    prompt: config/local_routines/channel-ops.md
    timeout_min: 90
  market-deep-watch:
    # 2026-11-24 사용자: "분석영상을 꼭 특정시간마다 업로드보다는 소재가 생기면 업로드 할 수 있도록" →
    #   선택: 2시간마다 감시 · 소재 생길 때만(매일 고정 심층 없음) · "완성 즉시 공개하고 검수와 분석영상을 제작할지 제작할만한 내용인지의 판단은 fable이 해주세요"
    title: "이어 읽는 시장 — 심층 소재 감시 (2시간마다)"
    time: "00:40"               # 첫 차례. repeat_hours 마다 다시 (앱 예약 cron '40 */2 * * *')
    repeat_hours: 2
    wait_for: [market-daily]    # 아침 브리핑이 도는 동안은 건너뜀 (PC·목소리 크레딧을 나눠 쓰지 않음)
    quiet_skip: [scan, judge]   # 이 단계에서 멈추면(새 소재 없음·안 만듦) 알림·보고 파일 없이 로그 한 줄만
    # 2026-11-24 사용자: "소재 감시는 당연히 sonnet이 하시구요" — 2시간마다 훑기는 Sonnet, 만들지 판단·검수는 Fable (후보가 있을 때만)
    steps:
      - {name: scan,   prompt: config/local_routines/deep-watch-scan.md,   model: claude-sonnet-5-5, timeout_min: 30}
      - {name: judge,  prompt: config/local_routines/deep-watch-judge.md,  model: claude-fable-5-2, timeout_min: 40}
      - {name: make,   prompt: config/local_routines/deep-watch-make.md,   timeout_min: 200}
      - {name: review, prompt: config/local_routines/deep-watch-review.md, model: claude-fable-5-2, timeout_min: 90}
