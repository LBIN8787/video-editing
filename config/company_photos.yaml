# 브리핑 썸네일용 기업 사진 모음 (manual/09 §7-1 ⑬, 2026-11-25 사용자: "흑백으로 핵심 기업을 썸네일에 넣고 브리핑은 분석은 인물 등을 하는건 어떻죠?")
# 위키미디어 공용 PD·CC0·CC BY 만 (CC BY-SA·뉴스 사진 안 됨). 어느 회사인지 보이는 것(간판·로고 건물·대표 제품)만 넣는다.
# 회사마다 3~5장이 목표 — 같은 회사가 연이어 나와도 바로 앞 편과 다른 사진을 쓰기 위해 (§7-1 ⑪).
# 사진이 없거나 모자라면: python -m ytflow company-photo find "<검색어>" → 눈으로 보고 → company-photo add <회사> "File:…" --note "…"
# 이미지 파일은 Git 에 두지 않음 — 쓸 때 내려받아 프로젝트 04_assets/footage/raw/co_<회사>_<n>.jpg (Drive 가 있으면 cache/company_photos 에 보관)
