channel_niche: "주식시장 중심의 투자·기술·기업 해설 (얼굴 없는 내레이션형). 기업의 돈 흐름·실적·지분·기술 경쟁을 숫자와 공시로 풀어 투자자 관점의 큰 그림을 보여 준다. 종목 추천·매수 권유는 하지 않는다."
language: ko

llm:
  backend: claude-cli     # claude-cli = Claude 구독(claude -p) 사용, API 키 불필요
                          # codex-cli  = ChatGPT 구독(codex exec) 사용, API 키 불필요
                          # api        = Anthropic API (ANTHROPIC_API_KEY 필요)
                          # manual     = 에이전트가 .llm/requests 를 읽고 직접 답함 (docs/04-agents.md)
                          # 환경변수 YTFLOW_LLM_BACKEND 가 있으면 그 값이 우선
  cli_model: opus         # claude-cli 백엔드에서 쓸 모델 별칭
  codex_model: ""         # codex-cli 백엔드 모델 (비우면 Codex 기본값)
  model: claude-opus-5-5  # 이하 api 백엔드 설정
  effort: high            # low | medium | high | xhigh | max
  fallbacks: true         # 안전 분류기 거절 시 서버측 대체 모델로 재시도

discover:
  seed_keywords: ["엔비디아", "AI 반도체", "빅테크 실적", "미국 주식", "반도체 주가", "삼성전자 SK하이닉스", "기업 지분 투자", "데이터센터 투자"]
  search_per_keyword: 25  # 키워드당 검색 결과 수 (최신순)
  deep_check_top: 15      # 구독자 대비 조회수(아웃라이어) 계산할 상위 후보 수
  min_outlier: 2.0        # 조회수 / 구독자수 기준 하한
  rss_feeds: []           # 뉴스 RSS 주소 (선택)

script:
  target_minutes: 9
  chars_per_minute: 260   # 2026-11 벤치마킹 측정값. 스타일 프로필 값이 있으면 그 값을 우선 사용

tts:
  backend: edge           # edge | manual | placeholder
                          #  manual = 직접 녹음한 03_voice/scene_XXX.wav 사용
                          #  placeholder = 글자 수로 길이만 맞춘 무음 (흐름 확인용 애니매틱)
  voice: ko-KR-InJoonNeural
  rate: "+8%"

edit:
  style: sixsigma             # sixsigma(검은 배경 미니멀) | paper(종이 질감 손그림 애니메이션)
                              # 프로젝트마다 바꾸려면 projects/<프로젝트>/edit.yaml 에 "edit: {style: paper}"
  # 아래 기본값은 sixsigma 기준: 검은 배경 · 흰 글씨 · 빨간 강조 · 줌/BGM 없음
  width: 1920
  height: 1080
  fps: 30
  font: "Noto Sans CJK KR"   # 자막 폰트 이름 (윈도우는 "Malgun Gothic" 도 가능)
  subtitle_size: 50
  subtitle_chars: 28          # 자막 한 줄 최대 글자 수
  emphasis_color: "&H002C40E8"   # ASS BGR 형식 = #E8402C (빨강)
  logo_text: ""               # 화면 오른쪽 위 채널 로고 글자 (예: "6σ")
  theme:                      # 인포 카드 색
    bg: "#000000"
    fg: "#FFFFFF"
    muted: "#9A9A9A"
    accent: "#E8402C"
    line: 3
  bgm: ""                     # 벤치마크 채널은 배경음악 없음
  bgm_volume: 0.10
  kenburns: false             # 정지 이미지 줌 (벤치마크 채널은 쓰지 않음)
  card_font: ""               # 카드용 한글 폰트 파일 경로 (비우면 자동 탐색)

styles:
  paper:                      # 미주일기 화면 분석 기준 (docs/03 '종이 스타일')
    font: "NanumGothic"
    subtitle_size: 44
    subtitle_box: true        # 자막 뒤 반투명 어두운 상자
    emphasis_color: "&H0066D9FF"   # 자막 강조 = 연노랑 #FFD966
    label_position: bottom_right
    paper:
      base: "#EEE7DA"         # 종이색
      ink: "#22304D"          # 남색 잉크
      red: "#C4452F"          # 빨간 펜
      anim_seconds: 1.2       # 장면 등장 애니메이션 길이

trends:
  window_hours: 48            # 이 시간 안의 기사·게시물만 '최신'으로 본다
  hackernews: true
  x_api: true                 # X API v2 (키가 있을 때만 동작: 환경변수 X_BEARER_TOKEN 또는 환경 네트워크 시크릿)
  x_accounts: ["nvidia", "SKhynix", "Samsung", "elonmusk", "sama", "satyanadella", "sundarpichai", "tim_cook", "AnthropicAI", "OpenAI"]
  english_keywords:           # 한국어 키워드의 영어 검색어 (해외 매체·HN·X 검색용)
    엔비디아: "Nvidia"
    AI 반도체: "AI chips"
    빅테크 실적: "big tech earnings"
    미국 주식: "US stocks"
    반도체 주가: "semiconductor stocks"
    삼성전자 SK하이닉스: "Samsung SK Hynix"
    기업 지분 투자: "strategic stake investment"
    데이터센터 투자: "data center investment"
  max_headlines: 80

sources:
  recent_first: true          # 원본 영상 검색 시 이번 주 업로드를 먼저 찾고, 없으면 전체에서
  # 원본 영상 자동 선택 시 우선할 채널 (채널 이름에 포함되면 가산점)
  prefer_channels: ["NVIDIA", "Bloomberg", "CNBC", "Yahoo Finance", "Reuters", "WSJ", "Financial Times",
                    "삼성전자", "SK hynix", "SK하이닉스", "NAVER", "네이버", "현대자동차",
                    "KBS", "MBC", "SBS", "JTBC", "YTN", "연합뉴스", "한국경제TV", "매일경제TV", "서울경제TV"]

clips:
  format: "bv*[height<=1080]+ba/b[height<=1080]/b"
  cookies_from_browser: ""    # YouTube 봇 확인이 뜨면 "chrome" / "edge" / "firefox"

# 사람이 확인해야 다음 단계로 넘어가는 지점.
# auto 로 바꾸면 해당 게이트를 자동 통과시킵니다.
gates:
  topic: manual
  script: manual
  draft: manual
