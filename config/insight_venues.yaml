# 인사이트 자리 — 기술·시장 인사이트가 나오는 곳을 넓게 (2026-11-26 사용자: "사람을 감시하기보다는 좀 더 폭넓게 다루고싶어요",
# docs/70). 사람 목록이 아니라 '인터뷰·강연·팟캐스트가 올라오는 자리'를 매일 훑고, 그 안에서 '앞으로에 대한 판단'을 골라낸다.
# 사람 이름(ceo_watch·radar extra)은 거르는 조건이 아니라 점수 가산만.
#
# handle: 유튜브 @이름 — @ 가 없는 채널은 UC… 채널 id 그대로 (채널 id 는 처음 실행 때 찾아 inbox/insights/venues_cache.json 에 저장)
# weight: 1 보통 · 2 좋음 · 3 1차 원본(본인·회사·대형 행사) / area: tech · market (둘 다면 both)
# 늘리기: 이 파일에 한 줄 더하기. 찾지 못한 handle 은 실행 로그에 '! 자리 못 찾음'으로 남는다.

window_days: 7          # 이 기간 안에 올라온 영상만
min_minutes: 12         # 이보다 짧은 것(클립·요약)은 제외 — 인터뷰·강연·대담 위주
per_venue: 8            # 자리마다 최근 몇 편까지 볼지
extract_top: 8          # 하루에 자막까지 열어 판단을 뽑을 후보 수

